# actionlint configuration (auto-loaded by `actionlint`, run via vrg-validate).
paths:
  .github/workflows/cd-release.yml:
    ignore:
      # package-sign reads PACKAGE_SIGNING_KEY / PACKAGE_SIGNING_PASSPHRASE from
      # its `package-signing` environment (delivered because the caller passes
      # `secrets: inherit`; vergil-project/packages#6). They are not declared
      # under on.workflow_call.secrets, and actionlint cannot see environment
      # secrets, so ignore exactly these two references.
      - 'property "package_signing_(key|passphrase)" is not defined in object type'
  .github/workflows/ops-github-config.yml:
    ignore:
      # The trusted-authors-check token asks for read-only organization and
      # repository Variables. actions/create-github-app-token's metadata
      # declares no input for either, but the action turns every
      # permission-* input into a token permission (organization_actions_variables
      # and actions_variables in GitHub's App permissions), so ignore exactly
      # these two inputs.
      - 'input "permission-(organization-)?actions-variables" is not defined in action "actions/create-github-app-token@v3"'
