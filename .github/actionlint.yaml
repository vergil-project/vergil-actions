# actionlint configuration (auto-loaded by `actionlint`, run via vrg-validate).
paths:
  .github/workflows/cd-release.yml:
    ignore:
      # package-sign reads PACKAGE_SIGNING_KEY / PACKAGE_SIGNING_PASSPHRASE from
      # its `package-signing` environment. They must NOT be declared under
      # on.workflow_call.secrets: a declared-but-unpassed secret shadows the
      # environment secret with an empty value (vergil-actions#913). actionlint
      # cannot see environment secrets, so ignore exactly these two references.
      - 'property "package_signing_(key|passphrase)" is not defined in object type'
