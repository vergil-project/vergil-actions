name: Ops — Epic Rollup

on:
  workflow_call:
    inputs:
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".
      epic-repo:
        type: string
        required: false
        default: .github
        description: >-
          Repo within the caller's org that holds epics. The App token is
          scoped to this repo so rollup can close the cross-repo parent epic.
          Defaults to ".github".
    secrets:
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  epic-rollup:
    name: epic-rollup
    runs-on: ubuntu-24.04
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            ${{ inputs.epic-repo }}
          # The rollup reads the task and its parent epic and closes the epic
          # (or files it under a standing epic's archive): Issues write only.
          permission-issues: write

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.92

      - name: Roll up parent epic
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
        run: vrg-epic-rollup --task "${{ github.repository }}#${{ github.event.issue.number }}"

  # Reports epic-rollup's result to the org's operations queue (epic
  # vergil-project/.github#1494, spec §5.3).
  # The checkout comes first: setting up Vergil reads the workspace's
  # vergil.toml, and the local ./actions/ ref resolves against it. The action
  # mints its own issues-only App token, only on refs/heads/develop, so this
  # job's GITHUB_TOKEN stays read-only. No concurrency group: GitHub keeps one
  # pending run per group and cancels the older, which would drop a report.
  # actions/ops/report/tests/reporting-jobs.test.sh guards this layout.
  report:
    name: report
    needs: epic-rollup
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report epic-rollup
        uses: vergil-project/vergil-actions/actions/ops/report@v2.1.92
        env:
          VRG_AUTOMATION_APP: ${{ vars.VRG_AUTOMATION_APP }}
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
        with:
          job: epic-rollup
          results: ${{ needs.epic-rollup.result }}
          app-client-id: ${{ secrets.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
