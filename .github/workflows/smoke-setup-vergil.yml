name: Smoke - setup/vergil outputs

# Smoke test for the shared setup/vergil action's resolver outputs
# (`versions`, `primary-version`, `primary-container-tag`, `container-tags`,
# `container-suffixes`), the ci/matrix action built from them, and the
# ci/toolchain/assert and ci/toolchain/pin-python actions (epics
# vergil-project/.github#338 and #407).
#
#   * fixtures — installs vergil-tooling with the setup action itself (for the
#     real `vrg-ci-resolve`), then runs the framework-free harnesses:
#       - derive.sh: the resolver's answer copied to the outputs, across
#         library, app, packaged-app, C++ family, primary-version override and
#         no-language fixtures, read from a fixture window through
#         VRG_VERSION_WINDOW; and loud failure on a resolver error, a missing
#         vergil.toml, an unreadable window, or a missing resolver;
#       - read-pin.sh: the pinned [dependencies].vergil tag, and a clean
#         ::error:: for a missing file, missing key, or empty/invalid value
#         (issue #977);
#       - install-tooling.sh: the install path chosen from the tag and the
#         environment (packaged in a container with the vergil apt source and
#         a core Python, uv from git with neither, a refusal with one; on a
#         host runner the vergil apt repository bootstrapped with the pinned
#         key fingerprint and the bootstrap source removed; the dev-tag,
#         self-repo and install-source: git paths), the apt candidate check,
#         and the pinned, hash-checked uv (epic vergil-project/.github#649);
#       - ci/matrix resolve.sh: images from the resolver's tags and suffixes,
#         the run-once collapse to the primary, and loud failure on a missing
#         tag/suffix or a container-suffix the resolver did not choose;
#       - shared/setup/primary-suffix image.test.sh: the single-container
#         jobs (ci-quality common and custom, ci-version-bump, cd-release
#         release) run on the resolver's primary suffix and tag (C++ clang-20
#         -> prod-cpp-clang:20, Python unchanged, no language -> prod-base), no
#         workflow job builds its image from inputs.container-suffix or
#         inputs.language, and a mismatched caller suffix fails (issue #1028);
#       - container-prefix.test.sh: every reusable workflow that runs a job
#         in a vergil image takes its prefix from its own container-prefix
#         input (a `<prefix>-` container line, or a matrix image from
#         ci/matrix or package/image-prefix given the input), passes the
#         input on to the workflows it calls, declares it, and names no
#         `prod-` image literally (issue #1134);
#       - ci/evidence gate.test.sh: every ci-quality stage job is in the
#         evidence job's needs and its "Assert all required legs succeeded"
#         RESULTS, so a failed or skipped stage fails quality / evidence
#         (epic vergil-project/.github#488);
#       - ci/toolchain/assert assert.sh: Python and Go version checks against a
#         fake uv/go, and the notice for other languages;
#       - ci/toolchain/pin-python pin.sh: UV_PYTHON and
#         UV_PYTHON_PREFERENCE=only-system written to GITHUB_ENV, loud failure
#         on a bad version, every Python leg of ci-quality, ci-audit and
#         ci-test pinning through it, and every uv command in any workflow
#         job or composite action pinning the interpreter source with
#         UV_PYTHON_PREFERENCE=only-system (issue #1002);
#       - the package setup action's detect.sh (self-repo vs.
#         [dependencies].vergil install spec; epic vergil-project/.github#356);
#       - the package setup action's check-toolchain.sh: a package toolchain
#         image's /etc/vergil/package-toolchain marker against the tools on
#         PATH, failing on a missing marker (a raw image), a required tool
#         the marker leaves out, a missing or mismatched tool, a missing nfpm
#         when nFPM is needed, and an empty or malformed marker (epic
#         vergil-project/.github#607).
#   * action-e2e — calls the setup action against a Python library fixture and
#     a fixture window (the `version-window` input), asserts all five outputs
#     are wired through action.yml, and feeds them to ci/matrix.

on:
  workflow_dispatch:
  pull_request:
    # The pin-python harness's uv source guard scans every workflow and every
    # composite action, so a change to any of them can add an unpinned uv
    # command (issue #1002). These two globs also cover the setup/vergil,
    # toolchain, matrix and package setup actions the other harnesses test.
    paths:
      - actions/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  fixtures:
    name: harness fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # The derive.sh harness runs the real resolver, so install vergil-tooling
      # at this repo's [dependencies].vergil pin first.
      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.64
      - name: Run derive.sh harness
        shell: bash
        run: bash actions/shared/setup/vergil/tests/derive.test.sh
      - name: Run read-pin.sh harness
        shell: bash
        run: bash actions/shared/setup/vergil/tests/read-pin.test.sh
      - name: Run install-tooling.sh harness
        shell: bash
        run: bash actions/shared/setup/vergil/tests/install-tooling.test.sh
      - name: Run ci/matrix resolve.sh harness
        shell: bash
        run: bash actions/ci/matrix/tests/resolve.test.sh
      - name: Run shared/setup/primary-suffix image harness
        shell: bash
        run: bash actions/shared/setup/primary-suffix/tests/image.test.sh
      - name: Run container-prefix harness
        shell: bash
        run: bash actions/shared/setup/primary-suffix/tests/container-prefix.test.sh
      - name: Run ci/evidence gate harness
        shell: bash
        run: bash actions/ci/evidence/tests/gate.test.sh
      - name: Run ci/toolchain/assert assert.sh harness
        shell: bash
        run: bash actions/ci/toolchain/assert/tests/assert.test.sh
      - name: Run ci/toolchain/pin-python pin.sh harness
        shell: bash
        run: bash actions/ci/toolchain/pin-python/tests/pin.test.sh
      - name: Run package setup detect.sh harness
        shell: bash
        run: bash actions/package/setup/tests/detect.test.sh
      - name: Run package setup check-toolchain.sh harness
        shell: bash
        run: bash actions/package/setup/tests/check-toolchain.test.sh

  action-e2e:
    name: action outputs (Python library fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write a Python library fixture vergil.toml
        shell: bash
        run: |
          cat > vergil.toml <<'TOML'
          [project]
          repository-type = "library"
          versioning-scheme = "semver"
          branching-model = "library-release"
          release-model = "tagged-release"
          primary-language = "python"

          [ci]
          integration-tests = false

          [dependencies]
          vergil = "v2.1"
          TOML

      - name: Run the setup action against the fixture
        id: setup
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.64
        with:
          version-window: actions/shared/setup/vergil/tests/fixtures/window.json

      - name: Assert the five resolver outputs
        shell: bash
        env:
          VERSIONS: ${{ steps.setup.outputs.versions }}
          PRIMARY: ${{ steps.setup.outputs.primary-version }}
          PRIMARY_TAG: ${{ steps.setup.outputs.primary-container-tag }}
          TAGS: ${{ steps.setup.outputs.container-tags }}
          SUFFIXES: ${{ steps.setup.outputs.container-suffixes }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            echo "$1=$2"
            if [ "$2" != "$3" ]; then
              echo "::error::$1 mismatch: expected $3, got $2"
              failed=1
            fi
          }
          # An unpinned library builds the whole fixture window, newest first.
          check versions "$VERSIONS" '["3.15","3.14","3.13"]'
          check primary-version "$PRIMARY" "3.15"
          check primary-container-tag "$PRIMARY_TAG" "3.15"
          check container-tags "$TAGS" '{"3.15":"3.15","3.14":"3.14","3.13":"3.13"}'
          check container-suffixes "$SUFFIXES" '{"3.15":"python","3.14":"python","3.13":"python"}'
          [ "$failed" -eq 0 ]
          echo "All five outputs correct."

      - name: Build the matrix from the outputs
        id: matrix
        uses: vergil-project/vergil-actions/actions/ci/matrix@v2.1.64
        with:
          language: python
          versions: ${{ steps.setup.outputs.versions }}
          primary-version: ${{ steps.setup.outputs.primary-version }}
          container-tags: ${{ steps.setup.outputs.container-tags }}
          container-suffixes: ${{ steps.setup.outputs.container-suffixes }}
          container-suffix: python

      - name: Assert the matrix
        shell: bash
        env:
          ALL: ${{ steps.matrix.outputs.all }}
        run: |
          set -euo pipefail
          reg="ghcr.io/vergil-project"
          expected="[{\"version\":\"3.15\",\"image\":\"$reg/prod-python:3.15\"},{\"version\":\"3.14\",\"image\":\"$reg/prod-python:3.14\"},{\"version\":\"3.13\",\"image\":\"$reg/prod-python:3.13\"}]"
          echo "all=$ALL"
          if ! jq -en --argjson a "$ALL" --argjson e "$expected" '$a == $e' >/dev/null; then
            echo "::error::matrix mismatch: expected $expected, got $ALL"
            exit 1
          fi
          echo "Matrix correct."
