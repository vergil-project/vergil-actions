name: Smoke - setup/vergil outputs

# Smoke test for the shared setup/vergil action's resolver outputs
# (`versions`, `primary-version`, `primary-container-tag`, `container-tags`,
# `container-suffixes`, `build-enabled`), the ci/matrix action built from
# them, and the ci/toolchain/assert, ci/toolchain/pin-python and
# ci/toolchain/install-python actions (epics
# vergil-project/.github#338 and #407).
#
#   * fixtures — installs vergil-tooling with the setup action itself (for the
#     real `vrg-ci-resolve`), then runs the framework-free harnesses:
#       - derive.sh: the resolver's answer copied to the outputs, across
#         library, app, packaged-app, C++ family, primary-version override and
#         no-language fixtures, read from a fixture window through
#         VRG_VERSION_WINDOW; and loud failure on a resolver error, a missing
#         vergil.toml, an unreadable window, or a missing resolver;
#       - read-pin.sh: the pinned [dependencies].vergil tag, and a clean
#         ::error:: for a missing file, missing key, or empty/invalid value
#         (issue #977);
#       - install-tooling.sh: `uv tool install` from git on every path (a
#         released ref resolved once to one commit SHA and installed with
#         that commit's uv.lock as constraints, a dev ref unconstrained),
#         with --no-config and the uv interpreter variables cleared, the
#         image's VERGIL_CORE_PYTHON_DIR in container jobs, the check that
#         vrg-whoami runs from uv's tool bin directory, no apt call on any
#         path, the self-repo sync, and the pinned, hash-checked uv (epics
#         vergil-project/.github#649 and #1350);
#       - ci/matrix resolve.sh: images from the resolver's tags and suffixes,
#         the run-once collapse to the primary, and loud failure on a missing
#         tag/suffix or a container-suffix the resolver did not choose;
#       - shared/setup/primary-suffix image.test.sh: the single-container
#         jobs (ci-quality common and custom, ci-version-bump, cd-release
#         release) run on the resolver's primary suffix and tag (C++ clang-20
#         -> prod-cpp-clang:20, Python unchanged, no language -> prod-base), no
#         workflow job builds its image from inputs.container-suffix or
#         inputs.language, and a mismatched caller suffix fails (issue #1028);
#       - container-prefix.test.sh: every reusable workflow that runs a job
#         in a vergil image takes its prefix from its own container-prefix
#         input (a `<prefix>-` container line, or a matrix image from
#         ci/matrix or package/image-prefix given the input), passes the
#         input on to the workflows it calls, declares it, and names no
#         `prod-` image literally (issue #1134);
#       - ci/evidence gate.test.sh: every ci-quality stage job is in the
#         evidence job's needs and its "Assert all required legs succeeded"
#         RESULTS, so a failed or skipped stage fails quality / evidence
#         (epic vergil-project/.github#488);
#       - ci/evidence/assert build-gate.test.sh: the quality evidence gate's
#         check of the build job, passing only for BUILD off and the job
#         skipped or BUILD on and the job succeeded (epic
#         vergil-project/.github#1174);
#       - ci/evidence security-tools.test.sh: ci-security's evidence job
#         names every scanner whose SARIF partial it bundles in the
#         security gate's tools, codeql only when its job passed, and two
#         broken copies of the workflow fail the check (issue #1215);
#       - ci/evidence security-gate.test.sh: ci-security's codeql job runs
#         whenever run-security and run-codeql are true, and its evidence
#         gate accepts a skipped codeql job only when run-codeql is false
#         (epic vergil-project/.github#1476);
#       - ci/evidence/reports reports.sh: each language's test, audit, lint
#         and typecheck report files (Rust's cargo-deny.json, not Python's
#         names), staged version-suffixed; a passing gate with a missing or
#         empty report fails loudly, and a language with no report contract
#         warns; expect mode requires every lint and typecheck report in the
#         quality evidence job; ci-test, ci-audit and ci-quality stage and
#         take their tools through it (issues #1211, #1249);
#       - shared/setup/vergil trusted-authors-env.test.sh: every step that
#         runs a vrg-* command that calls GitHub, itself or through a local
#         composite action, takes VRG_TRUSTED_AUTHORS from the org variable
#         in its own env, and no workflow or job env sets it (issue #1351);
#       - ops/github-config automation-env.test.sh: no workflow or job env
#         sets VRG_AUTOMATION_APP, every step that does takes it from the org
#         variable alongside either a GH_TOKEN minted by an earlier step or,
#         with no GH_TOKEN, the App's client ID and key from secrets as
#         VRG_AUTOMATION_CLIENT_ID and VRG_AUTOMATION_PRIVATE_KEY (epic
#         vergil-project/.github#1168), and ops-github-config's update step
#         sets it, so a token-less step (the setup action's vrg-whoami check)
#         never runs as the automation identity (issue #1192);
#       - ops/github-config trusted-authors-check.test.sh: ops-github-config's
#         trusted-authors-check job runs only in the org's .github
#         repository, and runs `vrg-trusted-authors check --org` as the
#         automation App, with a token scoped to the org's installation
#         and read-only Variables and Metadata only, and uploads the
#         --values-out file as trusted-authors-values with `if: always()`
#         (issue #1353);
#       - ops/upstream-refresh key-boundary.test.sh: ops-upstream-refresh's
#         key boundary, the App's credentials only on publish's tool step,
#         none on prepare, which has a read-only token, the develop guard
#         first in each job, no if:, both timeouts and the per-repo
#         concurrency group (epic vergil-project/.github#1168);
#       - ops/agent-audit agent-audit.test.sh: ops-agent-audit's layout,
#         the develop guard first, one repo-scoped App token with exactly
#         Contents write and Pull requests, Issues and Metadata read, the
#         App keys only on that step, a full-history checkout of develop,
#         one `vrg-agent-audit --repo` step and no ops-report (issue #1341);
#       - ci/toolchain/assert assert.sh: Python, Go, Rust and TypeScript
#         version checks against a fake uv, go, rustc and node, and the
#         notice for other languages;
#       - ci/toolchain/pin-python pin.sh: UV_PYTHON and
#         UV_PYTHON_PREFERENCE=only-system written to GITHUB_ENV, loud failure
#         on a bad version, every Python leg of ci-quality, ci-audit and
#         ci-test pinning through it, and every uv command in any workflow
#         job or composite action, bar the listed exemptions, pinning the
#         interpreter source with UV_PYTHON_PREFERENCE=only-system (issue
#         #1002; the exemptions are documented in
#         docs/site/docs/actions/ci-toolchain-pin-python.md);
#       - ci/toolchain/install-python install.sh: uv sync against a fake uv,
#         skipped with a notice only when pyproject.toml and uv.lock are both
#         missing, a partial bootstrap or a failing uv sync failing the step,
#         and every Python leg of ci-quality, ci-audit and ci-test installing
#         through it after its pin (issue #1206);
#       - the package setup action's detect.sh (self-repo vs.
#         [dependencies].vergil install spec, epic vergil-project/.github#356;
#         a line pin resolved to its newest vX.Y.Z tag and one commit SHA,
#         that commit's uv.lock exported as constraints, and the install run
#         with --no-config --managed-python, issue #1318);
#       - the package setup action's check-toolchain.sh: a package toolchain
#         image's /etc/vergil/package-toolchain marker against the tools on
#         PATH, failing on a missing marker (a raw image), a required tool
#         the marker leaves out, a missing or mismatched tool, a missing nfpm
#         when nFPM is needed, and an empty or malformed marker (epic
#         vergil-project/.github#607);
#       - ci/security/codeql resolve-language.sh: the primary-language to
#         CodeQL-language mapping, failing closed on a missing language;
#       - shared/security/trivy scan.sh: the scan's retry and its passed,
#         findings and error outcomes against a stub docker (issue #1079);
#       - shared/setup/build-command install.sh: the fail-closed, no-retry
#         run of the container build command;
#       - shared/setup/system-packages install.sh: the retried, fail-closed
#         system package install.
#     Validation (scripts/bin/check-test-suites-run) fails on any *.test.sh
#     that no workflow and no part of validation runs, so a new harness must
#     be wired here or in another workflow (issue #1202).
#   * action-e2e — calls the setup action against a Python library fixture and
#     a fixture window (the `version-window` input), asserts all six outputs
#     are wired through action.yml, and feeds them to ci/matrix.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    # The pin-python harness's uv source guard scans every workflow and every
    # composite action, so a change to any of them can add an unpinned uv
    # command (issue #1002). These two globs also cover the setup/vergil,
    # toolchain, matrix and package setup actions the other harnesses test.
    paths:
      - actions/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  fixtures:
    name: harness fixtures
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # The derive.sh harness runs the real resolver, so install vergil-tooling
      # at this repo's [dependencies].vergil pin first.
      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.96
      - name: Run derive.sh harness
        shell: bash
        run: bash actions/shared/setup/vergil/tests/derive.test.sh
      - name: Run read-pin.sh harness
        shell: bash
        run: bash actions/shared/setup/vergil/tests/read-pin.test.sh
      - name: Run install-tooling.sh harness
        shell: bash
        run: bash actions/shared/setup/vergil/tests/install-tooling.test.sh
      - name: Run ci/matrix resolve.sh harness
        shell: bash
        run: bash actions/ci/matrix/tests/resolve.test.sh
      - name: Run shared/setup/primary-suffix image harness
        shell: bash
        run: bash actions/shared/setup/primary-suffix/tests/image.test.sh
      - name: Run container-prefix harness
        shell: bash
        run: bash actions/shared/setup/primary-suffix/tests/container-prefix.test.sh
      - name: Run ci/evidence gate harness
        shell: bash
        run: bash actions/ci/evidence/tests/gate.test.sh
      - name: Run ci/evidence/assert build-gate.sh harness
        shell: bash
        run: bash actions/ci/evidence/assert/tests/build-gate.test.sh
      - name: Run ci/evidence security-tools harness
        shell: bash
        run: bash actions/ci/evidence/tests/security-tools.test.sh
      - name: Run ci/evidence security-gate harness
        shell: bash
        run: bash actions/ci/evidence/tests/security-gate.test.sh
      - name: Run ci/evidence/reports reports.sh harness
        shell: bash
        run: bash actions/ci/evidence/reports/tests/reports.test.sh
      - name: Run shared/setup/vergil trusted-authors-env harness
        shell: bash
        run: bash actions/shared/setup/vergil/tests/trusted-authors-env.test.sh
      - name: Run ops/github-config automation-env harness
        shell: bash
        run: bash actions/ops/github-config/tests/automation-env.test.sh
      - name: Run ops/github-config trusted-authors-check harness
        shell: bash
        run: bash actions/ops/github-config/tests/trusted-authors-check.test.sh
      - name: Run ops/upstream-refresh key-boundary harness
        shell: bash
        run: bash actions/ops/upstream-refresh/tests/key-boundary.test.sh
      - name: Run ops/agent-audit layout harness
        shell: bash
        run: bash actions/ops/agent-audit/tests/agent-audit.test.sh
      - name: Run ci/toolchain/assert assert.sh harness
        shell: bash
        run: bash actions/ci/toolchain/assert/tests/assert.test.sh
      - name: Run ci/toolchain/pin-python pin.sh harness
        shell: bash
        run: bash actions/ci/toolchain/pin-python/tests/pin.test.sh
      - name: Run ci/toolchain/install-python install.sh harness
        shell: bash
        run: bash actions/ci/toolchain/install-python/tests/install.test.sh
      - name: Run package setup detect.sh harness
        shell: bash
        run: bash actions/package/setup/tests/detect.test.sh
      - name: Run package setup check-toolchain.sh harness
        shell: bash
        run: bash actions/package/setup/tests/check-toolchain.test.sh
      - name: Run ci/security/codeql resolve-language.sh harness
        shell: bash
        run: bash actions/ci/security/codeql/tests/resolve-language.test.sh
      - name: Run shared/security/trivy scan.sh harness
        shell: bash
        run: bash actions/shared/security/trivy/tests/scan.test.sh
      - name: Run shared/setup/build-command install.sh harness
        shell: bash
        run: bash actions/shared/setup/build-command/tests/install.test.sh
      - name: Run shared/setup/system-packages install.sh harness
        shell: bash
        run: bash actions/shared/setup/system-packages/tests/install.test.sh

  action-e2e:
    name: action outputs (Python library fixture)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write a Python library fixture vergil.toml
        shell: bash
        run: |
          cat > vergil.toml <<'TOML'
          [project]
          repository-type = "library"
          versioning-scheme = "semver"
          branching-model = "library-release"
          release-model = "tagged-release"
          primary-language = "python"

          [ci]
          integration-tests = false

          [dependencies]
          vergil = "v2.1"
          TOML

      - name: Run the setup action against the fixture
        id: setup
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.96
        with:
          version-window: actions/shared/setup/vergil/tests/fixtures/window.json

      - name: Assert the six resolver outputs
        shell: bash
        env:
          VERSIONS: ${{ steps.setup.outputs.versions }}
          PRIMARY: ${{ steps.setup.outputs.primary-version }}
          PRIMARY_TAG: ${{ steps.setup.outputs.primary-container-tag }}
          TAGS: ${{ steps.setup.outputs.container-tags }}
          SUFFIXES: ${{ steps.setup.outputs.container-suffixes }}
          BUILD_ENABLED: ${{ steps.setup.outputs.build-enabled }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            echo "$1=$2"
            if [ "$2" != "$3" ]; then
              echo "::error::$1 mismatch: expected $3, got $2"
              failed=1
            fi
          }
          # An unpinned library builds the whole fixture window, newest first.
          check versions "$VERSIONS" '["3.15","3.14","3.13"]'
          check primary-version "$PRIMARY" "3.15"
          check primary-container-tag "$PRIMARY_TAG" "3.15"
          check container-tags "$TAGS" '{"3.15":"3.15","3.14":"3.14","3.13":"3.13"}'
          check container-suffixes "$SUFFIXES" '{"3.15":"python","3.14":"python","3.13":"python"}'
          # build-enabled is vergil-tooling's to decide per language, so only
          # its wiring is checked here: "true" or "false", never empty.
          echo "build-enabled=$BUILD_ENABLED"
          case "$BUILD_ENABLED" in
            true | false) ;;
            *)
              echo "::error::build-enabled is '$BUILD_ENABLED', expected true or false"
              failed=1
              ;;
          esac
          [ "$failed" -eq 0 ]
          echo "All six outputs correct."

      - name: Build the matrix from the outputs
        id: matrix
        uses: vergil-project/vergil-actions/actions/ci/matrix@v2.1.96
        with:
          language: python
          versions: ${{ steps.setup.outputs.versions }}
          primary-version: ${{ steps.setup.outputs.primary-version }}
          container-tags: ${{ steps.setup.outputs.container-tags }}
          container-suffixes: ${{ steps.setup.outputs.container-suffixes }}
          container-suffix: python

      - name: Assert the matrix
        shell: bash
        env:
          ALL: ${{ steps.matrix.outputs.all }}
        run: |
          set -euo pipefail
          reg="ghcr.io/vergil-project"
          expected="[{\"version\":\"3.15\",\"image\":\"$reg/prod-python:3.15\"},{\"version\":\"3.14\",\"image\":\"$reg/prod-python:3.14\"},{\"version\":\"3.13\",\"image\":\"$reg/prod-python:3.13\"}]"
          echo "all=$ALL"
          if ! jq -en --argjson a "$ALL" --argjson e "$expected" '$a == $e' >/dev/null; then
            echo "::error::matrix mismatch: expected $expected, got $ALL"
            exit 1
          fi
          echo "Matrix correct."
