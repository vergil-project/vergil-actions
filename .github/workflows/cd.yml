name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

# Keyed by branch so a develop push never replaces a pending main run:
# GitHub keeps one pending run per group even without cancel-in-progress.
# The docs job's shared cd-docs group still serializes the site deploys.
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: "release / release"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: automation
    container: ghcr.io/vergil-project/prod-base:latest
    defaults:
      run:
        shell: bash
    steps:
      # Generate the App token first so checkout can use it. The freeze-
      # internal-refs step below modifies .github/workflows/*.yml, and
      # GITHUB_TOKEN is forbidden from pushing workflow-file changes.
      # The App (APP_CLIENT_ID/APP_PRIVATE_KEY) holds workflows:write.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Scoped to this repo only, with only what the release needs:
          # Contents write to fetch and push the release tags, and Workflows
          # write because the tagged commit changes .github/workflows/*.yml.
          # The GitHub Release itself is created with GITHUB_TOKEN.
          permission-contents: write
          permission-workflows: write

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil

      - name: Extract version
        id: version
        run: |
          version=$(vrg-version show)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Freeze internal refs to release tag
        if: steps.tag_check.outputs.exists == 'false'
        uses: ./actions/local/freeze-internal-refs
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Tag and release
        if: steps.tag_check.outputs.exists == 'false'
        uses: ./actions/cd/release/tag-and-release
        with:
          version: ${{ steps.version.outputs.version }}
          # The same App token the checkout used; it carries the Workflows
          # write this repo's tag push needs.
          tag-token: ${{ steps.app-token.outputs.token }}

  docs:
    uses: ./.github/workflows/cd-docs.yml
    permissions:
      contents: write
    # The App secrets reach cd-docs.yml's report job, which reports this
    # repo's develop docs deploys as docs-deploy-develop (epic
    # vergil-project/.github#1494), and cd-docs.yml's docs job, which pushes
    # gh-pages as the App. `inherit` carries the App keys from the
    # `automation` environment. Allowed only for the App-key workflows
    # (vrg-validate's secrets-inherit check).
    secrets: inherit
