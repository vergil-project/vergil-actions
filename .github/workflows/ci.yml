name: CI

on:
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: vergil-project/vergil-actions/.github/workflows/ci-docs.yml@v2.1.16

  quality:
    uses: vergil-project/vergil-actions/.github/workflows/ci-quality.yml@v2.1.16
    with:
      language: shell
      versions: '["latest"]'
      container-prefix: dev
      container-suffix: base
      container-tag: 'latest'

  security:
    uses: vergil-project/vergil-actions/.github/workflows/ci-security.yml@v2.1.16
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      language: shell
      run-codeql: false
      container-prefix: dev
      container-suffix: base
      container-tag: 'latest'

  version:
    uses: vergil-project/vergil-actions/.github/workflows/ci-version-bump.yml@v2.1.16
    with:
      language: shell
      container-prefix: dev
      container-suffix: base
      container-tag: 'latest'
