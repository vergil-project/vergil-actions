name: CI Quality

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      versions:
        type: string
        required: true
      container-suffix:
        type: string
        required: false
        description: >-
          Container image name suffix (e.g. python, go, base). Used by the
          common job and by the matrix-resolved per-version jobs. Callers
          whose language is "shell" or "none" should pass "base". Ignored for
          the per-version cpp jobs, whose suffix (cpp-clang / cpp-gcc) is
          derived from the version token.
      container-tag:
        type: string
        required: false
        description: >-
          Container image tag for non-matrix jobs (e.g. common).
          Defaults to "latest".
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

jobs:
  # Resolve the per-version job matrix (version label + container image),
  # applying C++ compiler-family image routing and per-kind cardinality.
  # LINT is a run-once kind, so it consumes the `once` output (primary version
  # only for C++, every version otherwise); TYPECHECK is per-version and
  # consumes `all`.
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.resolve.outputs.all }}
      once: ${{ steps.resolve.outputs.once }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve CI matrix
        id: resolve
        uses: vergil-project/vergil-actions/actions/ci/matrix@v2.1.26
        with:
          language: ${{ inputs.language }}
          versions: ${{ inputs.versions }}
          container-prefix: ${{ inputs.container-prefix }}
          container-suffix: ${{ inputs.container-suffix }}

  common:
    name: common
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ inputs.container-suffix || 'base' }}:${{ inputs.container-tag || 'latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.26

      - name: Run common quality checks
        run: vrg-validate --check common

  lint:
    name: lint / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.once) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.26

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      - name: Run lint
        run: vrg-validate --check lint

  typecheck:
    name: typecheck / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        # TYPECHECK cardinality is per-language. Matrix languages whose
        # typecheck runs per Node/compiler version (e.g. C++) consume `all`;
        # TypeScript runs a single canonical `tsc --noEmit` once (spec §3.6), so
        # it consumes the collapsed `once` output — emitting one
        # `quality / typecheck / <primary>` job that matches the single run-once
        # gate github_config.desired_ci_gates_ruleset keys to ci.versions[0]
        # (Cardinality.ONCE). This is the inverse of C++'s per-version typecheck.
        include: ${{ fromJSON(inputs.language == 'typescript' && needs.matrix.outputs.once || needs.matrix.outputs.all) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.26

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      - name: Run typecheck
        run: vrg-validate --check typecheck

  evidence:
    name: evidence
    # Runs only after the common, lint, and typecheck jobs all succeed, so the
    # artifact's presence is itself proof the quality gate passed. Lint and
    # typecheck report to stdout and emit no files today; the artifact carries
    # evidence.json alone, which is sufficient for completeness.
    needs: [common, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Emit ci-evidence-quality artifact
        uses: vergil-project/vergil-actions/actions/ci/evidence/emit@v2.1.26
        with:
          gate: quality
