name: CI Quality

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      container-suffix:
        type: string
        required: false
        description: >-
          Cross-check only; it never changes an image. Every job takes its
          image suffix from vrg-ci-resolve (cpp-clang / cpp-gcc for C++). The
          common job runs on the primary version's suffix (issue #1028): when
          this is set it must equal that suffix, or the setup job fails. The
          per-version jobs accept any of the resolved suffixes.
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

jobs:
  # Resolve the per-version job matrix (version label + container image) from
  # vrg-ci-resolve's answer, with per-kind cardinality. LINT is a run-once
  # kind, so it consumes the `once` output (the primary version only for C++
  # and TypeScript, every version otherwise); TYPECHECK is per-version and
  # consumes `all`. BUILD is run-once too, and `build-enabled` (vrg-ci-resolve's
  # flag, through the setup action) decides whether the `build` job runs.
  matrix:
    name: matrix
    runs-on: ubuntu-24.04
    outputs:
      all: ${{ steps.resolve.outputs.all }}
      once: ${{ steps.resolve.outputs.once }}
      build-enabled: ${{ steps.setup.outputs.build-enabled }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Resolve the version set. The shared setup action installs
      # vergil-tooling and runs `vrg-ci-resolve` (epic
      # vergil-project/.github#407): the resolver's versions, primary version,
      # and per-version image tags and suffixes are the sole source for the
      # matrix.
      - name: Resolve versions with vrg-ci-resolve
        id: setup
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.85

      - name: Resolve CI matrix
        id: resolve
        uses: vergil-project/vergil-actions/actions/ci/matrix@v2.1.85
        with:
          language: ${{ inputs.language }}
          versions: ${{ steps.setup.outputs.versions }}
          primary-version: ${{ steps.setup.outputs.primary-version }}
          container-tags: ${{ steps.setup.outputs.container-tags }}
          container-suffixes: ${{ steps.setup.outputs.container-suffixes }}
          container-prefix: ${{ inputs.container-prefix }}
          container-suffix: ${{ inputs.container-suffix }}

  # Resolve `primary-container-tag` with vrg-ci-resolve (via the shared setup
  # action) so the single-container common job can resolve its image tag
  # without a hand-set `container-tag` input (epics vergil-project/.github#338
  # and #407). It is the resolver's image tag for the primary version: for
  # family-on-token languages (cpp, typescript) the version carries the
  # compiler/runtime family (clang-20) but the published image tag is the
  # numeric part (20), so using the raw `primary-version` here resolved the
  # nonexistent prod-cpp-clang:clang-20 (issue #893). The matrix legs take
  # their tags from the same resolver answer, so this job runs the same tag the
  # primary leg does. The common job runs on a language image (prod-<lang>:<tag>),
  # which publishes only `:${tag}` and never `:latest` (only prod-base publishes
  # `:latest`), so the old `container-tag || 'latest'` fallback broke the moment
  # a caller stopped passing `container-tag`. The job's `container:` is evaluated
  # before any step runs, so the value must come from a preceding job — mirroring
  # how the matrix job and ci-version-bump's setup job resolve their image.
  # The image suffix is the resolver's too (issue #1028): the primary version's
  # entry in `container-suffixes`, so a C++ repo's common job runs on
  # prod-cpp-clang:20 (as its primary leg does) rather than on whatever suffix
  # the caller passed, or prod-base when it passed none. The caller's
  # `container-suffix` is only a must-match cross-check, as in cd-release.
  setup:
    name: setup
    runs-on: ubuntu-24.04
    outputs:
      primary-container-tag: ${{ steps.derive.outputs.primary-container-tag }}
      primary-container-suffix: ${{ steps.suffix.outputs.primary-container-suffix }}
      primary-version: ${{ steps.derive.outputs.primary-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve the primary version with vrg-ci-resolve
        id: derive
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.85

      # The primary version's image suffix. Fails when the caller passes a
      # container-suffix that disagrees with it.
      - name: Resolve primary-container-suffix
        id: suffix
        uses: vergil-project/vergil-actions/actions/shared/setup/primary-suffix@v2.1.85
        with:
          primary-version: ${{ steps.derive.outputs.primary-version }}
          container-suffixes: ${{ steps.derive.outputs.container-suffixes }}
          container-suffix: ${{ inputs.container-suffix }}

  common:
    name: common
    needs: setup
    runs-on: ubuntu-24.04
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ needs.setup.outputs.primary-container-suffix }}:${{ needs.setup.outputs.primary-container-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.85

      # Capture the common checks' full transcript as a quality report (#925).
      # For a language-less repo (image suffix base, no lint/typecheck
      # tooling) the common checks — repo-profile, markdownlint, shellcheck,
      # yamllint, hadolint, actionlint, ansible-lint — ARE the quality gate, but
      # they emit no structured report file. Without this transcript the
      # ci-evidence-quality artifact carried only evidence.json, which the
      # release-time harvester (correctly) rejects as an empty payload. The
      # transcript is genuine evidence of what ran and passed; pipefail keeps
      # vrg-validate's exit code authoritative for the job result.
      - name: Run common quality checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          vrg-validate --check common 2>&1 | tee ci-reports/quality-common.log

      - name: Upload common report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-quality-reports-common
          path: ci-reports/
          if-no-files-found: warn

  # Run the repo's custom validator (scripts/bin/validate-custom or
  # vrg-validate-custom) in PR CI (epic vergil-project/.github#488). Before
  # this job it ran only in a local `vrg-validate`, so a broken validator
  # never blocked a merge. `vrg-validate --check custom` runs the language
  # install stage and then the custom stage, or prints one
  # "no custom validator" line and exits 0 when the repo has none; a
  # validator that is present but unusable fails loudly. Like `common`, it
  # runs once on the primary version's image, and its transcript is the
  # quality report quality-custom.log. The evidence job needs this job, so a
  # failed or skipped custom stage fails quality / evidence — no new required
  # check and no ruleset change. For Python, uv is pinned to the primary
  # version's image interpreter and the dev group is installed, so the
  # validator sees the repo's dev dependencies.
  custom:
    name: custom
    needs: setup
    runs-on: ubuntu-24.04
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ needs.setup.outputs.primary-container-suffix }}:${{ needs.setup.outputs.primary-container-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.85

      - name: Pin uv to the primary Python interpreter
        if: inputs.language == 'python'
        uses: vergil-project/vergil-actions/actions/ci/toolchain/pin-python@v2.1.85
        with:
          version: ${{ needs.setup.outputs.primary-version }}

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      # Backstop for the pin above, as on the lint and typecheck legs: fail
      # the job if the interpreter or toolchain it actually runs is not the
      # primary version CI resolved.
      - name: assert-toolchain
        uses: vergil-project/vergil-actions/actions/ci/toolchain/assert@v2.1.85
        with:
          language: ${{ inputs.language }}
          expected: ${{ needs.setup.outputs.primary-version }}

      - name: Run custom validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          vrg-validate --check custom 2>&1 | tee ci-reports/quality-custom.log

      - name: Upload custom report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-quality-reports-custom
          path: ci-reports/
          if-no-files-found: warn

  lint:
    name: lint / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.once) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.85

      # Hand uv the leg's resolved version and pin its source to the image
      # (spec §6.5 of epic vergil-project/.github#407): UV_PYTHON plus
      # UV_PYTHON_PREFERENCE=only-system, so the dependency install and every
      # check below run on the image's interpreter for this leg, never one a
      # repo file selects or uv downloads.
      - name: Pin uv to the leg's Python interpreter
        if: inputs.language == 'python'
        uses: vergil-project/vergil-actions/actions/ci/toolchain/pin-python@v2.1.85
        with:
          version: ${{ matrix.version }}

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      # Backstop for the pin above: fail the leg if the interpreter or
      # toolchain it actually runs is not the version CI resolved for it.
      - name: assert-toolchain
        uses: vergil-project/vergil-actions/actions/ci/toolchain/assert@v2.1.85
        with:
          language: ${{ inputs.language }}
          expected: ${{ matrix.version }}

      - name: Run lint
        id: gate
        run: vrg-validate --check lint

      # Bridge this leg's lint report across the job boundary (#836). The lint
      # job and the evidence job run on separate runners with separate
      # filesystems, so the report produced here is stranded unless uploaded.
      # The language's report names come from ci/evidence/reports (#1249),
      # renamed to version-suffixed basenames so each leg stays distinct after
      # the evidence emit step. A passing lint run that wrote no report fails
      # this step.
      - name: Stage lint report for evidence
        if: always()
        uses: vergil-project/vergil-actions/actions/ci/evidence/reports@v2.1.85
        with:
          mode: stage
          language: ${{ inputs.language }}
          gate: lint
          version: ${{ matrix.version }}
          gate-outcome: ${{ steps.gate.outcome }}

      - name: Upload lint report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-quality-reports-lint-${{ matrix.version }}
          path: ci-reports/
          if-no-files-found: warn

  typecheck:
    name: typecheck / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      matrix:
        # TYPECHECK cardinality is per-language. Matrix languages whose
        # typecheck runs per Node/compiler version (e.g. C++) consume `all`;
        # TypeScript runs a single canonical `tsc --noEmit` once (spec §3.6), so
        # it consumes the collapsed `once` output — emitting one
        # `quality / typecheck / <primary>` job on the resolved primary version
        # (Cardinality.ONCE). This is the inverse of C++'s per-version typecheck.
        include: ${{ fromJSON(inputs.language == 'typescript' && needs.matrix.outputs.once || needs.matrix.outputs.all) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.85

      # Hand uv the leg's resolved version and pin its source to the image
      # (spec §6.5 of epic vergil-project/.github#407): UV_PYTHON plus
      # UV_PYTHON_PREFERENCE=only-system, so the dependency install and every
      # check below run on the image's interpreter for this leg, never one a
      # repo file selects or uv downloads.
      - name: Pin uv to the leg's Python interpreter
        if: inputs.language == 'python'
        uses: vergil-project/vergil-actions/actions/ci/toolchain/pin-python@v2.1.85
        with:
          version: ${{ matrix.version }}

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      # Backstop for the pin above: fail the leg if the interpreter or
      # toolchain it actually runs is not the version CI resolved for it.
      - name: assert-toolchain
        uses: vergil-project/vergil-actions/actions/ci/toolchain/assert@v2.1.85
        with:
          language: ${{ inputs.language }}
          expected: ${{ matrix.version }}

      - name: Run typecheck
        id: gate
        run: vrg-validate --check typecheck

      # Bridge this leg's typecheck report across the job boundary (#836). The
      # typecheck job and the evidence job run on separate runners with separate
      # filesystems, so the report produced here is stranded unless uploaded.
      # The language's report names come from ci/evidence/reports (#1249),
      # renamed to version-suffixed basenames so each leg stays distinct after
      # the evidence emit step. A passing typecheck run that wrote no report
      # fails this step.
      - name: Stage typecheck report for evidence
        if: always()
        uses: vergil-project/vergil-actions/actions/ci/evidence/reports@v2.1.85
        with:
          mode: stage
          language: ${{ inputs.language }}
          gate: typecheck
          version: ${{ matrix.version }}
          gate-outcome: ${{ steps.gate.outcome }}

      - name: Upload typecheck report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-quality-reports-typecheck-${{ matrix.version }}
          path: ci-reports/
          if-no-files-found: warn

  # Run the release build before release (epic vergil-project/.github#1174):
  # `vrg-validate --check build` runs the language's build command, the same
  # one the release job runs. The job runs only when vergil-tooling turns
  # BUILD on for the repo's language, which `vrg-ci-resolve` reports as
  # `build-enabled`; no language list lives here, so turning BUILD on for a
  # language in vergil-tooling turns this job on with no change to this
  # workflow. BUILD is run-once, so the job takes the collapsed `once` matrix,
  # the primary version. The evidence job checks its result against the flag
  # (ci/evidence/assert), so a skipped build with BUILD on fails
  # quality / evidence.
  build:
    name: build / ${{ matrix.version }}
    needs: matrix
    if: needs.matrix.outputs.build-enabled == 'true'
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.once) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.85

      # As on the lint and typecheck legs: pin uv to the leg's version and the
      # image's interpreter, so the build runs on the version CI resolved.
      - name: Pin uv to the leg's Python interpreter
        if: inputs.language == 'python'
        uses: vergil-project/vergil-actions/actions/ci/toolchain/pin-python@v2.1.85
        with:
          version: ${{ matrix.version }}

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      # Backstop for the pin above: fail the leg if the interpreter or
      # toolchain it actually runs is not the version CI resolved for it.
      - name: assert-toolchain
        uses: vergil-project/vergil-actions/actions/ci/toolchain/assert@v2.1.85
        with:
          language: ${{ inputs.language }}
          expected: ${{ matrix.version }}

      - name: Run build
        run: vrg-validate --check build

  evidence:
    name: evidence
    # Runs only after the common, custom, lint, and typecheck jobs all
    # succeed, so the artifact's presence is itself proof the quality gate
    # passed. The common job uploads its transcript (quality-common.log) as a
    # partial, so every repo — including a language-less one with no
    # lint/typecheck reports — emits at least one real report file, never an
    # evidence.json-only payload (#925). The custom job uploads its transcript
    # (quality-custom.log) the same way, so the custom validator's run — or
    # its "no custom validator" line — is part of the evidence (epic
    # vergil-project/.github#488). Each lint /
    # typecheck leg uploads its version-suffixed reports (the language's
    # names, from ci/evidence/reports) as a per-version partial; the step
    # below pulls every leg's reports back onto one runner so the emitted
    # bundle carries each version's reports (#836), and the expect step fails
    # the job when any report the language's contract names is missing
    # (#1249). It also needs `build`, which runs only when BUILD is on for the
    # language, and `matrix`, for the `build-enabled` flag its result is
    # checked against (epic vergil-project/.github#1174).
    needs: [matrix, common, custom, lint, typecheck, build]
    # Run even when a required leg fails or is skipped (default would skip this
    # job, leaving the gate green-by-absence). The assert step below then turns
    # any non-success upstream result into a FAILED evidence job (#873, epic
    # vergil-project/.github#338).
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Fail red (not skip) when any required matrix leg did not succeed. Uses
      # needs.<job>.result — for a matrix job that is 'success' only when every
      # leg succeeded, and 'failure'/'skipped'/'cancelled' otherwise. This is
      # the first step, so a non-success result fails the job before any report
      # is emitted, making a red/skipped leg surface as a red evidence gate.
      - name: Assert all required legs succeeded
        shell: bash
        env:
          RESULTS: |
            common=${{ needs.common.result }}
            custom=${{ needs.custom.result }}
            lint=${{ needs.lint.result }}
            typecheck=${{ needs.typecheck.result }}
        run: |
          set -euo pipefail
          failed=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            if [ "$result" != "success" ]; then
              echo "::error::required job '$job' did not succeed (result: '$result')"
              failed=1
            fi
          done <<< "$RESULTS"
          if [ "$failed" -ne 0 ]; then
            echo "evidence gate FAILED: one or more required legs did not succeed"
            exit 1
          fi
          echo "all required legs succeeded"

      - name: Checkout code
        uses: actions/checkout@v6

      # The `build` job is not in RESULTS above: it is skipped by design when
      # BUILD is off. Its result must match vrg-ci-resolve's flag instead:
      # skipped with BUILD off, success with BUILD on. Anything else (a
      # skipped build with BUILD on included) fails here, before any report
      # is emitted.
      - name: Assert the build job matches the BUILD flag
        uses: vergil-project/vergil-actions/actions/ci/evidence/assert@v2.1.85
        with:
          build-enabled: ${{ needs.matrix.outputs.build-enabled }}
          build-result: ${{ needs.build.result }}

      - name: Download per-matrix quality reports
        uses: actions/download-artifact@v7
        with:
          pattern: ci-evidence-quality-reports-*
          path: evidence-reports
          merge-multiple: true

      # The emit action skips a file pattern that matches nothing, so check
      # first that the legs staged every lint and typecheck report the
      # language's contract names (#1249). A language with no contract warns,
      # or for a repository with no fleet primary language notes, and passes.
      - name: Require the lint and typecheck reports
        uses: vergil-project/vergil-actions/actions/ci/evidence/reports@v2.1.85
        with:
          mode: expect
          language: ${{ inputs.language }}
          reports-dir: evidence-reports

      # The tools are the common and custom checks', then the lint and
      # typecheck legs' tools from the same per-language contract.
      - name: Resolve lint evidence tools
        id: lint-tools
        uses: vergil-project/vergil-actions/actions/ci/evidence/reports@v2.1.85
        with:
          mode: tools
          language: ${{ inputs.language }}
          gate: lint

      - name: Resolve typecheck evidence tools
        id: typecheck-tools
        uses: vergil-project/vergil-actions/actions/ci/evidence/reports@v2.1.85
        with:
          mode: tools
          language: ${{ inputs.language }}
          gate: typecheck

      - name: Combine quality evidence tools
        id: tools
        shell: bash
        env:
          LINT_TOOLS: ${{ steps.lint-tools.outputs.tools }}
          TYPECHECK_TOOLS: ${{ steps.typecheck-tools.outputs.tools }}
        run: |
          set -euo pipefail
          tools="$(jq -cn --argjson lint "$LINT_TOOLS" \
            --argjson typecheck "$TYPECHECK_TOOLS" \
            '[{"name": "vrg-validate-common"}, {"name": "vrg-validate-custom"}] + $lint + $typecheck')"
          echo "tools=${tools}" >>"$GITHUB_OUTPUT"
          echo "tools: ${tools}"

      # Every file the legs uploaded is the common or custom transcript or one
      # of the language's declared lint and typecheck reports (the stage step
      # copies nothing else), all named quality-*.
      - name: Emit ci-evidence-quality artifact
        uses: vergil-project/vergil-actions/actions/ci/evidence/emit@v2.1.85
        with:
          gate: quality
          files: evidence-reports/quality-*
          tools: ${{ steps.tools.outputs.tools }}
