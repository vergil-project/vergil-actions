name: CI Quality

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      versions:
        type: string
        required: false
        description: >-
          JSON array of version tokens for the matrix (e.g.
          '["3.12","3.13","3.14"]'). Optional: when omitted (empty), the matrix
          is sourced from [ci].versions in vergil.toml via the setup action's
          `versions` output. A supplied value is honored verbatim (back-compat,
          epic vergil-project/.github#338).
      container-suffix:
        type: string
        required: false
        description: >-
          Container image name suffix (e.g. python, go, base). Used by the
          common job and by the matrix-resolved per-version jobs. Callers
          whose language is "shell" or "none" should pass "base". Ignored for
          the per-version cpp jobs, whose suffix (cpp-clang / cpp-gcc) is
          derived from the version token.
      container-tag:
        type: string
        required: false
        description: >-
          Container image tag for the single-container common job. Optional:
          when omitted, the tag is the `primary-version` derived from
          [ci].versions in vergil.toml via the setup action (epic
          vergil-project/.github#338). A supplied value is honored verbatim
          (back-compat).
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

jobs:
  # Resolve the per-version job matrix (version label + container image),
  # applying C++ compiler-family image routing and per-kind cardinality.
  # LINT is a run-once kind, so it consumes the `once` output (primary version
  # only for C++, every version otherwise); TYPECHECK is per-version and
  # consumes `all`.
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.resolve.outputs.all }}
      once: ${{ steps.resolve.outputs.once }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Source the version set from vergil.toml only when the caller did not
      # supply `inputs.versions`. Runs the shared setup action for its
      # `versions` output (epic vergil-project/.github#338, Task 6). Skipped
      # when `inputs.versions` is provided so the back-compat path pays no
      # install cost and does not require a [ci] section.
      - name: Resolve versions from vergil.toml
        id: setup
        if: inputs.versions == ''
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.34

      - name: Resolve CI matrix
        id: resolve
        uses: vergil-project/vergil-actions/actions/ci/matrix@v2.1.34
        with:
          language: ${{ inputs.language }}
          versions: ${{ inputs.versions != '' && inputs.versions || steps.setup.outputs.versions }}
          container-prefix: ${{ inputs.container-prefix }}
          container-suffix: ${{ inputs.container-suffix }}

  # Derive `primary-version` from [ci].versions in vergil.toml so the
  # single-container common job can resolve its image tag without a hand-set
  # `container-tag` input (epic vergil-project/.github#338). The common job runs
  # on a language image (prod-<lang>:<tag>), which publishes only `:${version}`
  # and never `:latest` (only prod-base publishes `:latest`), so the old
  # `container-tag || 'latest'` fallback breaks the moment a caller stops
  # passing `container-tag`. The job's `container:` is evaluated before any step
  # runs, so the value must come from a preceding job — mirroring how the matrix
  # job and ci-version-bump's setup job resolve their image. Runs
  # unconditionally; when the caller supplies `container-tag` the output is
  # simply unused.
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      primary-version: ${{ steps.derive.outputs.primary-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve primary-version from vergil.toml
        id: derive
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.34

  common:
    name: common
    needs: setup
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ inputs.container-suffix || 'base' }}:${{ inputs.container-tag || needs.setup.outputs.primary-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.34

      - name: Run common quality checks
        run: vrg-validate --check common

  lint:
    name: lint / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.once) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.34

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      - name: Run lint
        run: vrg-validate --check lint

      # Bridge this leg's lint report across the job boundary (#836). The lint
      # job and the evidence job run on separate runners with separate
      # filesystems, so the report produced here is stranded unless uploaded.
      # quality-ruff.json is a locked filename contract with vergil-tooling#2811
      # (which adds its emission); until #2811 releases the file is absent and
      # if-no-files-found: warn keeps this non-fatal. Version-suffix the basename
      # so each leg stays distinct after the evidence emit step.
      - name: Stage lint report for evidence
        if: always()
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          if [ -f quality-ruff.json ]; then
            cp quality-ruff.json "ci-reports/quality-ruff-${VERSION}.json"
          fi

      - name: Upload lint report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-quality-reports-lint-${{ matrix.version }}
          path: ci-reports/
          if-no-files-found: warn

  typecheck:
    name: typecheck / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        # TYPECHECK cardinality is per-language. Matrix languages whose
        # typecheck runs per Node/compiler version (e.g. C++) consume `all`;
        # TypeScript runs a single canonical `tsc --noEmit` once (spec §3.6), so
        # it consumes the collapsed `once` output — emitting one
        # `quality / typecheck / <primary>` job that matches the single run-once
        # gate github_config.desired_ci_gates_ruleset keys to ci.versions[0]
        # (Cardinality.ONCE). This is the inverse of C++'s per-version typecheck.
        include: ${{ fromJSON(inputs.language == 'typescript' && needs.matrix.outputs.once || needs.matrix.outputs.all) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.34

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      - name: Run typecheck
        run: vrg-validate --check typecheck

      # Bridge this leg's typecheck report across the job boundary (#836). The
      # typecheck job and the evidence job run on separate runners with separate
      # filesystems, so the report produced here is stranded unless uploaded.
      # quality-mypy.xml is a locked filename contract with vergil-tooling#2811
      # (which adds its emission); until #2811 releases the file is absent and
      # if-no-files-found: warn keeps this non-fatal. Version-suffix the basename
      # so each leg stays distinct after the evidence emit step.
      - name: Stage typecheck report for evidence
        if: always()
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          if [ -f quality-mypy.xml ]; then
            cp quality-mypy.xml "ci-reports/quality-mypy-${VERSION}.xml"
          fi

      - name: Upload typecheck report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-quality-reports-typecheck-${{ matrix.version }}
          path: ci-reports/
          if-no-files-found: warn

  evidence:
    name: evidence
    # Runs only after the common, lint, and typecheck jobs all succeed, so the
    # artifact's presence is itself proof the quality gate passed. Each lint /
    # typecheck leg uploads its version-suffixed quality-ruff.json /
    # quality-mypy.xml as a per-version partial; the step below pulls every
    # leg's reports back onto one runner so the emitted bundle carries each
    # version's reports. Those filenames are a locked contract with
    # vergil-tooling#2811 — until it releases the globs match nothing and emit
    # skips them, so the artifact carries evidence.json alone (#836).
    needs: [common, lint, typecheck]
    # Run even when a required leg fails or is skipped (default would skip this
    # job, leaving the gate green-by-absence). The assert step below then turns
    # any non-success upstream result into a FAILED evidence job (#873, epic
    # vergil-project/.github#338).
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Fail red (not skip) when any required matrix leg did not succeed. Uses
      # needs.<job>.result — for a matrix job that is 'success' only when every
      # leg succeeded, and 'failure'/'skipped'/'cancelled' otherwise. This is
      # the first step, so a non-success result fails the job before any report
      # is emitted, making a red/skipped leg surface as a red evidence gate.
      - name: Assert all required legs succeeded
        shell: bash
        env:
          RESULTS: |
            common=${{ needs.common.result }}
            lint=${{ needs.lint.result }}
            typecheck=${{ needs.typecheck.result }}
        run: |
          set -euo pipefail
          failed=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            if [ "$result" != "success" ]; then
              echo "::error::required job '$job' did not succeed (result: '$result')"
              failed=1
            fi
          done <<< "$RESULTS"
          if [ "$failed" -ne 0 ]; then
            echo "evidence gate FAILED: one or more required legs did not succeed"
            exit 1
          fi
          echo "all required legs succeeded"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download per-matrix quality reports
        uses: actions/download-artifact@v7
        with:
          pattern: ci-evidence-quality-reports-*
          path: evidence-reports
          merge-multiple: true

      - name: Emit ci-evidence-quality artifact
        uses: vergil-project/vergil-actions/actions/ci/evidence/emit@v2.1.34
        with:
          gate: quality
          files: |
            evidence-reports/quality-ruff-*.json
            evidence-reports/quality-mypy-*.xml
          tools: '[{"name": "ruff"}, {"name": "mypy"}]'
