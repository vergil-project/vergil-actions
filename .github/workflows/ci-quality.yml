name: CI Quality

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      container-suffix:
        type: string
        required: false
        description: >-
          Container image name suffix (e.g. python, go, base). Used by the
          common job. Callers whose language is "shell" or "none" should pass
          "base". The per-version jobs take each version's suffix from
          vrg-ci-resolve (cpp-clang / cpp-gcc for C++) and only cross-check
          this value: when set, it must be one of the resolved suffixes.
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

jobs:
  # Resolve the per-version job matrix (version label + container image) from
  # vrg-ci-resolve's answer, with per-kind cardinality. LINT is a run-once
  # kind, so it consumes the `once` output (the primary version only for C++
  # and TypeScript, every version otherwise); TYPECHECK is per-version and
  # consumes `all`.
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.resolve.outputs.all }}
      once: ${{ steps.resolve.outputs.once }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Resolve the version set. The shared setup action installs
      # vergil-tooling and runs `vrg-ci-resolve` (epic
      # vergil-project/.github#407): the resolver's versions, primary version,
      # and per-version image tags and suffixes are the sole source for the
      # matrix.
      - name: Resolve versions with vrg-ci-resolve
        id: setup
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.53

      - name: Resolve CI matrix
        id: resolve
        uses: vergil-project/vergil-actions/actions/ci/matrix@v2.1.53
        with:
          language: ${{ inputs.language }}
          versions: ${{ steps.setup.outputs.versions }}
          primary-version: ${{ steps.setup.outputs.primary-version }}
          container-tags: ${{ steps.setup.outputs.container-tags }}
          container-suffixes: ${{ steps.setup.outputs.container-suffixes }}
          container-prefix: ${{ inputs.container-prefix }}
          container-suffix: ${{ inputs.container-suffix }}

  # Resolve `primary-container-tag` with vrg-ci-resolve (via the shared setup
  # action) so the single-container common job can resolve its image tag
  # without a hand-set `container-tag` input (epics vergil-project/.github#338
  # and #407). It is the resolver's image tag for the primary version: for
  # family-on-token languages (cpp, typescript) the version carries the
  # compiler/runtime family (clang-20) but the published image tag is the
  # numeric part (20), so using the raw `primary-version` here resolved the
  # nonexistent prod-cpp-clang:clang-20 (issue #893). The matrix legs take
  # their tags from the same resolver answer, so this job runs the same tag the
  # primary leg does. The common job runs on a language image (prod-<lang>:<tag>),
  # which publishes only `:${tag}` and never `:latest` (only prod-base publishes
  # `:latest`), so the old `container-tag || 'latest'` fallback broke the moment
  # a caller stopped passing `container-tag`. The job's `container:` is evaluated
  # before any step runs, so the value must come from a preceding job — mirroring
  # how the matrix job and ci-version-bump's setup job resolve their image.
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      primary-container-tag: ${{ steps.derive.outputs.primary-container-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve primary-container-tag with vrg-ci-resolve
        id: derive
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.53

  common:
    name: common
    needs: setup
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ inputs.container-suffix || 'base' }}:${{ needs.setup.outputs.primary-container-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.53

      # Capture the common checks' full transcript as a quality report (#925).
      # For a language-less repo (container-suffix base, no lint/typecheck
      # tooling) the common checks — repo-profile, markdownlint, shellcheck,
      # yamllint, hadolint, actionlint, ansible-lint — ARE the quality gate, but
      # they emit no structured report file. Without this transcript the
      # ci-evidence-quality artifact carried only evidence.json, which the
      # release-time harvester (correctly) rejects as an empty payload. The
      # transcript is genuine evidence of what ran and passed; pipefail keeps
      # vrg-validate's exit code authoritative for the job result.
      - name: Run common quality checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          vrg-validate --check common 2>&1 | tee ci-reports/quality-common.log

      - name: Upload common report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-quality-reports-common
          path: ci-reports/
          if-no-files-found: warn

  lint:
    name: lint / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.once) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.53

      # Hand uv the leg's resolved version and pin its source to the image
      # (spec §6.5 of epic vergil-project/.github#407): UV_PYTHON plus
      # UV_PYTHON_PREFERENCE=only-system, so the dependency install and every
      # check below run on the image's interpreter for this leg, never one a
      # repo file selects or uv downloads.
      - name: Pin uv to the leg's Python interpreter
        if: inputs.language == 'python'
        uses: vergil-project/vergil-actions/actions/ci/toolchain/pin-python@v2.1.53
        with:
          version: ${{ matrix.version }}

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      # Backstop for the pin above: fail the leg if the interpreter or
      # toolchain it actually runs is not the version CI resolved for it.
      - name: assert-toolchain
        uses: vergil-project/vergil-actions/actions/ci/toolchain/assert@v2.1.53
        with:
          language: ${{ inputs.language }}
          expected: ${{ matrix.version }}

      - name: Run lint
        run: vrg-validate --check lint

      # Bridge this leg's lint report across the job boundary (#836). The lint
      # job and the evidence job run on separate runners with separate
      # filesystems, so the report produced here is stranded unless uploaded.
      # quality-ruff.json is a locked filename contract with vergil-tooling#2811
      # (which adds its emission); until #2811 releases the file is absent and
      # if-no-files-found: warn keeps this non-fatal. Version-suffix the basename
      # so each leg stays distinct after the evidence emit step.
      - name: Stage lint report for evidence
        if: always()
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          if [ -f quality-ruff.json ]; then
            cp quality-ruff.json "ci-reports/quality-ruff-${VERSION}.json"
          fi

      - name: Upload lint report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-quality-reports-lint-${{ matrix.version }}
          path: ci-reports/
          if-no-files-found: warn

  typecheck:
    name: typecheck / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        # TYPECHECK cardinality is per-language. Matrix languages whose
        # typecheck runs per Node/compiler version (e.g. C++) consume `all`;
        # TypeScript runs a single canonical `tsc --noEmit` once (spec §3.6), so
        # it consumes the collapsed `once` output — emitting one
        # `quality / typecheck / <primary>` job on the resolved primary version
        # (Cardinality.ONCE). This is the inverse of C++'s per-version typecheck.
        include: ${{ fromJSON(inputs.language == 'typescript' && needs.matrix.outputs.once || needs.matrix.outputs.all) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.53

      # Hand uv the leg's resolved version and pin its source to the image
      # (spec §6.5 of epic vergil-project/.github#407): UV_PYTHON plus
      # UV_PYTHON_PREFERENCE=only-system, so the dependency install and every
      # check below run on the image's interpreter for this leg, never one a
      # repo file selects or uv downloads.
      - name: Pin uv to the leg's Python interpreter
        if: inputs.language == 'python'
        uses: vergil-project/vergil-actions/actions/ci/toolchain/pin-python@v2.1.53
        with:
          version: ${{ matrix.version }}

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      # Backstop for the pin above: fail the leg if the interpreter or
      # toolchain it actually runs is not the version CI resolved for it.
      - name: assert-toolchain
        uses: vergil-project/vergil-actions/actions/ci/toolchain/assert@v2.1.53
        with:
          language: ${{ inputs.language }}
          expected: ${{ matrix.version }}

      - name: Run typecheck
        run: vrg-validate --check typecheck

      # Bridge this leg's typecheck report across the job boundary (#836). The
      # typecheck job and the evidence job run on separate runners with separate
      # filesystems, so the report produced here is stranded unless uploaded.
      # quality-mypy.xml is a locked filename contract with vergil-tooling#2811
      # (which adds its emission); until #2811 releases the file is absent and
      # if-no-files-found: warn keeps this non-fatal. Version-suffix the basename
      # so each leg stays distinct after the evidence emit step.
      - name: Stage typecheck report for evidence
        if: always()
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          if [ -f quality-mypy.xml ]; then
            cp quality-mypy.xml "ci-reports/quality-mypy-${VERSION}.xml"
          fi

      - name: Upload typecheck report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-quality-reports-typecheck-${{ matrix.version }}
          path: ci-reports/
          if-no-files-found: warn

  evidence:
    name: evidence
    # Runs only after the common, lint, and typecheck jobs all succeed, so the
    # artifact's presence is itself proof the quality gate passed. The common
    # job uploads its transcript (quality-common.log) as a partial, so every
    # repo — including a language-less one with no lint/typecheck reports —
    # emits at least one real report file, never an evidence.json-only
    # payload (#925). Each lint /
    # typecheck leg uploads its version-suffixed quality-ruff.json /
    # quality-mypy.xml as a per-version partial; the step below pulls every
    # leg's reports back onto one runner so the emitted bundle carries each
    # version's reports. Those filenames are a locked contract with
    # vergil-tooling#2811 — until it releases the globs match nothing and emit
    # skips them, so the artifact carries evidence.json alone (#836).
    needs: [common, lint, typecheck]
    # Run even when a required leg fails or is skipped (default would skip this
    # job, leaving the gate green-by-absence). The assert step below then turns
    # any non-success upstream result into a FAILED evidence job (#873, epic
    # vergil-project/.github#338).
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Fail red (not skip) when any required matrix leg did not succeed. Uses
      # needs.<job>.result — for a matrix job that is 'success' only when every
      # leg succeeded, and 'failure'/'skipped'/'cancelled' otherwise. This is
      # the first step, so a non-success result fails the job before any report
      # is emitted, making a red/skipped leg surface as a red evidence gate.
      - name: Assert all required legs succeeded
        shell: bash
        env:
          RESULTS: |
            common=${{ needs.common.result }}
            lint=${{ needs.lint.result }}
            typecheck=${{ needs.typecheck.result }}
        run: |
          set -euo pipefail
          failed=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            if [ "$result" != "success" ]; then
              echo "::error::required job '$job' did not succeed (result: '$result')"
              failed=1
            fi
          done <<< "$RESULTS"
          if [ "$failed" -ne 0 ]; then
            echo "evidence gate FAILED: one or more required legs did not succeed"
            exit 1
          fi
          echo "all required legs succeeded"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download per-matrix quality reports
        uses: actions/download-artifact@v7
        with:
          pattern: ci-evidence-quality-reports-*
          path: evidence-reports
          merge-multiple: true

      - name: Emit ci-evidence-quality artifact
        uses: vergil-project/vergil-actions/actions/ci/evidence/emit@v2.1.53
        with:
          gate: quality
          files: |
            evidence-reports/quality-common.log
            evidence-reports/quality-ruff-*.json
            evidence-reports/quality-mypy-*.xml
          tools: '[{"name": "vrg-validate-common"}, {"name": "ruff"}, {"name": "mypy"}]'
