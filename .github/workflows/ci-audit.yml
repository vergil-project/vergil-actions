name: CI Audit

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      versions:
        type: string
        required: true
      container-suffix:
        type: string
        required: false
        description: >-
          Container image name suffix (e.g. python, go, base). Defaults
          to "base". Callers should pass their language-specific suffix
          (e.g. "python", "go") when needed.
      container-tag:
        type: string
        required: false
        description: >-
          Container image tag. Accepted for interface consistency with
          other CI workflows; matrix jobs use the versions input for
          their container tag.
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

jobs:
  dependencies:
    name: dependencies / ${{ matrix.version }}
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ inputs.container-suffix || 'base' }}:${{ matrix.version }}
    strategy:
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.14

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      - name: Run dependency audit
        run: vrg-validate --check audit

  evidence:
    name: evidence
    # Runs only after every matrix audit job succeeds, so the artifact's
    # presence is itself proof the audit gate passed. Report files (audit /
    # license JSON) are collected when the audit command emits them; until then
    # the artifact carries evidence.json alone.
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Emit ci-evidence-audit artifact
        uses: vergil-project/vergil-actions/actions/ci/evidence/emit@v2.1.14
        with:
          gate: audit
          files: |
            pip-audit.json
            licenses.json
