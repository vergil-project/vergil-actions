name: CI Audit

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      versions:
        type: string
        required: false
        description: >-
          JSON array of version tokens for the matrix (e.g.
          '["3.12","3.13","3.14"]'). Optional: when omitted (empty), the matrix
          is sourced from [ci].versions in vergil.toml via the setup action's
          `versions` output. A supplied value is honored verbatim (back-compat,
          epic vergil-project/.github#338).
      container-suffix:
        type: string
        required: false
        description: >-
          Container image name suffix (e.g. python, go, base). Callers should
          pass their language-specific suffix. Ignored for cpp, whose suffix
          (cpp-clang / cpp-gcc) is derived per-version from the version token.
      container-tag:
        type: string
        required: false
        description: >-
          Container image tag. Accepted for interface consistency with
          other CI workflows; matrix jobs resolve their image (and tag) from
          the versions input via the ci/matrix action.
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".
    secrets:
      CONAN_AUDIT_PROVIDER_TOKEN_CONANCENTER:
        required: false
        description: >-
          ConanCenter provider token for `conan audit`. Only meaningful for
          cpp repos; other ecosystems ignore it. Optional — callers without
          the org/repo secret configured leave it unset, in which case the
          cpp audit command degrades to a notice-and-skip for the conan gate
          (see the audit step below). Passed explicitly by the caller — never
          via `secrets: inherit` (epics vergil-project/.github#189, #197).

jobs:
  # Resolve the per-version job matrix (version label + container image),
  # applying C++ compiler-family image routing and per-kind cardinality. AUDIT
  # is a run-once kind, so dependencies consumes the `once` output (primary
  # version only for C++, every version otherwise).
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.resolve.outputs.all }}
      once: ${{ steps.resolve.outputs.once }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Source the version set from vergil.toml only when the caller did not
      # supply `inputs.versions`. Runs the shared setup action for its
      # `versions` output (epic vergil-project/.github#338, Task 6). Skipped
      # when `inputs.versions` is provided so the back-compat path pays no
      # install cost and does not require a [ci] section.
      - name: Resolve versions from vergil.toml
        id: setup
        if: inputs.versions == ''
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.34

      - name: Resolve CI matrix
        id: resolve
        uses: vergil-project/vergil-actions/actions/ci/matrix@v2.1.34
        with:
          language: ${{ inputs.language }}
          versions: ${{ inputs.versions != '' && inputs.versions || steps.setup.outputs.versions }}
          container-prefix: ${{ inputs.container-prefix }}
          container-suffix: ${{ inputs.container-suffix }}

  dependencies:
    name: dependencies / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.once) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.34

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      # The job runs INSIDE the language container, so this step-level env:
      # lands inside the container directly — no [container].env-prefixes
      # passthrough is needed as it would be for a host->container hop. The
      # token is only consumed by the cpp `conan audit` path; other ecosystems
      # ignore it. When the caller leaves the secret unset (repos without it),
      # this expands to an empty string and the cpp audit command skips the
      # conan gate with a notice rather than failing auth — a per-language
      # decision that lives in vrg-validate, not here, because only it knows
      # whether the current run actually uses conan. A workflow-level skip is
      # deliberately avoided: it would wrongly skip python/go audits too.
      - name: Run dependency audit
        env:
          CONAN_AUDIT_PROVIDER_TOKEN_CONANCENTER: ${{ secrets.CONAN_AUDIT_PROVIDER_TOKEN_CONANCENTER }}
        run: vrg-validate --check audit

      # Bridge this matrix leg's report files across the job boundary (#836).
      # The dependencies job and the evidence job run on separate runners with
      # separate filesystems, so the reports produced here are stranded unless
      # uploaded. Rename to version-suffixed basenames so each version's report
      # stays distinct after the evidence job's emit step (flattens by basename).
      - name: Stage audit reports for evidence
        if: always()
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          for f in pip-audit.json licenses.json; do
            [ -f "$f" ] || continue
            cp "$f" "ci-reports/${f%.json}-${VERSION}.json"
          done

      - name: Upload audit report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-audit-reports-${{ matrix.version }}
          path: ci-reports/
          if-no-files-found: warn

  evidence:
    name: evidence
    # Runs only after every matrix audit job succeeds, so the artifact's
    # presence is itself proof the audit gate passed. Each dependencies leg
    # uploads its version-suffixed pip-audit.json / licenses.json as a
    # per-version partial; the step below pulls every leg's reports back onto
    # one runner so the emitted bundle carries each version's reports (#836).
    needs: dependencies
    # Run even when a required leg fails or is skipped (default would skip this
    # job, leaving the gate green-by-absence). The assert step below then turns
    # any non-success upstream result into a FAILED evidence job (#873, epic
    # vergil-project/.github#338).
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Fail red (not skip) when any required matrix leg did not succeed. Uses
      # needs.<job>.result — for a matrix job that is 'success' only when every
      # leg succeeded, and 'failure'/'skipped'/'cancelled' otherwise. This is
      # the first step, so a non-success result fails the job before any report
      # is emitted, making a red/skipped leg surface as a red evidence gate.
      - name: Assert all required legs succeeded
        shell: bash
        env:
          RESULTS: |
            dependencies=${{ needs.dependencies.result }}
        run: |
          set -euo pipefail
          failed=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            if [ "$result" != "success" ]; then
              echo "::error::required job '$job' did not succeed (result: '$result')"
              failed=1
            fi
          done <<< "$RESULTS"
          if [ "$failed" -ne 0 ]; then
            echo "evidence gate FAILED: one or more required legs did not succeed"
            exit 1
          fi
          echo "all required legs succeeded"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download per-matrix audit reports
        uses: actions/download-artifact@v7
        with:
          pattern: ci-evidence-audit-reports-*
          path: evidence-reports
          merge-multiple: true

      - name: Emit ci-evidence-audit artifact
        uses: vergil-project/vergil-actions/actions/ci/evidence/emit@v2.1.34
        with:
          gate: audit
          files: |
            evidence-reports/pip-audit-*.json
            evidence-reports/licenses-*.json
          tools: '[{"name": "pip-audit"}, {"name": "pip-licenses"}]'
