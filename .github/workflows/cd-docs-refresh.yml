name: CD Docs Refresh

# Regenerates the generated documentation pages (roadmap / activity) and
# republishes the site. Org documentation-site repos publish pages that change
# with epic activity, not with any release of the docs repo itself, so there is
# no push/release event to rebuild on — the caller drives this on a schedule
# and on demand (workflow_dispatch). Thin wrapper over cd-docs.yml with the
# page generation pre-wired, so every org's docs repo shares one definition.

on:
  workflow_call:
    inputs:
      pre-deploy-command:
        description: >-
          Command that regenerates the generated pages before deploy.
          Defaults to regenerating the roadmap and activity pages.
        type: string
        default: >-
          vrg-roadmap > docs/site/docs/roadmap.md &&
          vrg-activity-log > docs/site/docs/activity.md
      mkdocs-config:
        description: Path to mkdocs.yml configuration file.
        type: string
        default: docs/site/mkdocs.yml
      container-prefix:
        description: Container image name prefix (prod or dev). Defaults to "prod".
        type: string
        default: prod
    # The org automation App's credentials, for the ops-report action (epic
    # vergil-project/.github#1494), used by the report job and forwarded to
    # the nested cd-docs.yml call. Declared optional a release before that
    # job, so every caller could pass them first and no caller's run turned
    # red (spec §5.6).
    secrets:
      APP_CLIENT_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

permissions:
  contents: write

jobs:
  refresh:
    # Fully-qualified so this nested reusable resolves when cd-docs-refresh is
    # called cross-repo (a relative ./ ref does not); @develop is frozen to the
    # release tag by vrg-freeze-refs at release time.
    uses: vergil-project/vergil-actions/.github/workflows/cd-docs.yml@v2.1.94
    permissions:
      contents: write
    # The nested call resolves to develop's cd-docs.yml (frozen to the release
    # tag at release time), so these lines ship before cd-docs.yml gains its
    # reporting job: report: false keeps that job off, since the refresh
    # reports its run itself as docs-refresh, and the App secrets are
    # forwarded for the deploy's later identity work.
    with:
      pre-deploy-command: ${{ inputs.pre-deploy-command }}
      mkdocs-config: ${{ inputs.mkdocs-config }}
      container-prefix: ${{ inputs.container-prefix }}
      report: false
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # Reports the refresh as docs-refresh to the org's operations queue (epic
  # vergil-project/.github#1494, spec §5.3). The nested cd-docs.yml call
  # passes report: false, so the run is reported once, under this name.
  # The checkout comes first: setting up Vergil reads the workspace's
  # vergil.toml, and the local ./actions/ ref resolves against it. The action
  # mints its own issues-only App token, only on refs/heads/develop, so this
  # job's GITHUB_TOKEN stays read-only. No concurrency group: GitHub keeps one
  # pending run per group and cancels the older, which would drop a report.
  # actions/ops/report/tests/reporting-jobs.test.sh guards this layout.
  report:
    name: report
    needs: refresh
    if: always()
    runs-on: ubuntu-24.04
    environment: automation
    permissions:
      contents: read
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report docs-refresh
        uses: vergil-project/vergil-actions/actions/ops/report@v2.1.94
        env:
          VRG_AUTOMATION_APP: ${{ vars.VRG_AUTOMATION_APP }}
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
        with:
          job: docs-refresh
          results: ${{ needs.refresh.result }}
          app-client-id: ${{ secrets.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
