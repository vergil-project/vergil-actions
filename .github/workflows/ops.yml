name: Ops

on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  github-config:
    uses: vergil-project/vergil-actions/.github/workflows/ops-github-config.yml@v2.1
    permissions:
      contents: read
      issues: write
    # `inherit` within vergil-project: it carries the App keys from the
    # `automation` environment. A caller in another org passes them by name,
    # since `inherit` reaches only a reusable workflow in the caller's own
    # organization or enterprise. Allowed only for the App-key workflows
    # (vrg-validate's secrets-inherit check).
    secrets: inherit

  # The daily agent audit (epic vergil-project/.github#1384). It runs after
  # the config job, but also when that job fails, so a config failure never
  # skips the audit. A security-signal job: it files no issue.
  agent-audit:
    needs: github-config
    if: ${{ !cancelled() }}
    uses: vergil-project/vergil-actions/.github/workflows/ops-agent-audit.yml@v2.1
    permissions:
      contents: read
    # `inherit` within vergil-project: it carries the App keys from the
    # `automation` environment. A caller in another org passes them by name,
    # since `inherit` reaches only a reusable workflow in the caller's own
    # organization or enterprise. Allowed only for the App-key workflows
    # (vrg-validate's secrets-inherit check).
    secrets: inherit
