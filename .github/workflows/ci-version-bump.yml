name: CI Version Bump

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      run-release:
        type: boolean
        default: true
        description: >-
          Deprecated — the gate now follows release-model in vergil.toml.
          Passing false still suppresses the gate for backwards
          compatibility but emits a deprecation warning. Tracked for
          removal in #688.
      container-suffix:
        type: string
        required: false
        description: >-
          Container image name suffix for the version-bump job
          (e.g. python, base). Defaults to "base".
      container-tag:
        type: string
        required: false
        description: >-
          Container image tag for the version-bump job. Optional: when omitted,
          the tag is the `primary-version` derived from [ci].versions in
          vergil.toml via the setup action (epic vergil-project/.github#338). A
          supplied value is honored verbatim (back-compat).
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

jobs:
  # Derive `primary-version` from [ci].versions in vergil.toml so the
  # single-container version-bump job can resolve its image tag without a
  # hand-set `container-tag` input (epic vergil-project/.github#338, Task 7).
  # The job's `container:` is evaluated before any step runs, so the value must
  # come from a preceding job — mirroring how the matrix workflows resolve their
  # image in a separate `matrix` job. Runs unconditionally; when the caller
  # supplies `container-tag` the output is simply unused.
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      primary-version: ${{ steps.derive.outputs.primary-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve primary-version from vergil.toml
        id: derive
        uses: ./actions/shared/setup/vergil

  version-bump:
    name: version-bump
    needs: setup
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ inputs.container-suffix || 'base' }}:${{ inputs.container-tag || needs.setup.outputs.primary-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect release model
        id: release-model
        shell: bash
        # Self-guard so the gate follows repo configuration (#675): a repo
        # with release-model = "none" has nothing to version-bump, so the
        # gate steps do not run and the job passes without caller wiring.
        env:
          RUN_RELEASE: ${{ inputs.run-release }}
        run: |
          if [ "$RUN_RELEASE" = "false" ]; then
            msg='run-release is deprecated: the version-bump gate now'
            msg="$msg follows release-model in vergil.toml. Remove"
            msg="$msg run-release from the calling workflow (see"
            msg="$msg vergil-actions#688)."
            echo "::warning::$msg"
            echo "releases=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `python3` from PATH, not an absolute path: it is /usr/local/bin in
          # the base/python images but /usr/bin in cpp-clang, and this job runs
          # in whichever image the caller passes (#863).
          model=$(python3 -c "
          import tomllib, pathlib
          path = pathlib.Path('vergil.toml')
          cfg = tomllib.loads(path.read_text()) if path.is_file() else {}
          print(cfg.get('project', {}).get('release-model', ''))
          ")
          if [ "$model" = "none" ]; then
            echo "release-model is \"none\"; nothing to version-bump." >&2
            echo "releases=false" >> "$GITHUB_OUTPUT"
          else
            echo "releases=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install vergil-tooling
        if: steps.release-model.outputs.releases == 'true'
        uses: ./actions/shared/setup/vergil

      - name: Verify version bump
        if: steps.release-model.outputs.releases == 'true'
        uses: ./actions/ci/version-bump/version-divergence
        with:
          head-version-command: vrg-version show
          main-version-command: vrg-version show --ref origin/main
