name: CD Docs

on:
  workflow_call:
    inputs:
      pre-deploy-command:
        description: Shell command to run before deploy.
        type: string
        default: ""
      mkdocs-config:
        description: Path to mkdocs.yml configuration file.
        type: string
        default: docs/site/mkdocs.yml
      container-prefix:
        description: Container image name prefix (prod or dev). Defaults to "prod".
        type: string
        default: prod

permissions:
  contents: write

concurrency:
  group: cd-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: docs
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    # Pin uv's interpreter source to the image (spec §6.5 of epic
    # vergil-project/.github#407): every uv command in this job, including the
    # pre-deploy command and `uv run mike`/`uv run mkdocs` for Python repos,
    # uses the image's Python and never one uv downloads because a repo sets
    # `python-preference = "only-managed"`. If the image cannot satisfy the
    # repo's requires-python, uv fails loudly; there is no fallback. Only the
    # source is pinned: this job resolves no Python version, so UV_PYTHON stays
    # unset (issue #1002).
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.54

      - name: Run pre-deploy command
        if: inputs.pre-deploy-command != ''
        shell: bash
        env:
          PRE_DEPLOY_COMMAND: ${{ inputs.pre-deploy-command }}
          # The default pre-deploy command runs vrg-roadmap / vrg-activity-log,
          # which shell out to `gh` to read the org `.github` epics. In an
          # Actions runner `gh` refuses to run without a token, so a token must
          # be in the env. The org `.github` epic home is public, so the
          # repo-scoped default token suffices — no App-token minting needed.
          GH_TOKEN: ${{ github.token }}
        run: eval "$PRE_DEPLOY_COMMAND"

      - name: Stage documentation sources
        uses: vergil-project/vergil-actions/actions/shared/docs/stage@v2.1.54
        with:
          mkdocs-config: ${{ inputs.mkdocs-config || 'docs/site/mkdocs.yml' }}

      - name: Deploy docs
        uses: vergil-project/vergil-actions/actions/cd/docs/deploy@v2.1.54
        env:
          # mkdocs-material 9.7.x prints a MkDocs 2.0 warning banner on every
          # build unless this is set; it reaches the mkdocs/mike processes the
          # deploy action starts. Consumers pin mkdocs<2 themselves (risk
          # assessment: #316). A caller's env does not reach a reusable
          # workflow, so it is set here.
          # https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
          NO_MKDOCS_2_WARNING: "1"
        with:
          version-command: vrg-version show --major-minor
          mkdocs-config: ${{ inputs.mkdocs-config || 'docs/site/mkdocs.yml' }}
