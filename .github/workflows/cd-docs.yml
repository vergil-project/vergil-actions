name: CD Docs

on:
  workflow_call:
    inputs:
      pre-deploy-command:
        description: Shell command to run before deploy.
        type: string
        default: ""
      mkdocs-config:
        description: Path to mkdocs.yml configuration file.
        type: string
        default: docs/site/mkdocs.yml
      container-prefix:
        description: Container image name prefix (prod or dev). Defaults to "prod".
        type: string
        default: prod
      report:
        description: >-
          Report this run's result to the org's operations queue (epic
          vergil-project/.github#1494) as docs-deploy-develop, through the report
          job. cd-docs-refresh.yml passes false, since it reports the run
          itself under its own job name.
        type: boolean
        default: true
    # The org automation App's credentials, for the ops-report action (epic
    # vergil-project/.github#1494), used only by the report job. Declared
    # optional a release before that job, so every caller could pass them
    # first and no caller's run turned red (spec §5.6).
    secrets:
      APP_CLIENT_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

permissions:
  contents: write

concurrency:
  group: cd-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: docs
    runs-on: ubuntu-24.04
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    # Pin uv's interpreter source to the image (spec §6.5 of epic
    # vergil-project/.github#407): every uv command in this job, including the
    # pre-deploy command and `uv run mike`/`uv run mkdocs` for Python repos,
    # uses the image's Python and never one uv downloads because a repo sets
    # `python-preference = "only-managed"`. If the image cannot satisfy the
    # repo's requires-python, uv fails loudly; there is no fallback. Only the
    # source is pinned: this job resolves no Python version, so UV_PYTHON stays
    # unset (issue #1002).
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.94

      - name: Run pre-deploy command
        if: inputs.pre-deploy-command != ''
        shell: bash
        env:
          PRE_DEPLOY_COMMAND: ${{ inputs.pre-deploy-command }}
          # The default pre-deploy command runs vrg-roadmap / vrg-activity-log,
          # which shell out to `gh` to read the org `.github` epics. In an
          # Actions runner `gh` refuses to run without a token, so a token must
          # be in the env. The org `.github` epic home is public, so the
          # repo-scoped default token suffices — no App-token minting needed.
          GH_TOKEN: ${{ github.token }}
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
        run: eval "$PRE_DEPLOY_COMMAND"

      - name: Stage documentation sources
        uses: vergil-project/vergil-actions/actions/shared/docs/stage@v2.1.94
        env:
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
        with:
          mkdocs-config: ${{ inputs.mkdocs-config || 'docs/site/mkdocs.yml' }}

      - name: Deploy docs
        uses: vergil-project/vergil-actions/actions/cd/docs/deploy@v2.1.94
        env:
          # mkdocs-material 9.7.x prints a MkDocs 2.0 warning banner on every
          # build unless this is set; it reaches the mkdocs/mike processes the
          # deploy action starts. Consumers pin mkdocs<2 themselves (risk
          # assessment: #316). A caller's env does not reach a reusable
          # workflow, so it is set here.
          # https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
          NO_MKDOCS_2_WARNING: "1"
        with:
          version-command: vrg-version show --major-minor
          mkdocs-config: ${{ inputs.mkdocs-config || 'docs/site/mkdocs.yml' }}

  # Reports the docs deploy as docs-deploy-develop to the org's operations
  # queue (epic vergil-project/.github#1494, spec §5.3, §4.1). Off when the
  # caller passes report: false (cd-docs-refresh.yml reports its run as
  # docs-refresh), and off for a release push: a push to main, or a develop
  # push whose head commit merges a release/* branch (a release's merge back
  # into develop). Epic vergil-project/.github#1440's release records already
  # track and recover those runs' failed CD jobs.
  # actions/ops/report/tests/release-push-skip.test.sh and
  # docs-refresh-reports-once.test.sh guard the condition.
  # The checkout comes first: setting up Vergil reads the workspace's
  # vergil.toml, and the local ./actions/ ref resolves against it. The action
  # mints its own issues-only App token, only on refs/heads/develop, so this
  # job's GITHUB_TOKEN stays read-only. No concurrency group: GitHub keeps one
  # pending run per group and cancels the older, which would drop a report.
  # actions/ops/report/tests/reporting-jobs.test.sh guards this layout.
  report:
    name: report
    needs: deploy
    if: >-
      always() && inputs.report && github.ref != 'refs/heads/main' &&
      !(startsWith(github.event.head_commit.message, 'Merge pull request #') &&
      contains(github.event.head_commit.message, format(' from {0}/release/', github.repository_owner)))
    runs-on: ubuntu-24.04
    environment: automation
    permissions:
      contents: read
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report docs-deploy-develop
        uses: vergil-project/vergil-actions/actions/ops/report@v2.1.94
        env:
          VRG_AUTOMATION_APP: ${{ vars.VRG_AUTOMATION_APP }}
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
        with:
          job: docs-deploy-develop
          results: ${{ needs.deploy.result }}
          app-client-id: ${{ secrets.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
