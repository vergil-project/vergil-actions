name: Smoke - ops/report

# Runs the framework-free harnesses of the ops-report action (issue #1361,
# epic vergil-project/.github#1494):
#   * ops-report-ref-guard.test.sh: the develop-only guard is the first step,
#     every later step (the token step included) is conditioned on it, and a
#     feature-branch run mints no token and reports nothing;
#   * ops-report-inputs.test.sh: the inputs, an issues-only App token, no
#     vars. or secrets. expression in the metadata, the setup step running
#     with the App token, and the vrg-ops-report arguments;
#   * optional-secrets.test.sh: cd-docs.yml, cd-docs-refresh.yml and
#     publish-index.yml declare APP_CLIENT_ID and APP_PRIVATE_KEY as
#     optional, cd-docs.yml declares the `report` input, and the refresh's
#     nested cd-docs.yml call passes `report: false` and both secrets;
#   * reporting-jobs.test.sh (issue #1362): each shared unattended workflow
#     ends with one reporting job per stable job name, run always, needing
#     and passing the results of every GitHub job of that name, and none for
#     the security-signal jobs;
#   * ops-report-skipped.test.sh: upstream-refresh reports both prepare's
#     and publish's results, unfiltered, so all-skipped reports nothing;
#   * release-push-skip.test.sh: cd-docs.yml reports no release push;
#   * docs-refresh-reports-once.test.sh: a docs refresh is reported once, as
#     docs-refresh;
#   * app-identity.test.sh (issue #1363): the shared unattended jobs write as
#     the org automation App, bar the recorded exception, the docs deploy
#     commits as the App's bot user, and the App jobs verify their token
#     against VRG_AUTOMATION_APP before their first write.
# Each needs yq (preinstalled on GitHub's ubuntu runners) and no network.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - actions/ops/report/**
      - actions/cd/docs/deploy/**
      - .github/workflows/cd-docs.yml
      - .github/workflows/cd-docs-refresh.yml
      - .github/workflows/publish-index.yml
      - .github/workflows/nightly-harnesses.yml
      - .github/workflows/ops-github-config.yml
      - .github/workflows/ops-epic-sweep.yml
      - .github/workflows/ops-epic-rollup.yml
      - .github/workflows/ops-upstream-refresh.yml
      - .github/workflows/cd.yml
      - .github/workflows/smoke-ops-report.yml

permissions:
  contents: read

jobs:
  fixtures:
    name: ops/report harness fixtures
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run ops-report ref-guard harness
        shell: bash
        run: bash actions/ops/report/tests/ops-report-ref-guard.test.sh
      - name: Run ops-report inputs harness
        shell: bash
        run: bash actions/ops/report/tests/ops-report-inputs.test.sh
      - name: Run optional App secrets harness
        shell: bash
        run: bash actions/ops/report/tests/optional-secrets.test.sh
      - name: Run reporting jobs harness
        shell: bash
        run: bash actions/ops/report/tests/reporting-jobs.test.sh
      - name: Run skipped results harness
        shell: bash
        run: bash actions/ops/report/tests/ops-report-skipped.test.sh
      - name: Run release-push skip harness
        shell: bash
        run: bash actions/ops/report/tests/release-push-skip.test.sh
      - name: Run docs-refresh reports-once harness
        shell: bash
        run: bash actions/ops/report/tests/docs-refresh-reports-once.test.sh
      - name: Run App identity harness
        shell: bash
        run: bash actions/ops/report/tests/app-identity.test.sh
