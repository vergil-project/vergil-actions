name: CI Security

on:
  workflow_call:
    inputs:
      language:
        description: Language for security scanners (e.g., ruby, python, go, java)
        type: string
        required: true
      run-standards:
        # Deprecated / vestigial. The standards-compliance gate
        # (vrg-pr-issue-linkage) was retired — PR-linkage is now enforced at
        # PR-body construction in vergil-tooling (epic vergil-project/.github#82).
        # Kept as an accepted-but-ignored input so consumers passing it do not
        # error; remove in a coordinated follow-up once no consumer passes it.
        description: Deprecated; no longer has any effect.
        type: boolean
        default: false
      run-security:
        description: Run security scanner jobs
        type: boolean
        default: true
      run-codeql:
        description: >-
          Run CodeQL analysis.
          Disable for languages CodeQL does not support (e.g. shell).
        type: boolean
        default: true
      upload-sarif:
        description: >-
          Upload scanner SARIF results to GitHub code scanning.
          Disable on private repos without GitHub Advanced Security:
          Trivy and Semgrep results are preserved as build artifacts
          instead, and the CodeQL job is skipped entirely (CodeQL
          cannot run on private repos without GHAS).
        type: boolean
        default: true
      container-suffix:
        type: string
        required: false
        description: >-
          Deprecated; fed the removed standards job and no longer has any
          effect. Retained so consumers passing it do not error.
      container-tag:
        type: string
        required: false
        description: >-
          Deprecated; fed the removed standards job and no longer has any
          effect. Retained so consumers passing it do not error.
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

# actions: read is required by codeql-action/upload-sarif on private
# repos (it reads the workflow run via the Actions API); public repos
# do not need it, which is why the gap was invisible there. See #693.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: codeql
    # upload-sarif gates this job entirely: CodeQL requires GitHub code
    # scanning, which on private repos requires GHAS. upload-sarif: false
    # signals code scanning is unavailable, so CodeQL cannot run at all.
    if: ${{ inputs.run-security && inputs.run-codeql && inputs.upload-sarif }}
    runs-on: ubuntu-latest
    # No container: CodeQL autobuild for compiled languages (go, java, rust)
    # needs the language toolchain on PATH. The prod-base image has none, and
    # language images (prod-go, prod-java, …) are published per-version only —
    # there is no prod-<lang>:latest tag to default to. The bare ubuntu-latest
    # runner ships all the toolchains autobuild needs, and ./actions/shared/setup/vergil
    # installs uv there for the SARIF-evaluation step. See issue #658.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil

      - name: Run CodeQL analysis
        uses: ./actions/ci/security/codeql
        with:
          language: ${{ inputs.language }}

  trivy:
    name: trivy
    if: ${{ inputs.run-security }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scan
        uses: ./actions/shared/security/trivy
        with:
          scan-type: fs
          upload-sarif: ${{ inputs.upload-sarif }}

  semgrep:
    name: semgrep
    if: ${{ inputs.run-security }}
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil

      - name: Run Semgrep SAST scan
        uses: ./actions/ci/security/semgrep
        with:
          language: ${{ inputs.language }}
          upload-sarif: ${{ inputs.upload-sarif }}
