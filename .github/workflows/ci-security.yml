name: CI Security

on:
  workflow_call:
    inputs:
      language:
        description: Language for security scanners (e.g., ruby, python, go, java)
        type: string
        required: true
      run-standards:
        description: Run standards-compliance job
        type: boolean
        default: true
      run-security:
        description: Run security scanner jobs
        type: boolean
        default: true
      run-codeql:
        description: >-
          Run CodeQL analysis.
          Disable for languages CodeQL does not support (e.g. shell).
        type: boolean
        default: true
      upload-sarif:
        description: >-
          Upload scanner SARIF results to GitHub code scanning.
          Disable on private repos without GitHub Advanced Security:
          Trivy and Semgrep results are preserved as build artifacts
          instead, and the CodeQL job is skipped entirely (CodeQL
          cannot run on private repos without GHAS).
        type: boolean
        default: true
      container-suffix:
        type: string
        required: false
        description: >-
          Container image name suffix for the standards job
          (e.g. python, base). Defaults to "base".
      container-tag:
        type: string
        required: false
        description: >-
          Container image tag for the standards job.
          Defaults to "latest".
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

# actions: read is required by codeql-action/upload-sarif on private
# repos (it reads the workflow run via the Actions API); public repos
# do not need it, which is why the gap was invisible there. See #693.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  standards:
    name: standards
    if: ${{ inputs.run-standards }}
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ inputs.container-suffix || 'base' }}:${{ inputs.container-tag || 'latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.5

      - name: Validate standards
        uses: vergil-project/vergil-actions/actions/ci/security/standards-compliance@v2.1.5

  codeql:
    name: codeql
    # upload-sarif gates this job entirely: CodeQL requires GitHub code
    # scanning, which on private repos requires GHAS. upload-sarif: false
    # signals code scanning is unavailable, so CodeQL cannot run at all.
    if: ${{ inputs.run-security && inputs.run-codeql && inputs.upload-sarif }}
    runs-on: ubuntu-latest
    # No container: CodeQL autobuild for compiled languages (go, java, rust)
    # needs the language toolchain on PATH. The prod-base image has none, and
    # language images (prod-go, prod-java, …) are published per-version only —
    # there is no prod-<lang>:latest tag to default to. The bare ubuntu-latest
    # runner ships all the toolchains autobuild needs, and ./actions/shared/setup/vergil
    # installs uv there for the SARIF-evaluation step. See issue #658.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.5

      - name: Run CodeQL analysis
        uses: vergil-project/vergil-actions/actions/ci/security/codeql@v2.1.5
        with:
          language: ${{ inputs.language }}

  trivy:
    name: trivy
    if: ${{ inputs.run-security }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scan
        uses: vergil-project/vergil-actions/actions/shared/security/trivy@v2.1.5
        with:
          scan-type: fs
          upload-sarif: ${{ inputs.upload-sarif }}

  semgrep:
    name: semgrep
    if: ${{ inputs.run-security }}
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.5

      - name: Run Semgrep SAST scan
        uses: vergil-project/vergil-actions/actions/ci/security/semgrep@v2.1.5
        with:
          language: ${{ inputs.language }}
          upload-sarif: ${{ inputs.upload-sarif }}
