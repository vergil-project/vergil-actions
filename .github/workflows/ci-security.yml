name: CI Security

on:
  workflow_call:
    inputs:
      language:
        description: Language for security scanners (e.g., python, go, rust)
        type: string
        required: true
      run-standards:
        # Deprecated / vestigial. The standards-compliance gate
        # (vrg-pr-issue-linkage) was retired — PR-linkage is now enforced at
        # PR-body construction in vergil-tooling (epic vergil-project/.github#82).
        # Kept as an accepted-but-ignored input so consumers passing it do not
        # error; remove in a coordinated follow-up once no consumer passes it.
        description: Deprecated; no longer has any effect.
        type: boolean
        default: false
      run-security:
        description: Run security scanner jobs
        type: boolean
        default: true
      run-codeql:
        description: >-
          Run CodeQL analysis.
          Disable for languages CodeQL does not support (e.g. shell).
        type: boolean
        default: true
      container-suffix:
        type: string
        required: false
        description: >-
          Deprecated; fed the removed standards job and no longer has any
          effect. Retained so consumers passing it do not error.
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: codeql
    if: ${{ inputs.run-security && inputs.run-codeql }}
    runs-on: ubuntu-24.04
    # No container: CodeQL autobuild for compiled languages (go, rust)
    # needs the language toolchain on PATH. The prod-base image has none, and
    # language images (prod-go, prod-rust, …) are published per-version only —
    # there is no prod-<lang>:latest tag to default to. The bare ubuntu-24.04
    # runner ships all the toolchains autobuild needs, and ./actions/shared/setup/vergil
    # installs vergil-tooling there for the SARIF-evaluation step. See issue #658.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.96

      - name: Run CodeQL analysis
        uses: vergil-project/vergil-actions/actions/ci/security/codeql@v2.1.96
        with:
          language: ${{ inputs.language }}

      # Upload the CodeQL SARIF as an evidence partial UNCONDITIONALLY —
      # independent of the code-scanning upload — so the release harvester
      # reads artifacts only and never touches the code-scanning API (spec §7).
      - name: Upload CodeQL SARIF evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-security-part-codeql
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: warn

  trivy:
    name: trivy
    if: ${{ inputs.run-security }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Provides vrg-sarif-filter, which the trivy action uses to strip
      # accepted-suppressed results from the copy uploaded to code scanning
      # (issue #920). trivy-results.sarif itself stays unfiltered.
      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.96

      - name: Run Trivy vulnerability scan
        uses: vergil-project/vergil-actions/actions/shared/security/trivy@v2.1.96
        with:
          scan-type: fs

      # Upload the Trivy SARIF as an evidence partial UNCONDITIONALLY, beside
      # the copy pushed to code scanning (spec §7). This is the
      # UNFILTERED file: accepted-suppressed results are kept here for audit;
      # only the code-scanning upload copy omits them (issue #920).
      - name: Upload Trivy SARIF evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-security-part-trivy
          path: trivy-results.sarif
          if-no-files-found: warn

  semgrep:
    name: semgrep
    if: ${{ inputs.run-security }}
    runs-on: ubuntu-24.04
    # Single-container job, language-agnostic. Semgrep is a static analyzer that
    # never executes the target code, so it needs no pinned language runtime and
    # runs in the shared prod-base image. That image is published ONLY with the
    # `:latest` tag (no per-version tags — see vergil-containers docker/build.sh
    # and cd-docker-publish.yml), so the epic #338 `primary-version` (e.g.
    # "3.14") deliberately does NOT feed this tag: a `prod-base:3.14` does not
    # exist. The `container-suffix` input is already a deprecated no-op here, so
    # this job is already vergil.toml-independent — no change was needed for the
    # "inputs optional" goal (epic vergil-project/.github#338, Task 7).
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.96

      - name: Run Semgrep SAST scan
        uses: vergil-project/vergil-actions/actions/ci/security/semgrep@v2.1.96
        with:
          language: ${{ inputs.language }}

      # Upload the Semgrep SARIF as an evidence partial UNCONDITIONALLY, beside
      # the copy pushed to code scanning (spec §7). This is the
      # UNFILTERED file: accepted-suppressed results are kept here for audit;
      # only the code-scanning upload copy omits them (issue #920).
      - name: Upload Semgrep SARIF evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-security-part-semgrep
          path: semgrep-results.sarif
          if-no-files-found: warn

  evidence:
    name: evidence
    # Consolidate every scanner's SARIF partial into the single
    # ci-evidence-security artifact the harvester expects. Runs once the
    # scanners have settled: trivy and semgrep must have passed, and codeql
    # must have passed when run-codeql is true, or been skipped when it is
    # false. Only run-codeql false accepts a skipped codeql job;
    # actions/ci/evidence/tests/security-gate.test.sh pins it. A failed
    # scanner means the security gate failed, so no evidence is emitted
    # and — per the publish invariant — nothing is released.
    needs: [codeql, trivy, semgrep]
    if: >-
      ${{ always() && needs.trivy.result == 'success' &&
      needs.semgrep.result == 'success' &&
      ((inputs.run-codeql && needs.codeql.result == 'success') ||
      (!inputs.run-codeql && needs.codeql.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download scanner SARIF partials
        uses: actions/download-artifact@v7
        with:
          pattern: ci-evidence-security-part-*
          path: security-sarif
          merge-multiple: true

      # The tools are the scanners whose SARIF the gate holds (issue #1215).
      # This job runs only when trivy and semgrep passed, so both are always
      # named; codeql is named only when its job ran and passed, never when
      # it was skipped (run-codeql false). Each scanner job that
      # uploads a ci-evidence-security-part-<scanner> partial must appear
      # here; actions/ci/evidence/tests/security-tools.test.sh checks it.
      - name: Emit ci-evidence-security artifact
        uses: vergil-project/vergil-actions/actions/ci/evidence/emit@v2.1.96
        with:
          gate: security
          files: security-sarif/*.sarif
          tools: >-
            ${{ needs.codeql.result == 'success' &&
            '[{"name":"codeql"},{"name":"trivy"},{"name":"semgrep"}]' ||
            '[{"name":"trivy"},{"name":"semgrep"}]' }}
