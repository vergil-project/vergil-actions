name: CI Security

on:
  workflow_call:
    inputs:
      language:
        description: Language for security scanners (e.g., ruby, python, go, java)
        type: string
        required: true
      run-standards:
        # Deprecated / vestigial. The standards-compliance gate
        # (vrg-pr-issue-linkage) was retired — PR-linkage is now enforced at
        # PR-body construction in vergil-tooling (epic vergil-project/.github#82).
        # Kept as an accepted-but-ignored input so consumers passing it do not
        # error; remove in a coordinated follow-up once no consumer passes it.
        description: Deprecated; no longer has any effect.
        type: boolean
        default: false
      run-security:
        description: Run security scanner jobs
        type: boolean
        default: true
      run-codeql:
        description: >-
          Run CodeQL analysis.
          Disable for languages CodeQL does not support (e.g. shell).
        type: boolean
        default: true
      upload-sarif:
        description: >-
          Upload scanner SARIF results to GitHub code scanning.
          Disable on private repos without GitHub Advanced Security:
          Trivy and Semgrep results are preserved as build artifacts
          instead, and the CodeQL job is skipped entirely (CodeQL
          cannot run on private repos without GHAS).
        type: boolean
        default: true
      container-suffix:
        type: string
        required: false
        description: >-
          Deprecated; fed the removed standards job and no longer has any
          effect. Retained so consumers passing it do not error.
      container-tag:
        type: string
        required: false
        description: >-
          Deprecated; fed the removed standards job and no longer has any
          effect. Retained so consumers passing it do not error.
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

# actions: read is required by codeql-action/upload-sarif on private
# repos (it reads the workflow run via the Actions API); public repos
# do not need it, which is why the gap was invisible there. See #693.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: codeql
    # upload-sarif gates this job entirely: CodeQL requires GitHub code
    # scanning, which on private repos requires GHAS. upload-sarif: false
    # signals code scanning is unavailable, so CodeQL cannot run at all.
    if: ${{ inputs.run-security && inputs.run-codeql && inputs.upload-sarif }}
    runs-on: ubuntu-latest
    # No container: CodeQL autobuild for compiled languages (go, java, rust)
    # needs the language toolchain on PATH. The prod-base image has none, and
    # language images (prod-go, prod-java, …) are published per-version only —
    # there is no prod-<lang>:latest tag to default to. The bare ubuntu-latest
    # runner ships all the toolchains autobuild needs, and ./actions/shared/setup/vergil
    # installs uv there for the SARIF-evaluation step. See issue #658.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.26

      - name: Run CodeQL analysis
        uses: vergil-project/vergil-actions/actions/ci/security/codeql@v2.1.26
        with:
          language: ${{ inputs.language }}

      # Upload the CodeQL SARIF as an evidence partial UNCONDITIONALLY —
      # independent of the code-scanning upload — so the release harvester
      # reads artifacts only and never touches the code-scanning API (spec §7).
      - name: Upload CodeQL SARIF evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-security-part-codeql
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: warn

  trivy:
    name: trivy
    if: ${{ inputs.run-security }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scan
        uses: vergil-project/vergil-actions/actions/shared/security/trivy@v2.1.26
        with:
          scan-type: fs
          upload-sarif: ${{ inputs.upload-sarif }}

      # Upload the Trivy SARIF as an evidence partial UNCONDITIONALLY, whether
      # or not it was also pushed to code scanning (spec §7).
      - name: Upload Trivy SARIF evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-security-part-trivy
          path: trivy-results.sarif
          if-no-files-found: warn

  semgrep:
    name: semgrep
    if: ${{ inputs.run-security }}
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.26

      - name: Run Semgrep SAST scan
        uses: vergil-project/vergil-actions/actions/ci/security/semgrep@v2.1.26
        with:
          language: ${{ inputs.language }}
          # Some languages need their Semgrep ruleset wired explicitly because
          # vrg-semgrep-scan does not resolve one from the language name alone:
          #   cpp        — no single `p/<language>` ruleset; coverage is split
          #                across the C and C++ registries (epic
          #                vergil-project/.github#207 §4), so wire both.
          #   typescript — the `typescript` primary-language name has no
          #                registry entry in vrg-semgrep-scan, so wire the
          #                `p/typescript` JS/TS ruleset (epic
          #                vergil-project/.github#284 T7).
          # Other languages resolve their ruleset from the language input alone.
          extra-config: ${{ inputs.language == 'cpp' && 'p/c p/cpp' || inputs.language == 'typescript' && 'p/typescript' || '' }}
          upload-sarif: ${{ inputs.upload-sarif }}

      # Upload the Semgrep SARIF as an evidence partial UNCONDITIONALLY, whether
      # or not it was also pushed to code scanning (spec §7).
      - name: Upload Semgrep SARIF evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-security-part-semgrep
          path: semgrep-results.sarif
          if-no-files-found: warn

  evidence:
    name: evidence
    # Consolidate every scanner's SARIF partial into the single
    # ci-evidence-security artifact the harvester expects. Runs once the
    # scanners have settled: trivy and semgrep must have passed, and codeql
    # must have passed or been legitimately skipped (no GHAS / run-codeql
    # false). A failed scanner means the security gate failed, so no evidence
    # is emitted and — per the publish invariant — nothing is released.
    needs: [codeql, trivy, semgrep]
    if: >-
      ${{ always() && needs.trivy.result == 'success' &&
      needs.semgrep.result == 'success' &&
      (needs.codeql.result == 'success' || needs.codeql.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download scanner SARIF partials
        uses: actions/download-artifact@v7
        with:
          pattern: ci-evidence-security-part-*
          path: security-sarif
          merge-multiple: true

      - name: Emit ci-evidence-security artifact
        uses: vergil-project/vergil-actions/actions/ci/evidence/emit@v2.1.26
        with:
          gate: security
          files: security-sarif/*.sarif
