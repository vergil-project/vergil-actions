name: CI Test

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      versions:
        type: string
        required: true
      container-suffix:
        type: string
        required: false
        description: >-
          Container image name suffix (e.g. python, go, base). Callers should
          pass their language-specific suffix. Ignored for cpp, whose suffix
          (cpp-clang / cpp-gcc) is derived per-version from the version token.
      container-tag:
        type: string
        required: false
        description: >-
          Container image tag. Accepted for interface consistency with
          other CI workflows; matrix jobs resolve their image (and tag) from
          the versions input via the ci/matrix action.
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

jobs:
  # Resolve the per-version job matrix (version label + container image),
  # applying C++ compiler-family image routing. TEST is a per-version kind, so
  # unit consumes the `all` output (every configured compiler x version).
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.resolve.outputs.all }}
      once: ${{ steps.resolve.outputs.once }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve CI matrix
        id: resolve
        uses: vergil-project/vergil-actions/actions/ci/matrix@v2.1.26
        with:
          language: ${{ inputs.language }}
          versions: ${{ inputs.versions }}
          container-prefix: ${{ inputs.container-prefix }}
          container-suffix: ${{ inputs.container-suffix }}

  unit:
    name: unit / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.all) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.26

      # Test-runtime dependency only (spec §3.3): the declared
      # [container].system-packages install onto jobs that execute the repo's
      # tests, never onto lint/typecheck. Bounded retry + fail-closed inside.
      - name: Install repo system packages
        uses: vergil-project/vergil-actions/actions/shared/setup/system-packages@v2.1.26

      # Test-runtime dependency only (epic #291): run the declared
      # [container].build-command after vergil-tooling + system-packages, before
      # tests. Fail-closed, no retry.
      - name: Run repo build-command
        uses: vergil-project/vergil-actions/actions/shared/setup/build-command@v2.1.26

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      - name: Run unit tests
        run: vrg-validate --check test

  evidence:
    name: evidence
    # Runs only after every matrix unit job succeeds, so the artifact's presence
    # is itself proof the test gate passed. Report files (coverage.xml,
    # junit.xml) are collected when the test command emits them; until then the
    # artifact carries evidence.json alone, which is sufficient for completeness.
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Emit ci-evidence-test artifact
        uses: vergil-project/vergil-actions/actions/ci/evidence/emit@v2.1.26
        with:
          gate: test
          files: |
            coverage.xml
            junit.xml
