name: CI Test

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      container-suffix:
        type: string
        required: false
        description: >-
          Container image name suffix (e.g. python, go, base). Callers should
          pass their language-specific suffix. The matrix legs take each
          version's suffix from vrg-ci-resolve (cpp-clang / cpp-gcc for C++)
          and only cross-check this value: when set, it must be one of the
          resolved suffixes.
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

jobs:
  # Resolve the per-version job matrix (version label + container image) from
  # vrg-ci-resolve's answer. TEST is a per-version kind, so unit consumes the
  # `all` output (every resolved version, e.g. every compiler x version).
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.resolve.outputs.all }}
      once: ${{ steps.resolve.outputs.once }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Resolve the version set. The shared setup action installs
      # vergil-tooling and runs `vrg-ci-resolve` (epic
      # vergil-project/.github#407): the resolver's versions, primary version,
      # and per-version image tags and suffixes are the sole source for the
      # matrix.
      - name: Resolve versions with vrg-ci-resolve
        id: setup
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.51

      - name: Resolve CI matrix
        id: resolve
        uses: vergil-project/vergil-actions/actions/ci/matrix@v2.1.51
        with:
          language: ${{ inputs.language }}
          versions: ${{ steps.setup.outputs.versions }}
          primary-version: ${{ steps.setup.outputs.primary-version }}
          container-tags: ${{ steps.setup.outputs.container-tags }}
          container-suffixes: ${{ steps.setup.outputs.container-suffixes }}
          container-prefix: ${{ inputs.container-prefix }}
          container-suffix: ${{ inputs.container-suffix }}

  unit:
    name: unit / ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.all) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.51

      # Hand uv the leg's resolved version and pin its source to the image
      # (spec §6.5 of epic vergil-project/.github#407): UV_PYTHON plus
      # UV_PYTHON_PREFERENCE=only-system, so the dependency install and every
      # check below run on the image's interpreter for this leg, never one a
      # repo file selects or uv downloads.
      - name: Pin uv to the leg's Python interpreter
        if: inputs.language == 'python'
        uses: vergil-project/vergil-actions/actions/ci/toolchain/pin-python@v2.1.51
        with:
          version: ${{ matrix.version }}

      # Test-runtime dependency only (spec §3.3): the declared
      # [container].system-packages install onto jobs that execute the repo's
      # tests, never onto lint/typecheck. Bounded retry + fail-closed inside.
      - name: Install repo system packages
        uses: vergil-project/vergil-actions/actions/shared/setup/system-packages@v2.1.51

      # Test-runtime dependency only (epic #291): run the declared
      # [container].build-command after vergil-tooling + system-packages, before
      # tests. Fail-closed, no retry.
      - name: Run repo build-command
        uses: vergil-project/vergil-actions/actions/shared/setup/build-command@v2.1.51

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      # Backstop for the pin above: fail the leg if the interpreter or
      # toolchain it actually runs is not the version CI resolved for it.
      - name: assert-toolchain
        uses: vergil-project/vergil-actions/actions/ci/toolchain/assert@v2.1.51
        with:
          language: ${{ inputs.language }}
          expected: ${{ matrix.version }}

      - name: Run unit tests
        run: vrg-validate --check test

      # Bridge this matrix leg's report files across the job boundary (#836).
      # The unit job and the evidence job run on separate runners with separate
      # filesystems, so the reports produced here are stranded unless uploaded.
      # Rename to version-suffixed basenames so each interpreter's report stays
      # distinct after the evidence job's emit step, which flattens by basename.
      - name: Stage test reports for evidence
        if: always()
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          for f in coverage.xml junit.xml; do
            [ -f "$f" ] || continue
            cp "$f" "ci-reports/${f%.xml}-${VERSION}.xml"
          done

      - name: Upload test report evidence partial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-test-reports-${{ matrix.version }}
          path: ci-reports/
          if-no-files-found: warn

  evidence:
    name: evidence
    # Runs only after every matrix unit job succeeds, so the artifact's presence
    # is itself proof the test gate passed. Each unit leg uploads its
    # version-suffixed coverage.xml / junit.xml as a per-version partial; the
    # step below pulls every leg's reports back onto one runner so the emitted
    # bundle carries each interpreter's reports, not a single merged one (#836).
    needs: unit
    # Run even when a required leg fails or is skipped (default would skip this
    # job, leaving the gate green-by-absence). The assert step below then turns
    # any non-success upstream result into a FAILED evidence job (#873, epic
    # vergil-project/.github#338).
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Fail red (not skip) when any required matrix leg did not succeed. Uses
      # needs.<job>.result — for a matrix job that is 'success' only when every
      # leg succeeded, and 'failure'/'skipped'/'cancelled' otherwise. This is
      # the first step, so a non-success result fails the job before any report
      # is emitted, making a red/skipped leg surface as a red evidence gate.
      - name: Assert all required legs succeeded
        shell: bash
        env:
          RESULTS: |
            unit=${{ needs.unit.result }}
        run: |
          set -euo pipefail
          failed=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            if [ "$result" != "success" ]; then
              echo "::error::required job '$job' did not succeed (result: '$result')"
              failed=1
            fi
          done <<< "$RESULTS"
          if [ "$failed" -ne 0 ]; then
            echo "evidence gate FAILED: one or more required legs did not succeed"
            exit 1
          fi
          echo "all required legs succeeded"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download per-matrix test reports
        uses: actions/download-artifact@v7
        with:
          pattern: ci-evidence-test-reports-*
          path: evidence-reports
          merge-multiple: true

      - name: Emit ci-evidence-test artifact
        uses: vergil-project/vergil-actions/actions/ci/evidence/emit@v2.1.51
        with:
          gate: test
          files: |
            evidence-reports/coverage-*.xml
            evidence-reports/junit-*.xml
          tools: '[{"name": "pytest"}, {"name": "coverage.py"}]'
