name: CI Test

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      versions:
        type: string
        required: true
      container-suffix:
        type: string
        required: false
        description: >-
          Container image name suffix (e.g. python, go, base). Defaults
          to "base". Callers should pass their language-specific suffix
          (e.g. "python", "go") when needed.
      container-tag:
        type: string
        required: false
        description: >-
          Container image tag. Accepted for interface consistency with
          other CI workflows; matrix jobs use the versions input for
          their container tag.
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".

jobs:
  unit:
    name: unit / ${{ matrix.version }}
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ inputs.container-suffix || 'base' }}:${{ matrix.version }}
    strategy:
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil

      - name: Install dependencies
        if: inputs.language == 'python'
        run: uv sync --group dev --frozen

      - name: Run unit tests
        run: vrg-validate --check test

  evidence:
    name: evidence
    # Runs only after every matrix unit job succeeds, so the artifact's presence
    # is itself proof the test gate passed. Report files (coverage.xml,
    # junit.xml) are collected when the test command emits them; until then the
    # artifact carries evidence.json alone, which is sufficient for completeness.
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Emit ci-evidence-test artifact
        uses: ./actions/ci/evidence/emit
        with:
          gate: test
          files: |
            coverage.xml
            junit.xml
