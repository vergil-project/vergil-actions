name: CD Release

on:
  workflow_call:
    inputs:
      language:
        description: Programming language ecosystem (go, java, python, ruby, rust). Omit for non-language projects.
        type: string
        default: ""
      container-suffix:
        description: Container image suffix (e.g. python, base). Defaults to language, then "base".
        type: string
        default: ""
      container-tag:
        description: Container image tag (e.g. 3.14, 1.26).
        type: string
        default: "latest"
      container-prefix:
        description: Container image name prefix (prod or dev). Defaults to "prod".
        type: string
        default: prod
      registry-publish:
        description: Publish build artifacts to an external package registry.
        type: boolean
        default: false
      build-command:
        description: Override ecosystem-derived build command.
        type: string
        default: ""
      publish-command:
        description: Override ecosystem-derived publish command.
        type: string
        default: ""
      attestation-subject-path:
        description: Glob for build provenance attestation. Leave empty to skip.
        type: string
        default: ""
      sbom-output-file:
        description: SBOM output path ($VERSION placeholder). Leave empty to skip.
        type: string
        default: ""
      release-artifacts:
        description: Files to attach to release ($VERSION placeholder).
        type: string
        default: ""
      evidence-enforce:
        description: >-
          CI-evidence gate fatality. true (default) = ENFORCING mode: incomplete
          or failed evidence fails the release before publish (the spec §9
          publish invariant). false = WARNING mode: the evidence step emits a
          loud warning and never aborts the release — a temporary per-repo
          opt-out, not a permanent soft gate (spec §9.2). This one default drives
          both composites' enforce input and the steps' continue-on-error.
          Promoted from warning to enforcing after the T11 bake (epic
          vergil-project/.github#140).
        type: boolean
        default: true
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      RUBYGEMS_API_KEY:
        required: false
      CENTRAL_USERNAME:
        required: false
      CENTRAL_TOKEN:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false
      # The org GitHub App, used only to dispatch `package-released` to
      # <owner>/packages after a packaged release (spec §8.2). Repos without
      # [package] need not pass them.
      APP_CLIENT_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      # PACKAGE_SIGNING_KEY / PACKAGE_SIGNING_PASSPHRASE are NOT declared here:
      # package-sign reads them from its `package-signing` environment. Those
      # environment secrets reach this cross-repo reusable workflow only when
      # the CALLER passes `secrets: inherit` (proven by a probe,
      # vergil-project/packages#6); declaring them here makes no difference.
      # actionlint can't see environment secrets, so its "undeclared secret"
      # finding is ignored narrowly in .github/actionlint.yaml.

concurrency:
  group: cd
  cancel-in-progress: false

# Binary OS packages (epic vergil-project/.github#356, spec §8.2). Repos whose
# vergil.toml has [package] build their .deb/.rpm packages here, sign the rpms
# in the main-only `package-signing` environment, and attach them (plus
# packages-manifest.json) to the Release. `package-matrix` always runs; for a
# repo without [package] it reports enabled=false, the other package jobs are
# skipped, and `release` runs exactly as before. Any package failure stops
# `release` before anything is published or tagged.
jobs:
  package-matrix:
    name: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil

      - name: Resolve package matrix
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          vrg-package matrix --github-output --manifest packages-manifest.json

      - name: Upload package manifest
        if: steps.resolve.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package-manifest
          path: packages-manifest.json
          if-no-files-found: error

  # Same build cells and toolchain as ci-package.yml's `build` job: the cell's
  # runner and build OS image, unsigned artifacts, one artifact per cell.
  package-build:
    name: package-build / ${{ matrix.id }}
    needs: package-matrix
    if: needs.package-matrix.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    # A normal build takes about 45 s; this bounds a stalled mirror or tool
    # (issue #931; one slow-mirror amd64 build once took 26 min).
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # A release needs every cell; stop the rest as soon as one fails.
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.package-matrix.outputs.build) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up package toolchain
        uses: ./actions/package/setup
        with:
          nfpm: "true"

      - name: Build packages
        shell: bash
        env:
          CELL: ${{ matrix.id }}
        run: |
          set -euo pipefail
          vrg-package build --cell "$CELL" --version "$(vrg-version show)" --out dist/packages

      - name: Upload unsigned packages
        uses: actions/upload-artifact@v7
        with:
          name: package-unsigned-${{ matrix.id }}
          path: dist/packages/
          if-no-files-found: error

  # A separate job so that only packaged repos ever reference (and so never
  # auto-create) the `package-signing` environment, whose deployment-branch
  # policy admits only `main` (spec §7.4). Skipped whenever any build cell
  # fails, which in turn keeps `release` from running.
  package-sign:
    name: package-sign
    needs: [package-matrix, package-build]
    if: needs.package-matrix.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: package-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download unsigned packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-unsigned-*
          path: dist/packages
          merge-multiple: true

      # Fail-fast apt on the runner host (issue #931). The hosted image's
      # sources are a mirror+file list (Azure first, then archive.ubuntu.com);
      # when Azure fails, apt's delayed retry deadlocks after the fallback's
      # InRelease files (LP #2003851) — CD run 37678748594 hung here for
      # 21,578 s. Retries::Delay=false avoids that deadlock; the timeouts bound
      # a stalled connection, and timeout-minutes bounds the job.
      - name: Install rpm signing tools
        run: |
          set -euo pipefail
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::Retries::Delay=false
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o DPkg::Lock::Timeout=60
          )
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends rpm gnupg

      - name: Sign and verify rpms
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGE_SIGNING_KEY" ]; then
            echo "::error::the package-signing environment has no PACKAGE_SIGNING_KEY secret (it must exist, admit only main, and hold PACKAGE_SIGNING_KEY and PACKAGE_SIGNING_PASSPHRASE)"
            exit 1
          fi
          shopt -s nullglob
          packages=(dist/packages/*.deb dist/packages/*.rpm)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::no .deb or .rpm packages were downloaded from the build cells"
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP}/package-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --import

          # Sign with the signing subkey: the usable ([S]-capable, not
          # expired/revoked/disabled, secret present) ssb. Its fingerprint with
          # a trailing `!` forces gpg to use exactly that subkey.
          mapfile -t signing < <(
            gpg --batch --list-secret-keys --with-colons | awk -F: '
              $1 == "sec" || $1 == "ssb" {
                want = ($1 == "ssb" && $12 ~ /s/ && $2 !~ /[eridn]/ && $15 != "#")
                next
              }
              $1 == "fpr" && want { print $10; want = 0 }'
          )
          if [ "${#signing[@]}" -ne 1 ]; then
            echo "::error::PACKAGE_SIGNING_KEY must hold exactly one usable signing subkey; found ${#signing[@]}"
            exit 1
          fi
          subkey="${signing[0]}"
          echo "Signing with subkey ${subkey}"

          passfile="${RUNNER_TEMP}/package-signing-passphrase"
          trap 'rm -f "$passfile"' EXIT
          (umask 077 && printf '%s' "$PACKAGE_SIGNING_PASSPHRASE" > "$passfile")

          rpms=(dist/packages/*.rpm)
          for f in "${rpms[@]}"; do
            rpmsign --addsign \
              --define "_gpg_name ${subkey}!" \
              --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file ${passfile}" \
              "$f"
          done
          rm -f "$passfile"

          # Verify against a private rpm database (no root, no system keyring).
          if [ "${#rpms[@]}" -gt 0 ]; then
            rpmdb="${RUNNER_TEMP}/package-rpmdb"
            mkdir -p "$rpmdb"
            gpg --batch --armor --export > "${RUNNER_TEMP}/package-signing.asc"
            rpmkeys --dbpath "$rpmdb" --import "${RUNNER_TEMP}/package-signing.asc"
            for f in "${rpms[@]}"; do
              out="$(rpmkeys --dbpath "$rpmdb" --checksig "$f")"
              echo "$out"
              case "$out" in
                *"NOT OK"*|*"not OK"*)
                  echo "::error::rpm signature check failed for $f"
                  exit 1
                  ;;
                *"signatures OK"*) ;;
                *)
                  echo "::error::rpm signature check did not report 'signatures OK' for $f"
                  exit 1
                  ;;
              esac
            done
          fi
          echo "Signed ${#rpms[@]} rpm(s); ${#packages[@]} package(s) ready to attest."

      - name: Attest package provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/packages/*

      - name: Upload signed packages
        uses: actions/upload-artifact@v7
        with:
          name: package-signed
          path: dist/packages/
          if-no-files-found: error

  release:
    name: release
    needs: [package-matrix, package-sign]
    # `!cancelled()` lets `release` run while the package jobs are skipped
    # (no [package]). When packaging is enabled it runs only if `package-sign`
    # succeeded: a failed build cell leaves `package-sign` skipped, and skipped
    # is not success, so nothing is tagged or published.
    if: >-
      ${{ !cancelled() &&
          needs.package-matrix.result == 'success' &&
          (needs.package-matrix.outputs.enabled != 'true' ||
           needs.package-sign.result == 'success') }}
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ inputs.container-suffix || inputs.language || 'base' }}:${{ inputs.container-tag }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Required so the CI-evidence harvest can list and download the release
      # PR's ci-evidence-* artifacts from its (separate) CI run (spec §5.2).
      # The consuming repo's cd.yml must grant this scope too — a reusable
      # workflow's permissions are capped by the caller.
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil

      - name: Validate inputs
        uses: ./actions/cd/release/validate-inputs
        with:
          language: ${{ inputs.language }}
          container-tag: ${{ inputs.container-tag }}
          registry-publish: ${{ inputs.registry-publish }}

      - name: Extract version
        id: version
        run: |
          version=$(vrg-version show)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Evidence-first (spec §9), split in two so the bundle is both gated before
      # publish AND self-contained + attachable after it:
      #   * GATE (here, pre-publish) — resolve the release PR, harvest the
      #     required gate evidence, and validate completeness. Once enforcing,
      #     incomplete evidence fails the release here, before anything is built,
      #     tagged, or released.
      #   * ATTACH (below, after tag-and-release) — assemble the complete bundle
      #     (now including the built SBOM), attest it, and upload it to the
      #     Release that now exists as the upload target.
      # Both steps ENFORCE by default (evidence-enforce=true): continue-on-error
      # tracks the evidence-enforce flag, so incomplete/failed evidence aborts the
      # release — even a failure the composite's shell wrapper cannot catch (a
      # `uses:` attest step) is caught by the continue-on-error guard. Passing
      # evidence-enforce=false demotes both steps to WARNING mode — a temporary
      # per-repo opt-out, not a permanent soft gate. Enforcing is the T11
      # promotion (epic .github#140): a single flip of the one default that flips
      # both steps' fatality and both continue-on-error guards at once. Each
      # step is followed by an explicit "Enforce …" guard step (#925) that
      # re-checks the outcome and the composite's positive success output, so
      # an enforcing failure fails the job even if it is masked upstream.
      - name: Resolve SBOM path for evidence
        id: evidence_sbom
        if: >-
          steps.tag_check.outputs.exists == 'false' &&
          inputs.sbom-output-file != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SBOM_OUTPUT_FILE: ${{ inputs.sbom-output-file }}
        run: |
          echo "path=${SBOM_OUTPUT_FILE//\$VERSION/$VERSION}" >> "$GITHUB_OUTPUT"

      - name: CI evidence gate (pre-publish)
        id: evidence_gate
        if: steps.tag_check.outputs.exists == 'false'
        continue-on-error: ${{ !inputs.evidence-enforce }}
        uses: ./actions/cd/release/ci-evidence-gate
        with:
          version: ${{ steps.version.outputs.version }}
          enforce: ${{ inputs.evidence-enforce }}

      # Explicit enforcement guard (#925). In the vergil-project/packages v1.1.1
      # release (CD run 37621521706) the gate composite's inner step ended
      # outcome=failure in enforcing mode, yet the outer step reported success
      # and the package download / Tag and release steps ran — the release
      # published without validated evidence. Rather than trust the failure to
      # propagate through continue-on-error and the composite boundary, this
      # plain step re-checks it independently: it fails the job when the gate
      # step's outcome is failure OR when the step "succeeded" without the
      # composite's positive `passed=true` signal. It has no continue-on-error,
      # and every later step uses an implicit success() condition, so nothing
      # is downloaded, built, tagged, or released after it fires.
      - name: Enforce CI evidence gate
        if: >-
          ${{ always() &&
              inputs.evidence-enforce &&
              steps.tag_check.outputs.exists == 'false' &&
              (steps.evidence_gate.outcome == 'failure' ||
               (steps.evidence_gate.outcome == 'success' &&
                steps.evidence_gate.outputs.passed != 'true')) }}
        env:
          GATE_OUTCOME: ${{ steps.evidence_gate.outcome }}
          GATE_PASSED: ${{ steps.evidence_gate.outputs.passed }}
        run: |
          echo "::error::CI evidence gate failed in enforcing mode — refusing to tag or publish (gate outcome='${GATE_OUTCOME}', passed='${GATE_PASSED}')"
          exit 1

      # Packaged repos only: the signed packages and packages-manifest.json
      # become Release assets. They are downloaded into the workspace and then
      # moved under $RUNNER_TEMP, so a later registry build (e.g. an sdist that
      # sweeps untracked files) never picks them up.
      - name: Download signed packages
        if: >-
          needs.package-matrix.outputs.enabled == 'true' &&
          steps.tag_check.outputs.exists == 'false'
        uses: actions/download-artifact@v7
        with:
          name: package-signed
          path: .vergil-release-packages

      - name: Download package manifest
        if: >-
          needs.package-matrix.outputs.enabled == 'true' &&
          steps.tag_check.outputs.exists == 'false'
        uses: actions/download-artifact@v7
        with:
          name: package-manifest
          path: .vergil-release-packages

      - name: Stage package release assets
        if: >-
          needs.package-matrix.outputs.enabled == 'true' &&
          steps.tag_check.outputs.exists == 'false'
        id: packages
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/vergil-release-packages"
          rm -rf "$dir"
          mv .vergil-release-packages "$dir"
          if [ ! -f "$dir/packages-manifest.json" ]; then
            echo "::error::packages-manifest.json is missing from the package release assets"
            exit 1
          fi
          shopt -s nullglob
          packages=("$dir"/*.deb "$dir"/*.rpm)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::no signed .deb or .rpm packages to attach"
            exit 1
          fi
          ls -l "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Resolve release artifacts
        if: >-
          steps.tag_check.outputs.exists == 'false'
        id: resolved
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARTIFACTS: ${{ inputs.release-artifacts }}
          PACKAGE_DIR: ${{ steps.packages.outputs.dir }}
        run: |
          artifacts="${RELEASE_ARTIFACTS//\$VERSION/$VERSION}"
          if [ -n "$PACKAGE_DIR" ]; then
            artifacts="${artifacts:+$artifacts }${PACKAGE_DIR}/*"
          fi
          echo "release-artifacts=${artifacts}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        if: >-
          contains(fromJSON('["python","java","ruby","rust","go"]'), inputs.language) &&
          steps.tag_check.outputs.exists == 'false'
        uses: ./actions/cd/release/registry-publish
        with:
          language: ${{ inputs.language }}
          version: ${{ steps.version.outputs.version }}
          registry-publish: ${{ inputs.registry-publish }}
          build-command: ${{ inputs.build-command }}
          publish-command: ${{ inputs.publish-command }}
          attestation-subject-path: ${{ inputs.attestation-subject-path }}
          sbom-output-file: ${{ inputs.sbom-output-file }}
          cargo-registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          rubygems-api-key: ${{ secrets.RUBYGEMS_API_KEY }}
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-token: ${{ secrets.CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Tag and release
        if: steps.tag_check.outputs.exists == 'false'
        uses: ./actions/cd/release/tag-and-release
        with:
          version: ${{ steps.version.outputs.version }}
          release-artifacts: ${{ steps.resolved.outputs.release-artifacts }}

      # Post-publish attach (spec §9): the Release now exists (upload target) and
      # the SBOM has been built by registry-publish (bundle content), so the
      # bundle the pre-publish gate could only validate can now be assembled in
      # full, attested, and attached. Same enforce-mode contract as the gate
      # (honors the evidence-enforce flag; enforcing by default).
      - name: Attach CI evidence bundle (post-release)
        id: evidence_attach
        if: steps.tag_check.outputs.exists == 'false'
        continue-on-error: ${{ !inputs.evidence-enforce }}
        uses: ./actions/cd/release/ci-evidence-attach
        with:
          version: ${{ steps.version.outputs.version }}
          tag: ${{ steps.version.outputs.tag }}
          enforce: ${{ inputs.evidence-enforce }}
          sbom-file: ${{ steps.evidence_sbom.outputs.path }}

      # Explicit enforcement guard for the attach (#925), mirroring the
      # pre-publish guard above: fail the job when the attach step's outcome is
      # failure OR it "succeeded" without the composite's positive
      # `attached=true` signal. By this point the tag and GitHub Release
      # already exist, so the error says so plainly — the release is published
      # but carries no (or an incomplete) evidence bundle and needs operator
      # attention.
      - name: Enforce CI evidence attach
        if: >-
          ${{ always() &&
              inputs.evidence-enforce &&
              steps.tag_check.outputs.exists == 'false' &&
              (steps.evidence_attach.outcome == 'failure' ||
               (steps.evidence_attach.outcome == 'success' &&
                steps.evidence_attach.outputs.attached != 'true')) }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ATTACH_OUTCOME: ${{ steps.evidence_attach.outcome }}
          ATTACHED: ${{ steps.evidence_attach.outputs.attached }}
        run: |
          echo "::error::CI evidence bundle was NOT attached in enforcing mode, but release ${TAG} has ALREADY been tagged and published — the release is missing its evidence bundle and needs operator attention (attach outcome='${ATTACH_OUTCOME}', attached='${ATTACHED}')"
          exit 1

      - name: Verify tag is resolvable from remote
        if: steps.tag_check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          repo_url="https://github.com/${GITHUB_REPO}"
          tmp="$(mktemp -d)"
          if git clone --depth 1 --branch "$TAG" "$repo_url" "$tmp" 2>/dev/null; then
            rm -rf "$tmp"
            exit 0
          fi
          echo "::warning::Tag $TAG has missing objects on remote — resyncing"
          git push --no-thin origin "$TAG" --force
          git clone --depth 1 --branch "$TAG" "$repo_url" "$tmp"
          rm -rf "$tmp"

      # Packaged repos only, and only for a newly created release: ask
      # <owner>/packages to re-index (spec §8.2). Both steps are deferred
      # (continue-on-error): the release stands, the index's weekly reconcile
      # self-heals a missed dispatch, and vrg-release's package-index stage
      # reports the miss.
      - name: Mint package-index dispatch token
        id: dispatch_token
        if: >-
          needs.package-matrix.outputs.enabled == 'true' &&
          steps.tag_check.outputs.exists == 'false'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: packages

      - name: Dispatch package index
        if: steps.dispatch_token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.dispatch_token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          PRODUCT: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${OWNER}/packages/dispatches" \
            -f event_type=package-released \
            -f "client_payload[product]=${PRODUCT}"
          echo "Dispatched package-released (${PRODUCT}) to ${OWNER}/packages"
