name: CD Release

on:
  workflow_call:
    inputs:
      language:
        description: Programming language ecosystem (go, java, python, ruby, rust). Omit for non-language projects.
        type: string
        default: ""
      container-suffix:
        description: Container image suffix (e.g. python, base). Defaults to language, then "base".
        type: string
        default: ""
      container-tag:
        description: Container image tag (e.g. 3.14, 1.26).
        type: string
        default: "latest"
      container-prefix:
        description: Container image name prefix (prod or dev). Defaults to "prod".
        type: string
        default: prod
      registry-publish:
        description: Publish build artifacts to an external package registry.
        type: boolean
        default: false
      build-command:
        description: Override ecosystem-derived build command.
        type: string
        default: ""
      publish-command:
        description: Override ecosystem-derived publish command.
        type: string
        default: ""
      attestation-subject-path:
        description: Glob for build provenance attestation. Leave empty to skip.
        type: string
        default: ""
      sbom-output-file:
        description: SBOM output path ($VERSION placeholder). Leave empty to skip.
        type: string
        default: ""
      release-artifacts:
        description: Files to attach to release ($VERSION placeholder).
        type: string
        default: ""
      evidence-enforce:
        description: >-
          CI-evidence gate fatality. false (default) = WARNING mode: the
          evidence step never aborts the release. true = ENFORCING mode:
          incomplete evidence fails the release (spec §9.2). Promotion to
          enforcing is a single human-gated flip of this one default (Task
          T11) — it also flips the step's continue-on-error automatically.
        type: boolean
        default: false
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      RUBYGEMS_API_KEY:
        required: false
      CENTRAL_USERNAME:
        required: false
      CENTRAL_TOKEN:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-${{ inputs.container-suffix || inputs.language || 'base' }}:${{ inputs.container-tag }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Required so the CI-evidence harvest can list and download the release
      # PR's ci-evidence-* artifacts from its (separate) CI run (spec §5.2).
      # The consuming repo's cd.yml must grant this scope too — a reusable
      # workflow's permissions are capped by the caller.
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil

      - name: Validate inputs
        uses: ./actions/cd/release/validate-inputs
        with:
          language: ${{ inputs.language }}
          container-tag: ${{ inputs.container-tag }}
          registry-publish: ${{ inputs.registry-publish }}

      - name: Extract version
        id: version
        run: |
          version=$(vrg-version show)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Evidence-first (spec §9): the CI-evidence gate runs before build/publish
      # and tag-and-release so that, once enforcing, nothing publishes without
      # complete attested evidence. Ships in WARNING mode — continue-on-error
      # tracks the evidence-enforce flag so a rare attest failure (a composite
      # `uses:` step that the composite's own shell wrapper cannot catch) still
      # never aborts the release. Promotion (T11) flips evidence-enforce alone.
      - name: Resolve SBOM path for evidence
        id: evidence_sbom
        if: >-
          steps.tag_check.outputs.exists == 'false' &&
          inputs.sbom-output-file != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SBOM_OUTPUT_FILE: ${{ inputs.sbom-output-file }}
        run: |
          echo "path=${SBOM_OUTPUT_FILE//\$VERSION/$VERSION}" >> "$GITHUB_OUTPUT"

      - name: Harvest, attest, and attach CI evidence
        if: steps.tag_check.outputs.exists == 'false'
        continue-on-error: ${{ !inputs.evidence-enforce }}
        uses: ./actions/cd/release/ci-evidence
        with:
          version: ${{ steps.version.outputs.version }}
          tag: ${{ steps.version.outputs.tag }}
          enforce: ${{ inputs.evidence-enforce }}
          sbom-file: ${{ steps.evidence_sbom.outputs.path }}

      - name: Resolve release artifacts
        if: >-
          steps.tag_check.outputs.exists == 'false'
        id: resolved
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARTIFACTS: ${{ inputs.release-artifacts }}
        run: |
          echo "release-artifacts=${RELEASE_ARTIFACTS//\$VERSION/$VERSION}" \
            >> "$GITHUB_OUTPUT"

      - name: Build and publish
        if: >-
          contains(fromJSON('["python","java","ruby","rust","go"]'), inputs.language) &&
          steps.tag_check.outputs.exists == 'false'
        uses: ./actions/cd/release/registry-publish
        with:
          language: ${{ inputs.language }}
          version: ${{ steps.version.outputs.version }}
          registry-publish: ${{ inputs.registry-publish }}
          build-command: ${{ inputs.build-command }}
          publish-command: ${{ inputs.publish-command }}
          attestation-subject-path: ${{ inputs.attestation-subject-path }}
          sbom-output-file: ${{ inputs.sbom-output-file }}
          cargo-registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          rubygems-api-key: ${{ secrets.RUBYGEMS_API_KEY }}
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-token: ${{ secrets.CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Tag and release
        if: steps.tag_check.outputs.exists == 'false'
        uses: ./actions/cd/release/tag-and-release
        with:
          version: ${{ steps.version.outputs.version }}
          release-artifacts: ${{ steps.resolved.outputs.release-artifacts }}

      - name: Verify tag is resolvable from remote
        if: steps.tag_check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          repo_url="https://github.com/${GITHUB_REPO}"
          tmp="$(mktemp -d)"
          if git clone --depth 1 --branch "$TAG" "$repo_url" "$tmp" 2>/dev/null; then
            rm -rf "$tmp"
            exit 0
          fi
          echo "::warning::Tag $TAG has missing objects on remote — resyncing"
          git push --no-thin origin "$TAG" --force
          git clone --depth 1 --branch "$TAG" "$repo_url" "$tmp"
          rm -rf "$tmp"
