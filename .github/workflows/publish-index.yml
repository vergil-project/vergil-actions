name: Publish package index

# Reusable workflow for an `<org>/packages` repository (epic
# vergil-project/.github#356, spec §7.2). It rebuilds the signed apt/dnf
# package-repository site from the product releases listed in the caller's
# `packages.toml` and deploys it to GitHub Pages.
#
#   * build-index — `vrg-package index` selects each product's retained
#     releases from one release listing, then downloads and verifies only
#     those: every asset's build attestation (and every .rpm's org
#     signature). It writes the apt and dnf metadata, signs it, and enforces
#     the size guard. All logic lives in vergil-tooling.
#     It then records the sha256 of every signed InRelease and repomd.xml as
#     the job's index-manifest output (actions/publish/index/live-check).
#   * deploy — publishes the site through the Actions-based Pages deploy, then
#     fetches those files from the deployed page_url with a cache-busting
#     query until they match, failing within about five minutes if Pages is
#     still serving an older deployment (issue #1123).
#
# The signing subkey lives in the caller's `index-signing` environment, which
# admits only `develop`: `repository_dispatch` and `schedule` always run on the
# default branch, so this is not `package-signing` (main-only) — spec §7.4.
#
# Callers must grant: contents: read, attestations: read, pages: write,
# id-token: write.

on:
  workflow_call: {}

permissions:
  contents: read

# Serialize index rebuilds; never cancel one mid-deploy.
concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  build-index:
    name: build-index
    runs-on: ubuntu-24.04
    # develop-only: dispatch/schedule run on the default branch (spec §7.4).
    environment: index-signing
    permissions:
      contents: read
      attestations: read
    outputs:
      index-manifest: ${{ steps.manifest.outputs.manifest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Always from git: this job rebuilds and re-signs the vergil apt index,
      # so it must never install from the index it is about to repair. With
      # the caller's vX.Y pin, `git` installs the newest vX.Y.Z release, not
      # the floating vX.Y tag: a release dispatches this rebuild before it
      # moves vX.Y, and the rebuild must run that release (issue #1144).
      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil
        with:
          install-source: git

      - name: Install index tools
        shell: bash
        # dpkg-deb (dpkg-dev), rpm/rpmkeys (rpm), createrepo_c (createrepo-c),
        # gpg (gnupg). `gh` ships on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c rpm dpkg-dev gnupg

      - name: Build, verify and sign the index
        shell: bash
        env:
          # Release download and `gh attestation verify`.
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: vrg-package index --config packages.toml --keys keys --out _site

      # The sha256 of every signed InRelease and repomd.xml just built: what
      # the deploy job's live check expects Pages to serve.
      - name: Record the index manifest
        id: manifest
        uses: ./actions/publish/index/live-check
        with:
          mode: manifest
          site: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy
    needs: build-index
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Pages can report a deployment success while its origin keeps serving
      # the previous one (vergil-project/packages#46). Fail here, within
      # minutes, unless the deployed site serves the files build-index built.
      - name: Verify the deployed index is live
        uses: ./actions/publish/index/live-check
        with:
          mode: verify
          base-url: ${{ steps.deployment.outputs.page_url }}
          manifest: ${{ needs.build-index.outputs.index-manifest }}
