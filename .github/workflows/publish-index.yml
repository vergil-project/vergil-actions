name: Publish package index

# Reusable workflow for an `<org>/packages` repository (epic
# vergil-project/.github#356, spec §7.2). It rebuilds the signed apt/dnf
# package-repository site from the product releases listed in the caller's
# `packages.toml` and deploys it to GitHub Pages.
#
#   * build-index — `vrg-package index` selects each product's retained
#     releases from one release listing, then downloads and verifies only
#     those: every asset's build attestation (and every .rpm's org
#     signature). It writes the apt and dnf metadata, signs it, and enforces
#     the size guard. All logic lives in vergil-tooling.
#     It then records the sha256 of every signed InRelease and repomd.xml as
#     the job's index-manifest output (actions/publish/index/live-check).
#   * deploy — publishes the site through the Actions-based Pages deploy, then
#     fetches those files from the deployed page_url with a cache-busting
#     query until they match, failing within about five minutes if Pages is
#     still serving an older deployment (issue #1123).
#
# The signing subkey lives in the caller's `index-signing` environment, which
# admits only `develop`: `repository_dispatch` and `schedule` always run on the
# default branch, so this is not `package-signing` (main-only) — spec §7.4.
#
# Callers must grant: contents: read, attestations: read, pages: write,
# id-token: write.

on:
  workflow_call:
    # The org automation App's credentials, for the ops-report action (epic
    # vergil-project/.github#1494), used only by the report job. Declared
    # optional a release before that job, so every caller could pass them
    # first and no caller's run turned red (spec §5.6). PACKAGE_SIGNING_KEY and
    # PACKAGE_SIGNING_PASSPHRASE are not declared: build-index reads them from
    # its index-signing environment, which the caller's `secrets: inherit`
    # delivers; .github/actionlint.yaml ignores exactly those references.
    secrets:
      APP_CLIENT_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

# Serialize index rebuilds; never cancel one mid-deploy.
concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  build-index:
    name: build-index
    runs-on: ubuntu-24.04
    # Cap the index build rather than leave it at GitHub's 360-minute
    # default, so the release stage waiting on it can tell slow from stuck.
    # Runs today take 20 to 27 minutes (one took 91), and vergil-tooling's
    # package-index wait is one hour, so 60 matches it. Lower this once
    # epic vergil-project/.github#1003 (the retention-first index build,
    # aiming for a build-index under 5 minutes) has shipped.
    timeout-minutes: 60
    # develop-only: dispatch/schedule run on the default branch (spec §7.4).
    environment: index-signing
    permissions:
      contents: read
      attestations: read
    outputs:
      index-manifest: ${{ steps.manifest.outputs.manifest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Always from git: this job rebuilds and re-signs the vergil apt index,
      # so it must never install from the index it is about to repair. With
      # the caller's vX.Y pin, `git` installs the newest vX.Y.Z release, not
      # the floating vX.Y tag: a release dispatches this rebuild before it
      # moves vX.Y, and the rebuild must run that release (issue #1144).
      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.98
        with:
          install-source: git

      - name: Install index tools
        shell: bash
        # dpkg-deb (dpkg-dev), rpm/rpmkeys (rpm), createrepo_c (createrepo-c),
        # gpg (gnupg). `gh` ships on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c rpm dpkg-dev gnupg

      - name: Build, verify and sign the index
        shell: bash
        env:
          # Release download and `gh attestation verify`: reads only, with
          # this job's read-only GITHUB_TOKEN. The job runs in the
          # index-signing environment, so it cannot read the App keys, which
          # live only in the automation environment (epic
          # vergil-project/.github#1384); it writes nothing with a token.
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
        run: vrg-package index --config packages.toml --keys keys --out _site

      # The sha256 of every signed InRelease and repomd.xml just built: what
      # the deploy job's live check expects Pages to serve.
      - name: Record the index manifest
        id: manifest
        uses: vergil-project/vergil-actions/actions/publish/index/live-check@v2.1.98
        with:
          mode: manifest
          site: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Identity exception (epic vergil-project/.github#1494, spec §5.4): the
  # Pages deployment keeps GITHUB_TOKEN (pages: write, with the run's OIDC
  # token from id-token: write), the default token of actions/deploy-pages.
  # The job runs in the github-pages environment its deployment is made to,
  # and a job declares one environment, so it cannot read the App keys, which
  # live only in the automation environment (epic vergil-project/.github#1384).
  # actions/ops/report/tests/app-identity.test.sh lists it as the exception.
  deploy:
    name: deploy
    needs: build-index
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Pages can report a deployment success while its origin keeps serving
      # the previous one (vergil-project/packages#46). Fail here, within
      # minutes, unless the deployed site serves the files build-index built.
      - name: Verify the deployed index is live
        uses: vergil-project/vergil-actions/actions/publish/index/live-check@v2.1.98
        with:
          mode: verify
          base-url: ${{ steps.deployment.outputs.page_url }}
          manifest: ${{ needs.build-index.outputs.index-manifest }}

  # Reports publish-index's result to the org's operations queue (epic
  # vergil-project/.github#1494, spec §5.3): one result for both jobs. It runs
  # on the bare runner like the jobs it reports; the setup action installs
  # vergil-tooling from git, never from the index this workflow publishes.
  # The checkout comes first: setting up Vergil reads the workspace's
  # vergil.toml, and the local ./actions/ ref resolves against it. The action
  # mints its own issues-only App token, only on refs/heads/develop, so this
  # job's GITHUB_TOKEN stays read-only. No concurrency group: GitHub keeps one
  # pending run per group and cancels the older, which would drop a report.
  # actions/ops/report/tests/reporting-jobs.test.sh guards this layout.
  report:
    name: report
    needs: [build-index, deploy]
    if: always()
    runs-on: ubuntu-24.04
    environment: automation
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report publish-index
        uses: vergil-project/vergil-actions/actions/ops/report@v2.1.98
        env:
          VRG_AUTOMATION_APP: ${{ vars.VRG_AUTOMATION_APP }}
          VRG_TRUSTED_AUTHORS: ${{ vars.VRG_TRUSTED_AUTHORS }}
        with:
          job: publish-index
          results: ${{ needs.build-index.result }},${{ needs.deploy.result }}
          app-client-id: ${{ secrets.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
