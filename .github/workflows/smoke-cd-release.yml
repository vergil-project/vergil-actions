name: Smoke - cd-release container tag

# Runs the framework-free container-tag.test.sh harness (issues #1017 and
# #1020): the cd-release release job runs on the resolver's
# primary-container-suffix and primary-container-tag from its `setup` job,
# never on a caller's `container-tag` input (accepted but ignored with a
# warning until vergil-project/vergil-tooling#3484 removes it from the
# callers) or a suffix built from `container-suffix`/`language`; a caller's
# `container-suffix` is only a cross-check that must match. For fixture
# repos, the release image is vrg-ci-resolve's image for the primary version.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cd-release.yml
      - .github/workflows/smoke-cd-release.yml
      - actions/cd/release/primary-suffix/**
      - actions/cd/release/tests/**
      - actions/shared/setup/vergil/**

permissions:
  contents: read

jobs:
  fixtures:
    name: container-tag fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # The harness runs the real resolver, so install vergil-tooling at this
      # repo's [dependencies].vergil pin first.
      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.53
      - name: Run container-tag harness
        shell: bash
        run: bash actions/cd/release/tests/container-tag.test.sh
