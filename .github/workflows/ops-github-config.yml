name: Ops — GitHub Config

on:
  workflow_call:
    inputs:
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".
    secrets:
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  # Safety net behind delete-on-merge and delete-on-close (issue #952): deletes
  # branches whose PR work is finished. It lives here, not in its own reusable
  # workflow, because every consumer's ops.yml already calls this workflow on a
  # schedule (vrg-github-repo-config audits for that wiring), so it reaches every
  # repo with no consumer change.
  branch-sweep:
    name: branch-sweep
    runs-on: ubuntu-24.04
    # One run of this job per repository at a time, queued, never cancelled:
    # a scheduled run and a dispatch never overlap.
    concurrency:
      group: ${{ github.repository }}/branch-sweep
      cancel-in-progress: false
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Narrowest token that can delete a branch: scoped to the calling
          # repo only (no owner/repositories input), contents:write for the
          # ref delete, pull-requests:read to decide which branches are
          # finished. GITHUB_TOKEN cannot be used: a called workflow can only
          # request what the caller's ops.yml grants, and that is contents:read.
          permission-contents: write
          permission-pull-requests: read

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil

      - name: Sweep finished branches
        uses: ./actions/ops/github-config/branch-sweep
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # The automatic fleet sync (epic vergil-project/.github#1064): converges the
  # repository's settings and rulesets, and opens one auto-merging PR on an
  # automation/ branch for any managed file that has drifted from its released
  # master copy. It runs as the org automation App, named by
  # VRG_AUTOMATION_APP, whose identity is used only for this mechanized work,
  # never for anything an AI agent does. It holds this workflow's only
  # Administration write token, so it runs only from develop and checks out
  # develop: no other branch's code ever runs with that token.
  github-config:
    name: github-config
    runs-on: ubuntu-24.04
    # The automation App token update runs with has a fixed one-hour life,
    # and update's wait for its sync PR to merge ends inside it. A run taking
    # longer could not use its token, so cap the job there rather than at
    # GitHub's 360-minute default, which would let a hung run hold the
    # concurrency group for six hours.
    timeout-minutes: 60
    concurrency:
      group: ${{ github.repository }}/github-config
      cancel-in-progress: false
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    # VRG_AUTOMATION_APP says the process holds the automation App's token,
    # so every vrg-* command that sees it verifies GH_TOKEN against that App
    # and fails when it cannot. It is therefore set only on the step that
    # holds the token and does the automation work, never on the job: set
    # job-wide it reached the setup action's `vrg-whoami --mode` check, which
    # runs with no GH_TOKEN, and failed every run (issue #1192).
    # actions/ops/github-config/tests/automation-env.test.sh guards this.
    steps:
      # Before any token is minted: a dispatch from another ref would run that
      # ref's code with a write token, and an empty VRG_AUTOMATION_APP leaves
      # no automation identity to verify the token against. The step reads
      # the variable as AUTOMATION_APP: it holds no token, so it must not
      # carry VRG_AUTOMATION_APP itself.
      - name: Require develop and VRG_AUTOMATION_APP
        shell: bash
        env:
          REF: ${{ github.ref }}
          AUTOMATION_APP: ${{ vars.VRG_AUTOMATION_APP }}
        run: |
          set -euo pipefail
          if [ "${REF}" != "refs/heads/develop" ]; then
            echo "::error::github-config runs only from refs/heads/develop, not ${REF}"
            exit 1
          fi
          if [ -z "${AUTOMATION_APP}" ]; then
            echo "::error::the VRG_AUTOMATION_APP Actions variable is empty or not visible to this repository; set it at org level to the automation App's slug"
            exit 1
          fi

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Scoped to the calling repo only (no owner/repositories input),
          # with what update needs:
          # - Administration write: read and converge the repository settings,
          #   rulesets (GitHub returns bypass_actors only to a caller that can
          #   edit the ruleset), Actions permissions and vulnerability alerts.
          # - Contents write: push the automation/ branch. GET
          #   /repos/{owner}/{repo} also leaves out the merge settings unless
          #   the token holds Contents read and write.
          # - Pull requests write: open the sync PR, close an earlier one, and
          #   turn on auto-merge.
          # - Workflows write: a sync PR can change files under
          #   .github/workflows/.
          # - Metadata read: always included, stated so the token's whole
          #   permission set is explicit.
          # No Issues permission: the repo-config code makes no Issues call.
          permission-administration: write
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-metadata: read

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil

      # Route git's HTTPS credentials through gh, which reads GH_TOKEN, so a
      # git clone or push the tooling runs authenticates as the App with this
      # job's scoped token.
      - name: Configure git to use the App token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      # The pattern in actions/create-github-app-token's README: sync commits
      # are authored and committed by <app-slug>[bot], with the bot user's ID
      # in the noreply address, so they show as the automation App.
      - name: Set the git identity to the App's bot user
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      # VRG_AUTOMATION_APP comes from the org-level Actions variable holding
      # the automation App's slug: vergil-tooling checks that GH_TOKEN was
      # minted by that App before it does any automation work.
      - name: Update GitHub configuration
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VRG_AUTOMATION_APP: ${{ vars.VRG_AUTOMATION_APP }}
        run: vrg-github-repo-config update --repo "${{ github.repository }}"

  # Report-only Dependabot gate (epic vergil-project/.github#420): alerts are
  # on, Dependabot never opens a PR, and this job turns any open alert, at any
  # severity, into a red nightly run. vrg-dependabot-audit exits 0 (no open
  # alerts), 1 (open alerts) or 2 (the alerts could not be read); both 1 and 2
  # fail the job. A public repo's log carries counts only, never package names.
  dependabot-audit:
    name: dependabot-audit
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.repository }}/dependabot-audit
      cancel-in-progress: false
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Narrowest token that can read Dependabot alerts: scoped to the
          # calling repo only (no owner/repositories input), with only the
          # "Dependabot alerts: Read" permission. GITHUB_TOKEN cannot be used:
          # a called workflow can only request what the caller's ops.yml
          # grants, and that is contents:read, which cannot read alerts.
          permission-vulnerability-alerts: read

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: ./actions/shared/setup/vergil

      - name: Audit open Dependabot alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: vrg-dependabot-audit --repo "${{ github.repository }}"
