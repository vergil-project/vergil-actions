name: Ops — GitHub Config

on:
  workflow_call:
    inputs:
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".
    secrets:
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  # Safety net behind delete-on-merge and delete-on-close (issue #952): deletes
  # branches whose PR work is finished. It lives here, not in its own reusable
  # workflow, because every consumer's ops.yml already calls this workflow on a
  # schedule (vrg-github-repo-config audits for that wiring), so it reaches every
  # repo with no consumer change.
  branch-sweep:
    name: branch-sweep
    runs-on: ubuntu-24.04
    # One run of this job per repository at a time, queued, never cancelled:
    # a scheduled run and a dispatch never overlap.
    concurrency:
      group: ${{ github.repository }}/branch-sweep
      cancel-in-progress: false
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Narrowest token that can delete a branch: scoped to the calling
          # repo only (no owner/repositories input), contents:write for the
          # ref delete, pull-requests:read to decide which branches are
          # finished. GITHUB_TOKEN cannot be used: a called workflow can only
          # request what the caller's ops.yml grants, and that is contents:read.
          permission-contents: write
          permission-pull-requests: read

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.69

      - name: Sweep finished branches
        uses: vergil-project/vergil-actions/actions/ops/github-config/branch-sweep@v2.1.69
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  github-config:
    name: github-config
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.repository }}/github-config
      cancel-in-progress: false
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Scoped to the calling repo only (no owner/repositories input),
          # with only what the read-only audit needs: Administration read
          # (repository settings, rulesets, Actions permissions, whether
          # vulnerability alerts are on) and Contents write. The audit writes
          # no contents, but GET /repos/{owner}/{repo} leaves out the merge
          # settings (allow_*_merge, delete_branch_on_merge,
          # allow_update_branch, the merge and squash commit titles and
          # messages) unless the token holds Contents read and write, as
          # GitHub's "Get a repository" REST docs state. Contents also covers
          # reading vergil.toml and the workflow files. No Issues permission:
          # the repo-config code makes no Issues call.
          permission-administration: read
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.69

      # Route git's HTTPS credentials through gh, which reads GH_TOKEN, so a
      # git clone or push the tooling runs authenticates as the App with this
      # job's scoped token.
      - name: Configure git to use the App token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Audit GitHub configuration
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: vrg-github-repo-config audit --repo "${{ github.repository }}"

  # Temporary probe (epic vergil-project/.github#1064, Task A1b): shows whether
  # an automation App token reads a ruleset's bypass_actors, whether the
  # VRG_AUTOMATION_APP org variable reaches this repository, and the token's
  # GraphQL viewer login. A human dispatches it from develop; scheduled runs
  # skip it. Task A2 removes it.
  bypass-probe:
    name: bypass-probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.repository }}/bypass-probe
      cancel-in-progress: false
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      # Before any token is minted: this job requests Administration write,
      # so it runs only from develop.
      - name: Require develop
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${REF}" != "refs/heads/develop" ]; then
            echo "::error::bypass-probe runs only from refs/heads/develop, not ${REF}"
            exit 1
          fi

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Scoped to the calling repo only (no owner/repositories input).
          # Administration write is the permission whose token the premise is
          # about: GitHub returns a ruleset's bypass_actors only to a caller
          # that can edit the ruleset. Metadata read is always included and is
          # stated here so the token's whole permission set is explicit.
          permission-administration: write
          permission-metadata: read

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Probe
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          AUTOMATION_APP: ${{ vars.VRG_AUTOMATION_APP }}
        run: |
          set -euo pipefail

          # The variable's value is never printed, only whether it is set.
          if [ -n "${AUTOMATION_APP}" ]; then
            echo "VRG_AUTOMATION_APP set: yes"
          else
            echo "VRG_AUTOMATION_APP set: no"
          fi

          login="$(gh api graphql -f query='query { viewer { login } }' --jq '.data.viewer.login')"
          echo "login: ${login}"

          ids="$(gh api --paginate "repos/${REPO}/rulesets?includes_parents=false" \
            --jq '.[] | select(.name == "Tag protection") | .id')"
          count="$(printf '%s' "${ids}" | grep -c . || true)"
          if [ "${count}" -ne 1 ]; then
            echo "::error::expected exactly one ruleset named \"Tag protection\" in ${REPO}, found ${count}"
            exit 1
          fi

          ruleset="$(gh api "repos/${REPO}/rulesets/${ids}")"
          # A response with no bypass_actors field is reported as such, never
          # counted as an empty list.
          if ! printf '%s' "${ruleset}" | jq -e 'has("bypass_actors")' >/dev/null; then
            echo "::error::the \"Tag protection\" ruleset response has no bypass_actors field"
            exit 1
          fi
          printf '%s' "${ruleset}" | jq -r '.bypass_actors[] | "\(.actor_type) \(.actor_id)"'
          echo "bypass_actors entries: $(printf '%s' "${ruleset}" | jq '.bypass_actors | length')"

  # Report-only Dependabot gate (epic vergil-project/.github#420): alerts are
  # on, Dependabot never opens a PR, and this job turns any open alert, at any
  # severity, into a red nightly run. vrg-dependabot-audit exits 0 (no open
  # alerts), 1 (open alerts) or 2 (the alerts could not be read); both 1 and 2
  # fail the job. A public repo's log carries counts only, never package names.
  dependabot-audit:
    name: dependabot-audit
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.repository }}/dependabot-audit
      cancel-in-progress: false
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Narrowest token that can read Dependabot alerts: scoped to the
          # calling repo only (no owner/repositories input), with only the
          # "Dependabot alerts: Read" permission. GITHUB_TOKEN cannot be used:
          # a called workflow can only request what the caller's ops.yml
          # grants, and that is contents:read, which cannot read alerts.
          permission-vulnerability-alerts: read

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.69

      - name: Audit open Dependabot alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: vrg-dependabot-audit --repo "${{ github.repository }}"
