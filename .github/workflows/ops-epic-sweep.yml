name: Ops — Epic Sweep

# Scheduled reconciliation sweep (epic vergil-project/.github#75, #80, #176).
# Reusable workflow: a caller triggers it on a schedule, or by
# workflow_dispatch (how the one-time #176 org migration is run). It runs
# `vrg-epic-audit --close`, which writes across the whole org in three passes:
#   1. Drift close: closes tasks whose PR merged and epics whose children are
#      all closed (work that missed its event-driven close: Action down,
#      broken secret, race), and reopens an epic closed with an open child.
#   2. Archive drain: moves the closed children of every standing epic
#      (ad-hoc, intake, planning) into per-quarter archives.
#   3. Orphan pass ("every issue belongs to an epic"): links body-only
#      `Parent:` lines as native sub-issues, strips the retired
#      triage/idea/research labels, moves a now-public repo's self-homed
#      queue items under the org .github queues, and attaches every orphan to
#      its home's intake epic.
# So the sweep edits labels and sub-issue links, not only issue state. Each
# pass acts only on provable drift, so a re-run with nothing new changes
# nothing. If an intake or planning epic is at its cap (95 open children), the
# orphan pass stops and the step exits 1, listing every issue it did not link:
# a failed run can mean "run intake review", not only a broken token.

on:
  workflow_call:
    inputs:
      container-prefix:
        type: string
        required: false
        default: prod
        description: >-
          Container image name prefix (prod or dev). Defaults to "prod".
      window-days:
        type: string
        required: false
        default: "30"
        description: >-
          How many days back vrg-epic-audit scans for merged PRs whose task
          issue is still open. Epic drift (all children closed) is unbounded.
          Defaults to "30".
    secrets:
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  epic-sweep:
    name: epic-sweep
    runs-on: ubuntu-latest
    container: ghcr.io/vergil-project/${{ inputs.container-prefix || 'prod' }}-base:latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # No 'repositories' input: mint a token for every repo the app is
          # installed on in the org. The sweep closes drifted tasks, edits
          # labels and links or moves orphans across the code repos, AND
          # closes, drains and attaches under epics in .github, so it needs
          # org-wide issues:write, not a two-repo scope like the per-close
          # rollup.

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install vergil-tooling
        uses: vergil-project/vergil-actions/actions/shared/setup/vergil@v2.1.59

      - name: Reconcile epic/task drift, drain archives, attach orphans
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Authorizes the automated --close (the tool is otherwise human-only);
          # see vrg-epic-audit _SWEEP_ENV.
          VRG_EPIC_SWEEP: "1"
          # Pass the input through env, not inline ${{ }} in run: — that trips the
          # semgrep run-shell-injection rule (a workflow_call input is
          # caller-controlled). Reference it double-quoted as "$WINDOW_DAYS".
          WINDOW_DAYS: ${{ inputs.window-days }}
        run: vrg-epic-audit --close --window-days "$WINDOW_DAYS"
