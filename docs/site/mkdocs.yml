site_name: Vergil Actions
site_url: https://vergil-project.github.io/vergil-actions/
site_description: Shared GitHub Actions library for reusable CI and automation
repo_url: https://github.com/vergil-project/vergil-actions
repo_name: vergil-actions
edit_uri: ""

strict: true

docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Releases:
      - Changelog: changelog.md
      - Release Notes:
          - releases/index.md
  - Getting Started: getting-started.md
  - Repository Configuration: configuration.md
  - Action Reference:
      - Overview: actions/index.md
      - CI:
          - ci/security/codeql: actions/ci-security-codeql.md
          - ci/security/semgrep: actions/ci-security-semgrep.md
          - ci/version-bump/version-divergence: actions/ci-version-bump-version-divergence.md
          - ci/matrix: actions/ci-matrix.md
          - ci/toolchain/assert: actions/ci-toolchain-assert.md
          - ci/evidence/emit: actions/ci-evidence-emit.md
      - CD:
          - cd/release/tag-and-release: actions/cd-release-tag-and-release.md
          - cd/release/validate-inputs: actions/cd-release-validate-inputs.md
          - cd/release/ci-evidence-gate: actions/cd-release-ci-evidence-gate.md
          - cd/release/registry-publish: actions/cd-release-registry-publish.md
          - cd/release/ci-evidence-attach: actions/cd-release-ci-evidence-attach.md
          - cd/docs/deploy: actions/cd-docs-deploy.md
      - Ops:
          - ops/github-config/branch-sweep: actions/ops-github-config-branch-sweep.md
      - Shared:
          - shared/security/trivy: actions/shared-security-trivy.md
          - shared/setup/vergil: actions/shared-setup-vergil.md
          - shared/setup/system-packages: actions/shared-setup-system-packages.md
          - shared/setup/build-command: actions/shared-setup-build-command.md
          - shared/docs/stage: actions/shared-docs-stage.md
      - Package:
          - package/setup: actions/package-setup.md
      - Local:
          - local/freeze-internal-refs: actions/local-freeze-internal-refs.md
  - Reusable Workflows:
      - Overview: workflows/index.md
      - ci-docs: workflows/ci-docs.md
      - ci-security: workflows/ci-security.md
      - ci-quality: workflows/ci-quality.md
      - ci-audit: workflows/ci-audit.md
      - ci-test: workflows/ci-test.md
      - ci-version-bump: workflows/ci-version-bump.md
      - ci-package: workflows/ci-package.md
      - cd-release packages: workflows/cd-release-packages.md
      - publish-index: workflows/publish-index.md
      - cd-docs-refresh: workflows/cd-docs-refresh.md
      - ops-epic-rollup: workflows/ops-epic-rollup.md
      - ops-epic-sweep: workflows/ops-epic-sweep.md
  - CI Gate Requirements:
      - Overview: ci-gates/index.md
      - The All-Hard-Gates Principle: ci-gates/all-hard-gates.md
      - Required Checks: ci-gates/required-checks.md
      - Repository Rulesets: ci-gates/repository-rulesets.md
      - Security Scanning: ci-gates/security-scanning.md
  - Development:
      - Overview: development/index.md
      - Environment and Tooling: development/environment-and-tooling.md
      - Validation: development/validation.md
      - Contributing: development/contributing.md
