name: Package toolchain setup
description: >-
  Check a package toolchain image and install vergil-tooling in it, inside a
  package build or install-test container. Package jobs run only in a vergil
  package toolchain image (vergil-containers' prod-pkg-ubuntu and
  prod-pkg-rhel; epic vergil-project/.github#607), which ships the OS
  prerequisites, uv and nFPM preinstalled but no Python and no vergil-tooling.
  The container must run as root (the GitHub Actions container default).
  vergil-tooling is installed from the checkout in vergil-tooling itself,
  otherwise from [dependencies].vergil in vergil.toml. Run it after
  actions/checkout.

inputs:
  nfpm:
    description: >-
      Require nFPM in the toolchain image ("true" in build cells; install-test
      cells leave it off).
    required: false
    default: "false"
  python:
    description: >-
      Python version for the driver vergil-tooling: the interpreter
      `uv tool install` runs it under, and the one detect.sh reads
      vergil.toml with. This is the only place the version is written.
    required: false
    default: "3.15"

runs:
  using: composite
  steps:
    # The image says what it ships in /etc/vergil/package-toolchain.
    # check-toolchain.sh fails the job, with no fallback install, on a raw
    # image (no marker), a marker that leaves out a required tool, a listed
    # tool missing or at another version, or no nfpm when this cell needs it.
    # tests/check-toolchain.test.sh exercises it.
    - name: Check the toolchain image
      shell: bash
      env:
        NEED_NFPM: ${{ inputs.nfpm }}
      run: |
        set -euo pipefail
        args=()
        if [ "$NEED_NFPM" = "true" ]; then
          args+=(--nfpm)
        fi
        bash "${GITHUB_ACTION_PATH}/check-toolchain.sh" "${args[@]}"
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # vergil-tooling lands in uv's tool bin dir (under $HOME), never
    # /usr/local/bin: install-test runs smoke checks with a system-only PATH
    # that must not resolve this copy of vergil-tooling (spec §8.1).
    - name: Install vergil-tooling
      shell: bash
      env:
        VRG_DRIVER_PYTHON: ${{ inputs.python }}
      run: |
        set -euo pipefail
        spec="$(bash "${GITHUB_ACTION_PATH}/detect.sh" .)"
        echo "Installing vergil-tooling: ${spec}"
        uv tool install --python "$VRG_DRIVER_PYTHON" "$spec"
        bin_dir="$(uv tool dir --bin)"
        echo "$bin_dir" >> "$GITHUB_PATH"
        "${bin_dir}/vrg-package" --help >/dev/null
