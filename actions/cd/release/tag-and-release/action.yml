name: Tag and release
description: >-
  Creates an annotated git tag and a GitHub Release.  Rolling minor tags
  (vX.Y) are handled by vrg-promote in the release orchestrator.  All
  mutating steps are skipped when the tag already exists, making the action
  safe to re-run.  Every tag push uses the automation App's installation
  token passed as tag-token, never the checkout's GITHUB_TOKEN.

inputs:
  version:
    description: Semver version string (e.g. 1.2.3).
    required: true
  tag-token:
    description: >-
      The automation App's installation token (from
      actions/create-github-app-token with APP_CLIENT_ID and APP_PRIVATE_KEY,
      Contents write on this repository) that every tag push uses.  The
      action fails before tagging when it is empty.  The GitHub Release is
      still created with the job's GITHUB_TOKEN.
    required: true
  release-title:
    description: >-
      Release title override. Defaults to "<repo-name> v<version>".
    required: false
    default: ""
  release-notes:
    description: >-
      Release notes override. Defaults to a link to the GitHub Pages
      documentation site.
    required: false
    default: ""
  release-artifacts:
    description: >-
      Space-separated glob of files to attach to the GitHub Release.
      Leave empty to create a release with no artifacts.
    required: false
    default: ""
  tag-prefix:
    description: Prefix prepended to the version to form the git tag.
    required: false
    default: v

outputs:
  tag:
    description: The full tag name that was (or would be) created.
    value: ${{ steps.meta.outputs.tag }}
  tag-created:
    description: "'true' if a new tag was created, 'false' if it already existed."
    value: ${{ steps.check.outputs.created }}
runs:
  using: composite
  steps:
    - name: Compute tag name
      id: meta
      shell: bash
      env:
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        VERSION: ${{ inputs.version }}
      run: |
        echo "tag=${TAG_PREFIX}${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Check if tag already exists
      id: check
      shell: bash
      env:
        TAG: ${{ steps.meta.outputs.tag }}
      run: |
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "created=false" >> "$GITHUB_OUTPUT"
        else
          echo "created=true" >> "$GITHUB_OUTPUT"
        fi

    # Fail before any tag is created when there is no App token, rather than
    # tag locally and fail on the push.
    - name: Require the tag token
      if: steps.check.outputs.created == 'true'
      shell: bash
      env:
        TAG_TOKEN: ${{ inputs.tag-token }}
      run: |
        if [ -z "$TAG_TOKEN" ]; then
          echo "::error::tag-and-release: the tag-token input is empty. Release tags are pushed only with the automation App's installation token (actions/create-github-app-token with APP_CLIENT_ID and APP_PRIVATE_KEY), never the checkout's GITHUB_TOKEN. Nothing was tagged."
          exit 1
        fi

    - name: Configure git identity
      if: steps.check.outputs.created == 'true'
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Create annotated tag
      if: steps.check.outputs.created == 'true'
      shell: bash
      env:
        TAG: ${{ steps.meta.outputs.tag }}
        TAG_TOKEN: ${{ inputs.tag-token }}
        VERSION: ${{ inputs.version }}
      run: |
        git tag -a "$TAG" \
          -m "Release $VERSION"
        bash "${GITHUB_ACTION_PATH}/push-tag.sh" origin "$TAG"

    - name: Create GitHub Release
      if: steps.check.outputs.created == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_RELEASE_NOTES: ${{ inputs.release-notes }}
        INPUT_RELEASE_TITLE: ${{ inputs.release-title }}
        INPUT_RELEASE_ARTIFACTS: ${{ inputs.release-artifacts }}
        REPO_NAME: ${{ github.event.repository.name }}
        REPO_OWNER: ${{ github.repository_owner }}
        TAG: ${{ steps.meta.outputs.tag }}
      run: |
        title="$INPUT_RELEASE_TITLE"
        if [ -z "$title" ]; then
          title="${REPO_NAME} ${TAG}"
        fi

        notes="$INPUT_RELEASE_NOTES"
        if [ -z "$notes" ]; then
          notes="Documentation: https://${REPO_OWNER}.github.io/${REPO_NAME}/"
        fi

        release_args=(
          "$TAG"
          --title "$title"
          --notes "$notes"
        )
        if [ -n "$INPUT_RELEASE_ARTIFACTS" ]; then
          release_args+=( $INPUT_RELEASE_ARTIFACTS )
        fi
        gh release create "${release_args[@]}"

    # A tag can reach the remote with missing objects; clone it back and, if
    # that fails, re-push it whole. The re-push is a tag update, so it uses
    # the App token like every other tag push.
    - name: Verify tag is resolvable from remote
      if: steps.check.outputs.created == 'true'
      shell: bash
      env:
        TAG: ${{ steps.meta.outputs.tag }}
        TAG_TOKEN: ${{ inputs.tag-token }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        repo_url="https://github.com/${GITHUB_REPO}"
        tmp="$(mktemp -d)"
        if git clone --depth 1 --branch "$TAG" "$repo_url" "$tmp" 2>/dev/null; then
          rm -rf "$tmp"
          exit 0
        fi
        echo "::warning::Tag $TAG has missing objects on remote — resyncing"
        bash "${GITHUB_ACTION_PATH}/push-tag.sh" --no-thin origin "$TAG" --force
        git clone --depth 1 --branch "$TAG" "$repo_url" "$tmp"
        rm -rf "$tmp"

