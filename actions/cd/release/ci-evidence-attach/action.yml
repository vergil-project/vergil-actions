name: CI evidence attach
description: >-
  Post-publish CI-evidence attach: assemble the complete evidence bundle — now
  including the already-built SBOM — attest it to the pipeline and released
  commit, and attach it to the GitHub Release that tag-and-release just created.
  Runs AFTER tag-and-release (spec §9): the pre-publish completeness gate is done
  by ci-evidence-gate, and by this point both the Release (upload target) and the
  SBOM (bundle content) exist. ENFORCES by default (enforce=true): any failure or
  timeout aborts the release. Passing enforce=false demotes it to a non-fatal
  WARNING — a temporary opt-out, never a permanent soft gate; the step's position
  and steps are identical in both modes. See epic
  vergil-project/.github#140 spec §9, §9.2, §10.

inputs:
  version:
    description: Semver version string (e.g. 2.1.129).
    required: true
  tag:
    description: Release tag the bundle is attached to (e.g. v2.1.129).
    required: true
  enforce:
    description: >-
      Fatality mode. "true" (default, ENFORCING) — a non-zero vrg-ci-evidence
      exit (substantive incompleteness) or a failed attach fails the job.
      "false" (WARNING) — any bundle/attest/upload failure or timeout emits a
      loud warning and the job succeeds; the release is never aborted (a
      temporary opt-out).
    required: false
    default: "true"
  timeout-minutes:
    description: >-
      Upper bound (minutes) on the offline assemble step. Composite steps cannot
      use the step-level timeout-minutes key, so the bound is enforced with the
      coreutils `timeout` command; a timeout is treated as a bundle failure
      (non-fatal in warning mode, fatal in enforcing mode).
    required: false
    default: "15"
  sbom-file:
    description: >-
      Path to the SBOM built earlier in the CD job (by registry-publish).
      Included in the bundle when present so the bundle is self-contained;
      silently skipped when empty or not materialized.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Assemble CI evidence bundle
      id: bundle
      shell: bash
      env:
        ENFORCE: ${{ inputs.enforce }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        VERSION: ${{ inputs.version }}
        SBOM_FILE: ${{ inputs.sbom-file }}
        STAGING: ${{ github.workspace }}/.ci-evidence-staging
      run: |
        # Non-fatal by construction: capture the exit code explicitly instead of
        # letting `set -e` (GitHub's default for composite bash) abort the step,
        # so warning mode can convert any failure into a ::warning:: and exit 0.
        #
        # `vrg-ci-evidence assemble` is fully network-free: it reads the evidence
        # and harvest-state.json that ci-evidence-gate already downloaded into the
        # shared STAGING dir and produces the tarball + standalone manifest into
        # evidence-out. The release's artifacts were downloaded exactly once, by
        # the pre-publish gate's harvest. The SBOM, now built by registry-publish,
        # is folded in here so the bundle is self-contained.
        set +e
        generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        sbom_args=()
        if [ -n "$SBOM_FILE" ]; then
          if [ -f "$SBOM_FILE" ]; then
            sbom_args+=(--sbom-file "$SBOM_FILE")
          else
            echo "::notice::SBOM $SBOM_FILE not present; bundling without it"
          fi
        fi

        timeout "${TIMEOUT_MINUTES}m" vrg-ci-evidence assemble \
          --staging "$STAGING" \
          --version "$VERSION" \
          --generated-at "$generated_at" \
          --out-dir evidence-out \
          "${sbom_args[@]}"
        rc=$?

        if [ "$rc" -eq 0 ]; then
          echo "bundled=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "bundled=false" >> "$GITHUB_OUTPUT"
        if [ "$rc" -eq 124 ]; then
          reason="timed out after ${TIMEOUT_MINUTES}m"
        else
          reason="failed (exit $rc)"
        fi

        if [ "$ENFORCE" = "true" ]; then
          echo "::error::CI evidence bundling $reason — enforcing mode: failing the release" >&2
          exit "$rc"
        fi
        echo "::warning::CI evidence bundling $reason — warning mode: release proceeds without a complete evidence bundle" >&2
        exit 0

    - name: Attest evidence bundle provenance
      if: steps.bundle.outputs.bundled == 'true'
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: evidence-out/*.tar.gz

    - name: Attach evidence bundle to release
      if: steps.bundle.outputs.bundled == 'true'
      shell: bash
      env:
        ENFORCE: ${{ inputs.enforce }}
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        set +e
        gh release upload "$TAG" \
          evidence-out/*.tar.gz \
          evidence-out/*-manifest.json \
          --clobber
        rc=$?

        if [ "$rc" -eq 0 ]; then
          exit 0
        fi
        if [ "$ENFORCE" = "true" ]; then
          echo "::error::Attaching CI evidence bundle to release $TAG failed (exit $rc) — enforcing mode" >&2
          exit "$rc"
        fi
        echo "::warning::Attaching CI evidence bundle to release $TAG failed (exit $rc) — warning mode: release proceeds" >&2
        exit 0
