name: Trivy security scan
description: >-
  Runs Trivy vulnerability scanning, SBOM generation, or container image
  scanning. The calling workflow must grant security-events: write permission
  when scan-type is "fs" or "image".

inputs:
  scan-type:
    description: >-
      Scan mode: "fs" (filesystem vuln scan → SARIF), "sbom" (CycloneDX SBOM
      generation), or "image" (container image scan → SARIF).
    required: true
  scan-ref:
    description: Filesystem path or container image reference to scan.
    required: false
    default: "."
  severity:
    description: Comma-separated severity levels to report.
    required: false
    default: "CRITICAL,HIGH"
  exit-code:
    description: Exit code when vulnerabilities are found (0 = advisory only).
    required: false
    default: "1"
  scanners:
    description: Comma-separated Trivy scanners to enable.
    required: false
    default: "vuln"
  output-file:
    description: Output file path for SARIF or SBOM results.
    required: false
    default: "trivy-results.sarif"
  sarif-category:
    description: >-
      Category for SARIF upload. Use unique values when multiple matrix entries
      upload SARIF to avoid overwrites. When empty, defaults to "trivy-fs" or
      "trivy-image" based on scan-type.
    required: false
    default: ""
  trivyignores:
    description: Comma-separated list of .trivyignore file paths.
    required: false
    default: ""
  trivy-image:
    description: >-
      Docker image to use for Trivy. Defaults to the GitHub Container
      Registry mirror (ghcr.io/aquasecurity/trivy) rather than Docker Hub
      to avoid Docker Hub's anonymous pull rate limits and transient
      registry timeouts. Override to pin a specific version or registry.
    required: false
    default: "ghcr.io/aquasecurity/trivy:0.71.0"
  upload-sarif:
    description: >-
      Upload SARIF results to GitHub code scanning. The uploaded copy
      omits accepted-suppressed results (via vrg-sarif-filter, so
      vergil-tooling must be on PATH); the unfiltered output-file is left
      in the workspace for evidence. Set to "false" on private repos
      without GitHub Advanced Security; results are attached as a build
      artifact instead.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Pull Trivy image (with retry)
      if: >-
        inputs.scan-type == 'fs' || inputs.scan-type == 'image' ||
        inputs.scan-type == 'sbom'
      shell: bash
      env:
        TRIVY_IMAGE: ${{ inputs.trivy-image }}
      run: |
        # Pull the Trivy image up front with bounded retry/backoff so a
        # transient registry hiccup (timeout, rate limit) does not fail the
        # whole scan. Subsequent `docker run` steps reuse this local image
        # and so do not trigger their own pulls. See issue #705.
        set -euo pipefail
        max_attempts=3
        attempt=1
        while true; do
          if docker pull "$TRIVY_IMAGE"; then
            echo "Pulled $TRIVY_IMAGE"
            break
          fi
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "::error::Failed to pull $TRIVY_IMAGE after $max_attempts attempts" >&2
            exit 1
          fi
          backoff=$((attempt * 10))
          echo "::warning::Pull of $TRIVY_IMAGE failed (attempt $attempt/$max_attempts); retrying in ${backoff}s" >&2
          sleep "$backoff"
          attempt=$((attempt + 1))
        done

    - name: Run Trivy filesystem scan
      if: inputs.scan-type == 'fs'
      shell: bash
      env:
        TRIVY_IMAGE: ${{ inputs.trivy-image }}
        SCAN_REF: ${{ inputs.scan-ref }}
        SCANNERS: ${{ inputs.scanners }}
        SEVERITY: ${{ inputs.severity }}
        EXIT_CODE: ${{ inputs.exit-code }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        TRIVYIGNORES: ${{ inputs.trivyignores }}
      run: |
        TRIVYIGNORE_ARGS=""
        if [ -n "$TRIVYIGNORES" ]; then
          TRIVYIGNORE_ARGS="--ignorefile $TRIVYIGNORES"
        fi
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/workspace" \
          -w /workspace \
          -e SCANNERS \
          -e SEVERITY \
          -e EXIT_CODE \
          -e OUTPUT_FILE \
          -e SCAN_REF \
          -e TRIVYIGNORE_ARGS \
          --entrypoint sh \
          "$TRIVY_IMAGE" \
          -c '
            set -e
            # Skip the pip-vendored CycloneDX SBOM (pip/_vendor/bom.cdx.json).
            # pip 26.x ships it to describe the packages pip vendors; Trivy
            # would otherwise ingest it and report those vendored packages
            # (e.g. setuptools, msgpack) as findings, though they are pip
            # internals, not part of the scan target attack surface. See #796.
            trivy fs \
              --scanners "$SCANNERS" \
              --severity "$SEVERITY" \
              --exit-code 0 \
              --format json \
              --output /tmp/trivy-raw.json \
              --skip-files "**/pip/_vendor/bom.cdx.json" \
              $TRIVYIGNORE_ARGS \
              "$SCAN_REF"
            trivy convert \
              --severity "$SEVERITY" \
              --format table \
              --exit-code 0 \
              /tmp/trivy-raw.json
            trivy convert \
              --severity "$SEVERITY" \
              --format sarif \
              --exit-code "$EXIT_CODE" \
              --output "/workspace/$OUTPUT_FILE" \
              /tmp/trivy-raw.json
          '

    - name: Run Trivy image scan
      if: inputs.scan-type == 'image'
      shell: bash
      env:
        TRIVY_IMAGE: ${{ inputs.trivy-image }}
        SCAN_REF: ${{ inputs.scan-ref }}
        SCANNERS: ${{ inputs.scanners }}
        SEVERITY: ${{ inputs.severity }}
        EXIT_CODE: ${{ inputs.exit-code }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        TRIVYIGNORES: ${{ inputs.trivyignores }}
      run: |
        TRIVYIGNORE_ARGS=""
        if [ -n "$TRIVYIGNORES" ]; then
          TRIVYIGNORE_ARGS="--ignorefile $TRIVYIGNORES"
        fi
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/workspace" \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -w /workspace \
          -e SCANNERS \
          -e SEVERITY \
          -e EXIT_CODE \
          -e OUTPUT_FILE \
          -e SCAN_REF \
          -e TRIVYIGNORE_ARGS \
          --entrypoint sh \
          "$TRIVY_IMAGE" \
          -c '
            set -e
            # Skip the pip-vendored CycloneDX SBOM (pip/_vendor/bom.cdx.json).
            # pip 26.x ships it to describe the packages pip vendors; Trivy
            # would otherwise ingest it and report those vendored packages
            # (e.g. setuptools, msgpack) as findings, though they are pip
            # internals, not part of the scan target attack surface. See #796.
            trivy image \
              --scanners "$SCANNERS" \
              --severity "$SEVERITY" \
              --exit-code 0 \
              --format json \
              --output /tmp/trivy-raw.json \
              --skip-files "**/pip/_vendor/bom.cdx.json" \
              $TRIVYIGNORE_ARGS \
              "$SCAN_REF"
            trivy convert \
              --severity "$SEVERITY" \
              --format table \
              --exit-code 0 \
              /tmp/trivy-raw.json
            trivy convert \
              --severity "$SEVERITY" \
              --format sarif \
              --exit-code "$EXIT_CODE" \
              --output "/workspace/$OUTPUT_FILE" \
              /tmp/trivy-raw.json
          '

    # Code scanning does not honor SARIF `suppressions`, so upload a filtered
    # copy with accepted-suppressed results removed (same semantics as the
    # SARIF gate). The unfiltered output-file stays on disk for the evidence
    # bundle so suppressions remain auditable (issue #920). The filesystem
    # and image scans are mutually exclusive, so one filter + upload pair
    # serves both.
    - name: Filter accepted-suppressed results for upload
      id: filter
      if: >-
        (inputs.scan-type == 'fs' || inputs.scan-type == 'image') &&
        inputs.upload-sarif == 'true' && always()
      shell: bash
      env:
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        upload_file="${OUTPUT_FILE%.sarif}.upload.sarif"
        echo "upload-file=$upload_file" >> "$GITHUB_OUTPUT"
        if [ ! -f "$OUTPUT_FILE" ]; then
          echo "::warning::$OUTPUT_FILE not found; nothing to filter (the upload step will report the missing file)"
          exit 0
        fi
        vrg-sarif-filter "$OUTPUT_FILE" "$upload_file"

    - name: Upload SARIF
      if: >-
        (inputs.scan-type == 'fs' || inputs.scan-type == 'image') &&
        inputs.upload-sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.filter.outputs.upload-file }}
        category: ${{ inputs.sarif-category || format('trivy-{0}', inputs.scan-type) }}

    - name: Attach SARIF as build artifact
      if: >-
        (inputs.scan-type == 'fs' || inputs.scan-type == 'image') &&
        inputs.upload-sarif != 'true' && always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.sarif-category || format('trivy-{0}', inputs.scan-type) }}-sarif
        path: ${{ inputs.output-file }}
        if-no-files-found: warn

    - name: Generate SBOM
      if: inputs.scan-type == 'sbom'
      shell: bash
      env:
        TRIVY_IMAGE: ${{ inputs.trivy-image }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        SCAN_REF: ${{ inputs.scan-ref }}
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/workspace" \
          -w /workspace \
          "$TRIVY_IMAGE" \
          fs \
          --format cyclonedx \
          --output "/workspace/$OUTPUT_FILE" \
          "$SCAN_REF"
