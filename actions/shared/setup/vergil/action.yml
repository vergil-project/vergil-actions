name: Install vergil-tooling
description: >-
  Reads the pinned vergil version from vergil.toml and installs vergil-tooling
  through install-tooling.sh with `uv tool install` from git, on a uv-managed
  Python 3.15 (`--python 3.15 --managed-python`, with `--no-config` and the
  job's UV_PYTHON, UV_PYTHON_PREFERENCE and UV_NO_MANAGED_PYTHON cleared). A
  released ref (vX.Y or vX.Y.Z) is resolved once, with `git ls-remote`, to the
  commit of one vX.Y.Z tag (for a line, its newest), and that commit is
  installed, constrained by its own uv.lock read over git; a dev ref installs
  unconstrained. In a container job on a Vergil image the install uses the
  image's managed Python from VERGIL_CORE_PYTHON_DIR and never downloads one.
  The vrg-* commands land in uv's tool bin directory, which is added to PATH
  and checked. Nothing reads the vergil package repository, and a failure
  fails the job (epic vergil-project/.github#1350). When the consumer repo is
  vergil-tooling itself it runs `uv sync` instead, so CI validates the PR's
  code (on a host runner with `--python 3.15`, uv providing that interpreter;
  in a container pinned to the image's interpreter with
  UV_PYTHON_PREFERENCE=only-system). A path that needs uv and finds none
  installs a pinned, hash-checked uv release; uv is never installed with pip
  (epic vergil-project/.github#649).

  Then resolves the CI version set by calling the single resolver,
  `vrg-ci-resolve`, against the published language version window, and
  exposes its answer as the `versions` (JSON array), `primary-version`,
  `primary-container-tag`, `container-tags`, `container-suffixes` and
  `build-enabled` outputs,
  so reusable workflows read their matrix from the resolver rather than from
  hardcoded inputs (epics vergil-project/.github#338 and #407).

inputs:
  install-source:
    description: >-
      `auto` (the default) or `git`, which install the same way: `uv tool
      install` from git, never from the vergil apt repository, with a line pin
      (vX.Y) installing the newest vX.Y.Z release tag in that line, not the
      floating vX.Y tag (epic vergil-project/.github#1350). `git` stays for the
      callers that set it, such as publish-index's build-index. Any other
      value fails the job.
    required: false
    default: auto
  version-window:
    description: >-
      Path to a local window.json for the resolver to read instead of the
      published window, exported as VRG_VERSION_WINDOW for the Derive step.
      For tests only: leave it empty in real workflows so the resolver reads
      the window published at the [dependencies].vergil ref.
    required: false
    default: ""

outputs:
  versions:
    description: >-
      The resolved CI versions, newest first, as a compact JSON array string
      (e.g. '["3.14","3.13","3.12"]'). Consumed by the `matrix` job to fan out
      per-version legs.
    value: ${{ steps.derive.outputs.versions }}
  primary-version:
    description: >-
      The primary version: `[ci].primary-version` when set, otherwise the
      newest resolved version. Consumed by single-container jobs and the
      run-once kinds.
    value: ${{ steps.derive.outputs.primary-version }}
  primary-container-tag:
    description: >-
      The image tag of the primary version, as the resolver gives it
      (clang-20 -> 20, node-24 -> 24, 3.14 -> 3.14, latest -> latest).
      Consumed by the single-container jobs `common` and `custom`
      (ci-quality) and `version-bump` (ci-version-bump).
    value: ${{ steps.derive.outputs.primary-container-tag }}
  container-tags:
    description: >-
      Compact JSON object mapping each resolved version to its image tag
      (e.g. '{"clang-20":"20","gcc-14":"14"}'). Consumed by actions/ci/matrix.
    value: ${{ steps.derive.outputs.container-tags }}
  container-suffixes:
    description: >-
      Compact JSON object mapping each resolved version to its image suffix
      (e.g. '{"clang-20":"cpp-clang","gcc-14":"cpp-gcc"}'). Consumed by
      actions/ci/matrix.
    value: ${{ steps.derive.outputs.container-suffixes }}
  build-enabled:
    description: >-
      "true" when vergil-tooling turns the BUILD check on for the repo's
      language (`vrg-ci-resolve`'s `build-enabled`), else "false". A
      vergil-tooling release older than the field gives "false". ci-quality's
      `matrix` job passes it on, and its `build` job runs only when it is
      "true" (epic vergil-project/.github#1174).
    value: ${{ steps.derive.outputs.build-enabled }}
  tooling-version:
    description: >-
      The vergil-tooling release the install step installed, as the installed
      environment's package metadata gives it (for example 2.1.349), whatever
      the pin: a line pin (vX.Y) gives the release it resolved to. ci-quality
      passes it to ci/evidence/reports, whose report contract names some
      reports only from the release that writes them (issue #1452).
    value: ${{ steps.install.outputs.tooling-version }}

runs:
  using: composite
  steps:
    - name: Mark workspace safe for git
      shell: bash
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}"

    # install-tooling.sh reads the [dependencies].vergil pin itself, through
    # read-pin.sh (which emits the ::error:: annotation when it is missing or
    # invalid), and logs the ref, tag and SHA it installs. Its `uv tool
    # install` and lock export clear the job's uv interpreter variables and
    # pass --no-config; its self-repo `uv sync` carries the
    # UV_PYTHON_PREFERENCE pin.
    - name: Install vergil-tooling
      id: install
      shell: bash
      env:
        INSTALL_SOURCE: ${{ inputs.install-source }}
      run: bash "${GITHUB_ACTION_PATH}/install-tooling.sh"

    # Calls vrg-ci-resolve (installed by the step above). A step-level env key
    # cannot be set conditionally, so the optional `version-window` input rides
    # as VERSION_WINDOW and derive.sh exports it as VRG_VERSION_WINDOW only
    # when it is non-empty: an unset input never overrides the published window.
    - name: Derive CI versions with vrg-ci-resolve
      id: derive
      shell: bash
      env:
        VERSION_WINDOW: ${{ inputs.version-window }}
      run: bash "${GITHUB_ACTION_PATH}/derive.sh"
