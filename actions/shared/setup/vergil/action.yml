name: Install vergil-tooling
description: >-
  Reads the pinned vergil version from vergil.toml and installs vergil-tooling
  through install-tooling.sh, which chooses the install path by explicit
  checks and logs the one it took: the packaged install from the vergil apt
  repository (on a host runner, after setting up that repository with its key
  checked against the pinned fingerprint; in a container job, when the image
  has both the vergil apt source and a core Python), `uv tool install` from
  git (a dev tag, an image with neither, or `install-source: git`), or, when
  the consumer repo is vergil-tooling itself, `uv sync` (pinned to the image's
  interpreter with UV_PYTHON_PREFERENCE=only-system) so CI validates the PR's
  code instead of the released version. A path that needs uv and finds none
  installs a pinned, hash-checked uv release; uv is never installed with pip
  (epic vergil-project/.github#649).

  Then resolves the CI version set by calling the single resolver,
  `vrg-ci-resolve`, against the published language version window, and
  exposes its answer as the `versions` (JSON array), `primary-version`,
  `primary-container-tag`, `container-tags` and `container-suffixes` outputs,
  so reusable workflows read their matrix from the resolver rather than from
  hardcoded inputs (epics vergil-project/.github#338 and #407).

inputs:
  install-source:
    description: >-
      `auto` (the default) chooses the install path from the tag and the
      environment. `git` always installs vergil-tooling with `uv tool install`
      from git, never from the vergil apt repository: for the job that rebuilds
      that repository's index (publish-index's build-index), which must not
      depend on the index it is about to repair.
    required: false
    default: auto
  version-window:
    description: >-
      Path to a local window.json for the resolver to read instead of the
      published window, exported as VRG_VERSION_WINDOW for the Derive step.
      For tests only: leave it empty in real workflows so the resolver reads
      the window published at the [dependencies].vergil ref.
    required: false
    default: ""

outputs:
  versions:
    description: >-
      The resolved CI versions, newest first, as a compact JSON array string
      (e.g. '["3.14","3.13","3.12"]'). Consumed by the `matrix` job to fan out
      per-version legs.
    value: ${{ steps.derive.outputs.versions }}
  primary-version:
    description: >-
      The primary version: `[ci].primary-version` when set, otherwise the
      newest resolved version. Consumed by single-container jobs and the
      run-once kinds.
    value: ${{ steps.derive.outputs.primary-version }}
  primary-container-tag:
    description: >-
      The image tag of the primary version, as the resolver gives it
      (clang-20 -> 20, node-24 -> 24, 3.14 -> 3.14, latest -> latest).
      Consumed by the single-container jobs `common` and `custom`
      (ci-quality) and `version-bump` (ci-version-bump).
    value: ${{ steps.derive.outputs.primary-container-tag }}
  container-tags:
    description: >-
      Compact JSON object mapping each resolved version to its image tag
      (e.g. '{"clang-20":"20","gcc-14":"14"}'). Consumed by actions/ci/matrix.
    value: ${{ steps.derive.outputs.container-tags }}
  container-suffixes:
    description: >-
      Compact JSON object mapping each resolved version to its image suffix
      (e.g. '{"clang-20":"cpp-clang","gcc-14":"cpp-gcc"}'). Consumed by
      actions/ci/matrix.
    value: ${{ steps.derive.outputs.container-suffixes }}

runs:
  using: composite
  steps:
    - name: Mark workspace safe for git
      shell: bash
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}"

    # install-tooling.sh reads the [dependencies].vergil pin itself, through
    # read-pin.sh (which emits the ::error:: annotation when it is missing or
    # invalid), and logs which install path it took. Its `uv tool install`
    # commands need no UV_PYTHON_PREFERENCE pin: uv tool commands ignore a
    # project's uv settings; its self-repo `uv sync` carries the pin.
    - name: Install vergil-tooling
      shell: bash
      env:
        INSTALL_SOURCE: ${{ inputs.install-source }}
      run: bash "${GITHUB_ACTION_PATH}/install-tooling.sh"

    # Calls vrg-ci-resolve (installed by the step above). A step-level env key
    # cannot be set conditionally, so the optional `version-window` input rides
    # as VERSION_WINDOW and derive.sh exports it as VRG_VERSION_WINDOW only
    # when it is non-empty: an unset input never overrides the published window.
    - name: Derive CI versions with vrg-ci-resolve
      id: derive
      shell: bash
      env:
        VERSION_WINDOW: ${{ inputs.version-window }}
      run: bash "${GITHUB_ACTION_PATH}/derive.sh"
