name: Install vergil-tooling
description: >-
  Reads the pinned vergil version from vergil.toml
  and installs it via uv tool install. When the consumer repo is
  vergil-tooling itself, runs uv sync to install from source so CI
  validates the PR's code instead of the released version.

  Then resolves the CI version set by calling the single resolver,
  `vrg-ci-resolve`, against the published language version window, and
  exposes its answer as the `versions` (JSON array), `primary-version`,
  `primary-container-tag`, `container-tags` and `container-suffixes` outputs,
  so reusable workflows read their matrix from the resolver rather than from
  hardcoded inputs (epics vergil-project/.github#338 and #407).

inputs:
  version-window:
    description: >-
      Path to a local window.json for the resolver to read instead of the
      published window, exported as VRG_VERSION_WINDOW for the Derive step.
      For tests only: leave it empty in real workflows so the resolver reads
      the window published at the [dependencies].vergil ref.
    required: false
    default: ""

outputs:
  versions:
    description: >-
      The resolved CI versions, newest first, as a compact JSON array string
      (e.g. '["3.14","3.13","3.12"]'). Consumed by the `matrix` job to fan out
      per-version legs.
    value: ${{ steps.derive.outputs.versions }}
  primary-version:
    description: >-
      The primary version: `[ci].primary-version` when set, otherwise the
      newest resolved version. Consumed by single-container jobs and the
      run-once kinds.
    value: ${{ steps.derive.outputs.primary-version }}
  primary-container-tag:
    description: >-
      The image tag of the primary version, as the resolver gives it
      (clang-20 -> 20, node-24 -> 24, 3.14 -> 3.14, latest -> latest).
      Consumed by the single-container jobs `common` (ci-quality) and
      `version-bump` (ci-version-bump).
    value: ${{ steps.derive.outputs.primary-container-tag }}
  container-tags:
    description: >-
      Compact JSON object mapping each resolved version to its image tag
      (e.g. '{"clang-20":"20","gcc-14":"14"}'). Consumed by actions/ci/matrix.
    value: ${{ steps.derive.outputs.container-tags }}
  container-suffixes:
    description: >-
      Compact JSON object mapping each resolved version to its image suffix
      (e.g. '{"clang-20":"cpp-clang","gcc-14":"cpp-gcc"}'). Consumed by
      actions/ci/matrix.
    value: ${{ steps.derive.outputs.container-suffixes }}

runs:
  using: composite
  steps:
    - name: Mark workspace safe for git
      shell: bash
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}"

    - name: Check for uv
      id: check-uv
      shell: bash
      run: |
        if command -v uv &>/dev/null; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install uv
      if: steps.check-uv.outputs.found == 'false'
      shell: bash
      run: pip install --break-system-packages uv

    - name: Install vergil-tooling
      shell: bash
      run: |
        if grep -q '^name = "vergil-tooling"' pyproject.toml 2>/dev/null; then
          echo "Consumer repo is vergil-tooling itself — installing from source"
          uv sync --frozen --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          exit 0
        fi

        # read-pin.sh emits the ::error:: annotation and exits non-zero when
        # vergil.toml or [dependencies].vergil is missing, invalid, or empty.
        TAG=$(bash "${GITHUB_ACTION_PATH}/read-pin.sh") || exit 1
        uv tool install "vergil-tooling @ git+https://github.com/vergil-project/vergil-tooling@${TAG}"

    # Calls vrg-ci-resolve (installed by the step above). A step-level env key
    # cannot be set conditionally, so the optional `version-window` input rides
    # as VERSION_WINDOW and derive.sh exports it as VRG_VERSION_WINDOW only
    # when it is non-empty: an unset input never overrides the published window.
    - name: Derive CI versions with vrg-ci-resolve
      id: derive
      shell: bash
      env:
        VERSION_WINDOW: ${{ inputs.version-window }}
      run: bash "${GITHUB_ACTION_PATH}/derive.sh"
