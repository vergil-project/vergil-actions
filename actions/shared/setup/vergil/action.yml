name: Install vergil-tooling
description: >-
  Reads the pinned vergil version from vergil.toml
  and installs it via uv tool install. When the consumer repo is
  vergil-tooling itself, runs uv sync to install from source so CI
  validates the PR's code instead of the released version.

  Also derives the CI version set from vergil.toml and exposes it as the
  `versions` (JSON array), `primary-version`, and `primary-container-tag`
  outputs, so reusable workflows read their matrix from vergil.toml rather than
  hardcoded inputs (epic vergil-project/.github#338).

inputs:
  language:
    description: >-
      Primary language of the calling repo (e.g. python, cpp, shell). Optional:
      used only to family-route `primary-container-tag` for family-on-token
      languages (cpp, typescript), mirroring actions/ci/matrix/resolve.sh. When
      omitted, `primary-container-tag` is the primary version verbatim.
    required: false
    default: ""

outputs:
  versions:
    description: >-
      The `[ci].versions` list from vergil.toml as a compact JSON array
      string (e.g. '["3.12","3.13","3.14"]'). Consumed by the `matrix` job to
      fan out per-version legs.
    value: ${{ steps.derive.outputs.versions }}
  primary-version:
    description: >-
      The single primary version: `[ci].primary-version` when set explicitly,
      otherwise the highest entry in `[ci].versions` by natural/semantic sort.
      Consumed by single-container jobs and as the run-once container tag.
    value: ${{ steps.derive.outputs.primary-version }}
  primary-container-tag:
    description: >-
      The family-routed container tag of the primary version: for
      family-on-token languages (cpp, typescript) the part after the family
      prefix (clang-20 -> 20), mirroring actions/ci/matrix/resolve.sh; every
      other language keeps the version verbatim (3.14 -> 3.14, latest ->
      latest). Consumed by the single-container jobs `common` (ci-quality) and
      `version-bump` (ci-version-bump) so they resolve prod-cpp-clang:20, not
      the nonexistent prod-cpp-clang:clang-20 (issue #893).
    value: ${{ steps.derive.outputs.primary-container-tag }}

runs:
  using: composite
  steps:
    - name: Mark workspace safe for git
      shell: bash
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}"

    - name: Check for uv
      id: check-uv
      shell: bash
      run: |
        if command -v uv &>/dev/null; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install uv
      if: steps.check-uv.outputs.found == 'false'
      shell: bash
      run: pip install --break-system-packages uv

    - name: Install vergil-tooling
      shell: bash
      run: |
        if grep -q '^name = "vergil-tooling"' pyproject.toml 2>/dev/null; then
          echo "Consumer repo is vergil-tooling itself — installing from source"
          uv sync --frozen --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          exit 0
        fi

        TAG=$(python3 -c "
        import tomllib, pathlib
        cfg = tomllib.loads(pathlib.Path('vergil.toml').read_text())
        print(cfg['dependencies']['vergil'])
        ")
        if [ -z "${TAG:-}" ]; then
          echo "::error::vergil.toml not found or missing vergil version"
          exit 1
        fi
        uv tool install "vergil-tooling @ git+https://github.com/vergil-project/vergil-tooling@${TAG}"

    - name: Derive CI versions from vergil.toml
      id: derive
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
      run: bash "${GITHUB_ACTION_PATH}/derive.sh"
