name: Semgrep SAST scan
description: >-
  Runs Semgrep static analysis with language-specific and cross-cutting
  security rulesets. The calling workflow must grant security-events: write
  permission.

inputs:
  language:
    description: >-
      Language ruleset to enable (maps to "p/<language>", e.g. "python",
      "java", "golang"). Languages without a Semgrep registry ruleset
      are silently skipped.
    required: true
  extra-config:
    description: >-
      Additional Semgrep config strings, space-separated (e.g.
      "p/owasp-top-ten").
    required: false
    default: ""
  upload-sarif:
    description: >-
      Upload SARIF results to GitHub code scanning. The uploaded copy
      omits accepted-suppressed results (via vrg-sarif-filter, so
      vergil-tooling must be on PATH); the unfiltered
      semgrep-results.sarif is left in the workspace for evidence. Set to
      "false" on private repos without GitHub Advanced Security; results
      are attached as a build artifact instead.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Run Semgrep scan
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        EXTRA_CONFIG: ${{ inputs.extra-config }}
      run: |
        args=(--language "$LANGUAGE")

        if find . -name "Dockerfile*" -not -path './.git/*' | head -1 | grep -q .; then
          args+=(--has-dockerfiles)
        fi

        if find .github/workflows -name "*.yml" -o -name "*.yaml" 2>/dev/null \
            | head -1 | grep -q .; then
          args+=(--has-workflows)
        fi

        if [ -n "$EXTRA_CONFIG" ]; then
          read -ra extra <<< "$EXTRA_CONFIG"
          args+=(--extra-config "${extra[@]}")
        fi

        vrg-semgrep-scan "${args[@]}"

    # Code scanning does not honor SARIF `suppressions`, so an accepted
    # (nosemgrep) finding that the gate passes would still fail GitHub's
    # "Semgrep OSS" check. Upload a filtered copy with accepted-suppressed
    # results removed (same semantics as the gate); the unfiltered
    # semgrep-results.sarif stays on disk for the evidence bundle so the
    # suppressions remain auditable (issue #920).
    - name: Filter accepted-suppressed results for upload
      if: inputs.upload-sarif == 'true' && always()
      shell: bash
      run: |
        if [ ! -f semgrep-results.sarif ]; then
          echo "::warning::semgrep-results.sarif not found; nothing to filter (the upload step will report the missing file)"
          exit 0
        fi
        vrg-sarif-filter semgrep-results.sarif semgrep-results.upload.sarif

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: semgrep-results.upload.sarif
        category: semgrep

    - name: Attach SARIF as build artifact
      if: inputs.upload-sarif != 'true' && always()
      uses: actions/upload-artifact@v7
      with:
        name: semgrep-sarif
        path: semgrep-results.sarif
        if-no-files-found: warn
