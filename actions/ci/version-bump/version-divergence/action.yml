name: Version divergence gate
description: >-
  Verifies that the PR branch version differs from the main branch version.
  Fails the step if the two versions are identical.

inputs:
  head-version-command:
    description: >-
      Shell command that prints the HEAD (PR branch) version to stdout.
    required: true
  main-version-command:
    description: >-
      Shell command that prints the main branch version to stdout.
    required: true

outputs:
  head-version:
    description: The version extracted from the PR branch.
    value: ${{ steps.compare.outputs.head_version }}
  main-version:
    description: The version extracted from the main branch.
    value: ${{ steps.compare.outputs.main_version }}
  diverged:
    description: "'true' if versions differ, 'false' otherwise."
    value: ${{ steps.compare.outputs.diverged }}

runs:
  using: composite
  steps:
    - name: Mark workspace safe for git
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Fetch main branch
      shell: bash
      run: |
        # A missing origin/main is a legitimate bootstrap / pre-release state:
        # nothing ships without main, so there is no published version to
        # diverge from. Treat that as a first-release no-op rather than a hard
        # failure, while still letting genuine fetch/network errors fail.
        if git rev-parse --verify origin/main >/dev/null 2>&1; then
          exit 0
        fi
        ls_remote_rc=0
        git ls-remote --exit-code --heads origin main >/dev/null 2>&1 || ls_remote_rc=$?
        case "$ls_remote_rc" in
          0)
            git fetch origin main --depth=1
            ;;
          2)
            echo "origin/main does not exist on the remote; treating as a" \
              "first-release no-op (no published version to diverge from)."
            ;;
          *)
            echo "Failed to query the remote for main" \
              "(git ls-remote exit ${ls_remote_rc})." >&2
            exit "$ls_remote_rc"
            ;;
        esac

    - name: Compare versions
      id: compare
      shell: bash
      env:
        HEAD_VERSION_CMD: ${{ inputs.head-version-command }}
        MAIN_VERSION_CMD: ${{ inputs.main-version-command }}
      run: |
        head_version=$(eval "$HEAD_VERSION_CMD")
        main_version=$(eval "$MAIN_VERSION_CMD" 2>/dev/null) || main_version=""
        if vrg-version-divergence "$head_version" ${main_version:+"$main_version"}; then
          echo "diverged=true" >> "$GITHUB_OUTPUT"
        else
          echo "diverged=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
